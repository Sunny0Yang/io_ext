name: "scx_io eBPF 函数钩子边界开销监控"
id: "scx_io_bpf_hook_cost"
type: "system"
class_name: "ScxIoBpfHookCostScene"
module_path: "vm.scene.block_bpf.scx_io_bpf_hook_cost"
parameters:
  duration: 300
  output_dir: "/home/anon/ioext-bench/test_results/block_bpf/scx_io_bpf_hook_cost"
  output_file: "/home/anon/ioext-bench/test_results/block_bpf/scx_io_bpf_hook_cost/scx_io_bpf_hook_cost.bpftrace.log"
  summary_file: "/home/anon/ioext-bench/test_results/block_bpf/scx_io_bpf_hook_cost/scx_io_bpf_hook_cost_summary.json"
  require_events: false
  privilege:
    method: "sudo_nopasswd"
    askpass_script: ""
    env_var: "SUDO_PASSWORD"
