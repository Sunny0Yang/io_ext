name: "scx_io 并发锁竞争监控"
id: "scx_io_lock_contention"
type: "system"
class_name: "ScxIoLockContentionScene"
module_path: "vm.scene.block_bpf.scx_io_lock_contention"
parameters:
  duration: 300
  output_dir: "/home/anon/ioext-bench/test_results/block_bpf/scx_io_lock_contention"
  output_file: "/home/anon/ioext-bench/test_results/block_bpf/scx_io_lock_contention/scx_io_lock_contention.bpftrace.log"
  summary_file: "/home/anon/ioext-bench/test_results/block_bpf/scx_io_lock_contention/scx_io_lock_contention_summary.json"
  # 依赖 CONFIG_LOCK_STAT，且竞争不一定在短 smoke 中出现；默认只记录不强制。
  require_events: false
  privilege:
    method: "sudo_nopasswd"
    askpass_script: ""
    env_var: "SUDO_PASSWORD"
