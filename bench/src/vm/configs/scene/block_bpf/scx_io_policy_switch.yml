name: "scx_io 策略热切换与排空监控"
id: "scx_io_policy_switch"
type: "system"
class_name: "ScxIoPolicySwitchScene"
module_path: "vm.scene.block_bpf.scx_io_policy_switch"
parameters:
  duration: 300
  output_dir: "/home/anon/ioext-bench/test_results/block_bpf/scx_io_policy_switch"
  output_file: "/home/anon/ioext-bench/test_results/block_bpf/scx_io_policy_switch/scx_io_policy_switch.bpftrace.log"
  summary_file: "/home/anon/ioext-bench/test_results/block_bpf/scx_io_policy_switch/scx_io_policy_switch_summary.json"
  # 切换/摘除需要实验动作触发；默认不强制，具体热切换任务可覆盖为 true。
  require_events: false
  privilege:
    method: "sudo_nopasswd"
    askpass_script: ""
    env_var: "SUDO_PASSWORD"
