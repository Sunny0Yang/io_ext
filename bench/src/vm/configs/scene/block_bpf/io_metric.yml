name: "低开销 BPF I/O 指标场景"
id: "io_metric"
type: "system"
class_name: "BpftraceIoMetricScene"
module_path: "vm.scene.block_bpf.io_metric"
parameters:
  # Phase 4.2：只挂 block_rq_issue/block_rq_complete 两个 tracepoint，避免每次 I/O 都 printf。
  # bpftrace 在 Ctrl-C/SIGINT 时统一打印 summary，场景再解析 count/bytes/service_ns。
  duration: 300  # 作为 global_scene 时 controller 会设置为 0，持续到 step 完成后停止。
  output_dir: "/home/anon/ioext-bench/test_results/block_bpf/io_metric/global"
  # 使用相对路径：正常 playbook 复制到 /home/anon/ioext-bench 后可从实验目录解析；
  # 开发时也可直接从仓库根目录运行 VM smoke，避免硬编码共享目录导致脚本缺失。
  script_path: "src/vm/assets/block_bpf/io_metric.bt"
  bpftrace_bin: "bpftrace"
  startup_grace_sec: 0.8  # 给 bpftrace 编译/attach 一点时间，再启动 keepalive 写 I/O。
  poll_interval_sec: 0.2
  require_events: true  # 没有 block_rq_complete 事件则失败，避免只证明 bpftrace 启动过。

  # 默认使用 sudo；VM 测试机通常已配置免密 sudo。需要密码时可切到 sudo_askpass。
  privilege:
    method: "sudo_nopasswd"  # sudo_askpass/sudo_cache/sudo_nopasswd/none
    askpass_script: ""
    env_var: "SUDO_PASSWORD"
