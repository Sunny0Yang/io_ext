name: "块层排队驻留分布探针"
id: "dweller"
type: "system"
class_name: "BlockIoDwellScene"
module_path: "vm.scene.block_bpf.dweller"
parameters:
  duration: 300
  output_dir: "./test_results/block_bpf/dweller"
  output_file: "./test_results/block_bpf/dweller/dweller.bpftrace.log"
  summary_file: "./test_results/block_bpf/dweller/dweller_summary.json"
  require_events: false
  privilege:
    method: "sudo_nopasswd"
    askpass_script: ""
    env_var: "SUDO_PASSWORD"