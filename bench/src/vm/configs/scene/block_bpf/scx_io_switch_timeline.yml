name: "scx_io 热切换时序监控"
id: "scx_io_switch_timeline"
type: "system"
class_name: "ScxIoSwitchTimelineScene"
module_path: "vm.scene.block_bpf.scx_io_switch_timeline"
parameters:
  duration: 300
  output_dir: "/home/anon/ioext-bench/test_results/block_bpf/scx_io_switch_timeline"
  output_file: "/home/anon/ioext-bench/test_results/block_bpf/scx_io_switch_timeline/scx_io_switch_timeline.bpftrace.log"
