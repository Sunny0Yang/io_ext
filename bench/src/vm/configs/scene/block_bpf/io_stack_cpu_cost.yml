name: "IO 栈块层软件路径耗时（io_start→issue）"
id: "io_stack_cpu_cost"
type: "system"
class_name: "IoStackCpuCostScene"
module_path: "vm.scene.block_bpf.io_stack_cpu_cost"
parameters:
  duration: 300
  # 默认输出目录只用于独立运行；task 中会覆盖到 global/keepalive 专用目录。
  output_dir: "/home/anon/ioext-bench/test_results/block_bpf/io_stack_cpu_cost"
  output_file: "/home/anon/ioext-bench/test_results/block_bpf/io_stack_cpu_cost/io_stack_cpu_cost.bpftrace.log"
  summary_file: "/home/anon/ioext-bench/test_results/block_bpf/io_stack_cpu_cost/io_stack_cpu_cost_summary.json"
  # true 表示 collect 阶段必须看到 io_start/issue/path latency 样本，避免 bpftrace 空跑也被判成功。
  require_events: true
  privilege:
    # VM smoke 走 sudo_nopasswd；若本地交互运行需要密码，可改为 sudo_askpass 并设置 env_var。
    method: "sudo_nopasswd"
    askpass_script: ""
    env_var: "SUDO_PASSWORD"
