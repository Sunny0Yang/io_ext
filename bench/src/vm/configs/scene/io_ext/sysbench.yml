name: "io-ext sysbench OLTP workload template"
id: "ioext_sysbench_oltp_workload"
type: "io_ext"
class_name: "IoExtSysbenchScene"
module_path: "vm.scene.io_ext.sysbench"
parameters:
  target_device: "nvme0n1"
  scheduler: "default"
  job_name: "ioext_sysbench_oltp"
  sysbench:
    test: "oltp_read_only"
    mysql_host: "localhost"
    mysql_port: 3306
    mysql_user: "root"
    mysql_password: ""
    mysql_db: "sbtest"
    tables: 1
    table_size: 10000
    threads: 1
    time: 60
    rand_type: "uniform"
  io_ext:
    cgroup:
      path: "/sys/fs/cgroup/ioext_sysbench_oltp_workload"
      controllers: ["io"]
      io_weight: 100
      io_max:
        rbps: "max"
        wbps: "max"
        riops: "max"
        wiops: "max"
  drop_caches_before_run: true
  cooldown_sec: 1
  output_dir: "./test_results/io_ext/sysbench"
