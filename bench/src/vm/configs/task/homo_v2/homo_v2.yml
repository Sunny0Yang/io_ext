tenant_groups:
  elev_elev_n_none:
    count: 1
    scene_id_template: hv_elev_n_none_job
    template:
      base_scene: scene/io_ext/fio.yml
      parameters:
        target_device: sdb
        file_name: /dev/sdb
        output_dir: /dev/shm/ioext_bench_homo_v2/elev/n_none/mix70r30w
        duration: 90
        drop_caches_before_run: false
        cooldown_sec: 1
        fio_global:
          ioengine: libaio
          direct: 1
          bs: 4k
          rw: randrw
          rwmixread: 70
          iodepth: 64
          numjobs: 1
          runtime_sec: 60
          time_based: true
          group_reporting: true
          percentile_list: 50:90:95:99:99.9
          write_bw_log: homo_v2_elev_fio
          write_iops_log: homo_v2_elev_fio
          write_lat_log: homo_v2_elev_fio
          log_avg_msec: 500
        io_ext:
          cleanup_stale_when_no_specs: true
          cleanup_bpffs_pins: true
