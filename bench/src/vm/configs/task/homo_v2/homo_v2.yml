benchmark_name: io-ext homo-v2 homomorphic reproduction (kvmhost sdb)
description: "Homo-v2 homomorphic-algorithm reproduction (homo v2) on the kvmhost exclusive\
  \ 96G experiment disk (device: sdb, generated by scripts/gen_homo_v2_yamls.py; ALL\
  \ homo-v2 data must be re-run on the 7.3.1-ioext3 kernel). Three sequence families:\
  \ seq_elevator (single-tenant 4k randrw 70/30 QD64 direct=1 elevator-family homo\
  \ arms; head metric elev_read_p99_us, IOPS secondary), seq_controller (LC+BE coloc\
  \ 4k-randread-QD32 / 64k-seqwrite controller-family arms: native io.max/io.weight/io.cost/io.latency\
  \ vs scx_io q_iomax/arb_wdrr/arb_iocost/arb_iolatency; NATIVE io.weight's effective\
  \ carrier is BFQ, so the n_io_weight arm pins scheduler=bfq, io.max cap 64 MiB/s\
  \ per the rq5 BE write anchor (rerun#2 recalibration; the io.cost RECAL linear model\
  \ keeps the 320 MiB/s saturation anchor), BE capped on both channels), and seq_frontier\
  \ (arb_d2fq / q_linnos on the same coloc workload). The frontier native reference\
  \ column does NOT re-run: it cross-references HOMO_ctrl_n_none (identical workload/device/kernel;\
  \ no HOMO_front_n_none sequence exists). Arm ids parse from sequence ids as arm\
  \ = <id> minus the 'HOMO_<family-token>_' prefix. Tunable constants: ELEV runtime\
  \ 60s QD64, CTRL runtime 60s LC QD32 BE QD16 (BE uncapped), io.weight 100:200 (LC:BE;\
  \ native carrier bfq), q_linnos --busy-ref 24 --max-hold-us 500, io.latency target\
  \ 2000us, arb prio band LC 0-2 / BE 3-7 (LC 2 / BE 5).\nFINAL loader CLIs (verified\
  \ against the landed build/ loaders:\n    - elev_x_mq_deadline_q:\
  \ loader_q_mq_deadline -c {policy_cgroup_path}\n    - elev_x_kyber_q: loader_q_kyber\
  \ -c {policy_cgroup_path} --read-target-ns 2000000 --write-target-ns 10000000\n\
  \    - ctrl_x_iomax_q:  LC loader_q_none -p 2 -W 100; BE loader_q_iomax --rbps 67108864\
  \ --wbps 67108864\n    - ctrl_x_weight_arb: loader_arb_wdrr(defaults);  LC loader_q_fifo\
  \ -p 2 -W 100; BE loader_q_fifo -p 5 -W 200\n    - ctrl_x_cost_arb: loader_arb_iocost(defaults);\
  \  LC loader_q_fifo -p 2 -W 100; BE loader_q_fifo -p 5 -W 200\n    - ctrl_x_latency_arb:\
  \ loader_arb_iolatency --lat-target-ns 2000000;  LC loader_q_none -p 2 -W 100; BE\
  \ loader_q_fifo -p 5 -W 200\n    - front_x_d2fq_arb: loader_arb_d2fq(defaults);\
  \  LC loader_q_none -p 2 -W 100; BE loader_q_fifo -p 5 -W 200\n    - front_x_linnos_q:\
  \  LC loader_q_linnos -p 2 -W 100 --busy-ref 24 --ir-low 0:0 --ir-mid 0:40 --ir-high\
  \ 0:60 --max-hold-us 500; BE loader_q_linnos -p 5 -W 200 --busy-ref 24 --ir-low\
  \ 0:0 --ir-mid 0:40 --ir-high 0:60 --max-hold-us 500\nREMAINING calibration TODOs:\n\
  \    - IOCOST_MODEL/QOS: re-measure on the campaign 96G disk with iocost_coef_gen\
  \ before publishing graded comparisons (currently the rig sdb calibration literals,\
  \ 320 MiB/s RECAL anchor; the iteration#3 qos rlat=2000 us re-anchor is the binding\
  \ change, keep it when re-measuring);\n    - n_io_latency arm: blk-iolatency availability\
  \ on 7.3.1-ioext3 must be verified AFTER the first run via the sidecar 'cgroup io.*\
  \ arm state' block (common.py skips a missing io.latency file silently); also verify\
  \ the target=2000 us write landed AND that the self-throttle actually shrinks the\
  \ LC queue instead of pinning LC throughput (2 ms target sits between the ~4.9 ms\
  \ none-baseline LC p99 and the hardware floor; the iteration#2 1 ms target was below\
  \ the reachable floor and self-throttled LC itself: iops 84k -> 72k with p99 still\
  \ ~5.7 ms -- if the 2 ms arm repeats that pattern, the arm goes to the ledger for\
  \ review)."
fail_fast_on_scene_error: true
io_ext_policy_profiles:
  HV_elev_n_none:
    name: homo-v2 elevator elev_n_none
    target_device: sdb
    scheduler: none
    io_ext: {}
  HV_elev_n_mq_deadline:
    name: homo-v2 elevator elev_n_mq_deadline
    target_device: sdb
    scheduler: mq-deadline
    io_ext: {}
  HV_elev_n_kyber:
    name: homo-v2 elevator elev_n_kyber
    target_device: sdb
    scheduler: kyber
    io_ext: {}
  HV_elev_x_mq_deadline_q:
    name: homo-v2 elevator elev_x_mq_deadline_q
    target_device: sdb
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - loader_arb_
      - loader_q_
      - loader_minimal
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      root_policies:
      - name: elev_x_mq_deadline_q_root
        path: /opt/io-ext/userspace/loader_q_mq_deadline
        scope: root_policy
        args:
        - -c
        - '{policy_cgroup_path}'
  HV_elev_x_kyber_q:
    name: homo-v2 elevator elev_x_kyber_q
    target_device: sdb
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - loader_arb_
      - loader_q_
      - loader_minimal
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      root_policies:
      - name: elev_x_kyber_q_root
        path: /opt/io-ext/userspace/loader_q_kyber
        scope: root_policy
        args:
        - -c
        - '{policy_cgroup_path}'
        - --read-target-ns
        - '2000000'
        - --write-target-ns
        - '10000000'
  HV_ctrl_n_none:
    name: homo-v2 controller ctrl_n_none
    target_device: sdb
    scheduler: none
  HV_ctrl_n_io_max:
    name: homo-v2 controller ctrl_n_io_max
    target_device: sdb
    scheduler: none
  HV_ctrl_x_iomax_q:
    name: homo-v2 controller ctrl_x_iomax_q
    target_device: sdb
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - loader_arb_
      - loader_q_
      - loader_minimal
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      arbiters: []
    cgroup_policies_from_groups:
    - tenant_group: controller_ctrl_x_iomax_q_lc
      name_template: q_none_lc
      path: /opt/io-ext/userspace/loader_q_none
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - -p
      - '2'
      - -W
      - '100'
    - tenant_group: controller_ctrl_x_iomax_q_be
      name_template: q_iomax_be
      path: /opt/io-ext/userspace/loader_q_iomax
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - --rbps
      - '67108864'
      - --wbps
      - '67108864'
  HV_ctrl_n_io_weight:
    name: homo-v2 controller ctrl_n_io_weight
    target_device: sdb
    scheduler: bfq
  HV_ctrl_x_weight_arb:
    name: homo-v2 controller ctrl_x_weight_arb
    target_device: sdb
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - loader_arb_
      - loader_q_
      - loader_minimal
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      arbiters:
      - name: arb_wdrr
        path: /opt/io-ext/userspace/loader_arb_wdrr
        scope: arbiter
        args: []
    cgroup_policies_from_groups:
    - tenant_group: controller_ctrl_x_weight_arb_lc
      name_template: q_fifo_lc
      path: /opt/io-ext/userspace/loader_q_fifo
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - -p
      - '2'
      - -W
      - '100'
    - tenant_group: controller_ctrl_x_weight_arb_be
      name_template: q_fifo_be
      path: /opt/io-ext/userspace/loader_q_fifo
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - -p
      - '5'
      - -W
      - '200'
  HV_ctrl_n_io_cost:
    name: homo-v2 controller ctrl_n_io_cost
