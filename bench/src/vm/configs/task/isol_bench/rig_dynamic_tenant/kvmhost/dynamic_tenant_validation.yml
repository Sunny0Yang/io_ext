  X_x1_qnone:
    name: dynamic tenant static io_ext arm X_x1_qnone
    target_device: sdc
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - loader_arb_
      - loader_q_
      - loader_minimal
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      arbiters: []
      cgroup_policies:
      - name: ta_q_none
        path: /opt/io-ext/userspace/loader_q_none
        policy_cgroup_path: /sys/fs/cgroup/rdyn_arm_x1_qnone_ta
        args:
        - -c
        - '{policy_cgroup_path}'
        - -p
        - '0'
        - -W
        - '400'
      - name: tb_q_none
