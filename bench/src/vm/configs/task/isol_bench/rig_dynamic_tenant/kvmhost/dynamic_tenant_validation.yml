benchmark_name: dynamic tenant validation (feasible schedule vs best-static)
description: 'Contract 7.x validation AMENDED 20261104: the dynamic trajectory must stay under an iox
  policy the whole run (no native phase). Under the same-arbiter-family constraint the schedule DP over
  iox arms gives a whole-run resident (f1_arbfb, num_transitions=0) as the optimum, so the dynamic arm
  runs as a whole-run resident exactly like a matrix3 static arm; the iox-only loss equals the best static
  loss by identity. Native-mixed v3 (bfq at T5) would have been -13.6% vs the same static -- reported
  for the ledger, NOT executed. Native bfq whole-run remains as the reference arm. No post-hoc schedule
  changes; all failures stay in the ledger.'
validation_schedule:
  source: /opt/ioext/results/dyn_tenant_kvmhost/schedule_feasible_iox_only.json
  arm_sequence:
  - f1_arbfb
  - f1_arbfb
  - f1_arbfb
  - f1_arbfb
  - f1_arbfb
  - f1_arbfb
  num_transitions: 0
  initial_arm: f1_arbfb
  iox_only: true
  decision: COINCIDE_DP_IS_WHOLE_RUN
  note: 'contract 20261104 amendment: iox policy resident the whole run; see schedule_feasible_iox_only.json'
fail_fast_on_scene_error: true
