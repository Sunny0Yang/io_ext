    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - loader_arb_
      - loader_q_
      - loader_minimal
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      arbiters: []
      cgroup_policies:
      - name: ta_q_none
        path: /opt/io-ext/userspace/loader_q_none
