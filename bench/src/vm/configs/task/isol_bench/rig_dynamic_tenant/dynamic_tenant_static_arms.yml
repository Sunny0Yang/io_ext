        cleanup_bpffs_pins: false
        cleanup_stale_when_no_specs: false
      duration: 690
      frozen_contract: &id001
        formal_phase_length_sec: 90.0
        l_decision:
          start_sec: 60
          growth: 1.5
          max_rounds: 2
          criteria:
          - 'L1: A per-phase p99 window samples >= 100 (T4 worst case)'
          - 'L3: B/C/D convergence <= L/3'
          status: decided
        rate_b_mib_s: 299
        rate_c_mib_s: 198
        d_rate: unlimited
        d_pressure_fraction_of_solo: 0.23987894097889575
        seed_base: 20261103
        service_preference: A > C > B = D
        loss_weights:
          a: 0.6
          c: 0.3
          low_group_bd: 0.1
        guardrail_thresholds:
          min_completion_fraction_of_solo: 0.05
          max_no_progress_sec: 5.0
        calibration_json_sha256: e9da3dcf3dcdafee4de212bb8fb44819fd950459ba5faccc8ed57eafe8192d96
      tenants:
        a: {}
        b:
          rate: 299M
