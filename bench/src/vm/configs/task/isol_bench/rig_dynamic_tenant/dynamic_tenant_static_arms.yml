benchmark_name: isol_bench rig dynamic tenant static arms (main campaign, virtme)
description: 'Static-arm tuning matrix (contract 7.10/7.11, frozen seed base 20261103, L=90s, 1 pre-declared
  run per arm). Native arms N1-N4 set the block scheduler in the timeline scene. io_ext arms run device
  scheduler=scx_io with a resident global loader scene (arbiters first, then per-tenant q policies attached
  to the tenant cgroups /sys/fs/cgroup/rdyn_<seq>_t{a..d} pre-created by the runner). cleanup_stale/cleanup_bpffs_pins
  stay false in the timeline scene (forbidden while tenants are active); the GLOBAL loader scene may clean
  stale loaders/pins because it runs before any tenant exists. C1-C4 (cgroup io.max / io.bfq.weight /
  io.latency / io.cost) are SUPPORTED since 20261105 (the old contract deviation -- no scene support,
  no calibrated constants -- is resolved): the timeline scene applies io_ext.cgroup_tenant_controls per
  tenant at spawn and io_ext.io_cost model/qos once at setup (tenant_weights become per-tenant io.weight
  device lines), each write strictly read-back verified (a missing io.* file or a mismatching line fails
  the run). Constants derived from the frozen contract calibration (rate_b_mib_s=299, rate_c_mib_s=198,
  solo_d_mib_s=207.617449760437, solo p99_us_steady=419.84/9240.576/11862.016/5079.04): C1 caps B/C rbps
  at the frozen rates 299/198 MiB/s and D wbps at floor(0.8*solo_d 207.6174)=166 MiB/s (A uncapped, latency-critical
  foreground); C2 io.bfq.weight A:C:B:D=400:200:100:100 (STATIC_ARM_WEIGHT, ''default <w>'' lines); C3
  io.latency targets ceil(2*solo p99_steady up to the next 1000us) = a 1000 / b 19000 / c 24000 / d 11000
  us; C4 root model+qos from DYN_TENANT_IOCOST_COEF_JSON (iocost_coef_gen measured on the campaign disk)
  with the same 400:200:100:100 per-tenant io.weight weights. frozen L=90s.'
fail_fast_on_scene_error: true
scenes:
  ib_rdyn_arm_n1_native_none:
    base_scene: scene/io_ext/timeline.yml
    parameters:
      target_device: nvme0n1
      scheduler: none
