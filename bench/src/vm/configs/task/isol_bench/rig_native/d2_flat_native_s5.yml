        target_device: sdb
        file_name: /dev/sdb
        scheduler: none
        scheduler_tunables: {}
        output_dir: ./test_results/isol_bench/rig_native/d2s5/none
        duration: 120
        drop_caches_before_run: false
        cooldown_sec: 1
        fio_global:
          ioengine: libaio
          direct: 1
          bs: 4k
          rw: randread
          iodepth: 256
          numjobs: 1
          runtime_sec: 55
          ramp_time: 10
          time_based: true
          group_reporting: true
          percentile_list: 50:90:95:99:99.9:100
