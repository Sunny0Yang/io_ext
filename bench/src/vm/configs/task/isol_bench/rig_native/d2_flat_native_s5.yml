benchmark_name: isol_bench rig native D2 grid (flat) (kvmhost/sdb, session5 B1)
description: 'Session 5 B1 native D2 flat grid: saturated weighted cg=8, knobs x mounts per RIG_IOX_SESSION5_DESIGN.'
scenes:
  ib_system_metric:
    base_scene: scene/system/system_metric.yml
    parameters:
      collection_mode: proc
      sample_interval: 1.0
      max_samples: 120
      require_samples: true
      disk_devices:
      - sdb
      output_dir: ./test_results/isol_bench/rig_native/d2s5/system_metric
  ib_block_io_latency_cost:
    base_scene: scene/block_bpf/block_io_latency_cost.yml
    parameters:
      output_dir: ./test_results/isol_bench/rig_native/d2s5/block_io_latency_cost
      output_file: ./test_results/isol_bench/rig_native/d2s5/block_io_latency_cost/block_io_latency_cost.bpftrace.log
      summary_file: ./test_results/isol_bench/rig_native/d2s5/block_io_latency_cost/block_io_latency_cost_summary.json
      require_events: false
      privilege:
        method: sudo_nopasswd
io_ext_policy_profiles:
  N_none:
    name: rig native none
    target_device: sdb
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  N_kyber:
    name: rig native kyber
    target_device: sdb
    scheduler: kyber
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  N_bfq:
