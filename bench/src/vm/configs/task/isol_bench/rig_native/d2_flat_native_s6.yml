benchmark_name: isol_bench rig D2 native fairness s6 io.cost scan (kvmhost/sdb)
description: 'Session 6: io.cost evidence chain, 6 arms.'
scenes:
  ib_system_metric:
    base_scene: scene/system/system_metric.yml
    parameters:
      collection_mode: proc
      sample_interval: 1.0
      max_samples: 120
      require_samples: true
      disk_devices:
      - sdb
      output_dir: ./test_results/isol_bench/rig_native/d2/system_metric
  ib_block_io_latency_cost:
    base_scene: scene/block_bpf/block_io_latency_cost.yml
    parameters:
      output_dir: ./test_results/isol_bench/rig_native/d2/block_io_latency_cost
      output_file: ./test_results/isol_bench/rig_native/d2/block_io_latency_cost/block_io_latency_cost.bpftrace.log
      summary_file: ./test_results/isol_bench/rig_native/d2/block_io_latency_cost/block_io_latency_cost_summary.json
      require_events: false
      privilege:
        method: sudo_nopasswd
io_ext_policy_profiles:
  N_io_cost:
    name: rig native io_cost
    target_device: sdb
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
  N_io_cost_calib:
    name: rig native io_cost_calib
    target_device: sdb
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
  N_io_cost_calib10:
    name: rig native io_cost_calib10
    target_device: sdb
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
      root_cgroup:
