benchmark_name: isol_bench rig native D2 grid (tree) (kvmhost/sdb, session5 B1)
description: 'Session 5 B1 native D2 treeleaf+treesub grid: saturated weighted cg=8, knobs x mounts per RIG_IOX_SESSION5_DESIGN.'
scenes:
  ib_system_metric:
    base_scene: scene/system/system_metric.yml
    parameters:
      collection_mode: proc
      sample_interval: 1.0
      max_samples: 120
      require_samples: true
      disk_devices:
      - sdb
      output_dir: ./test_results/isol_bench/rig_native/d2s5t/system_metric
  ib_block_io_latency_cost:
    base_scene: scene/block_bpf/block_io_latency_cost.yml
    parameters:
      output_dir: ./test_results/isol_bench/rig_native/d2s5t/block_io_latency_cost
      output_file: ./test_results/isol_bench/rig_native/d2s5t/block_io_latency_cost/block_io_latency_cost.bpftrace.log
      summary_file: ./test_results/isol_bench/rig_native/d2s5t/block_io_latency_cost/block_io_latency_cost_summary.json
      require_events: false
      privilege:
        method: sudo_nopasswd
io_ext_policy_profiles:
  N_none:
    name: rig native none
    target_device: sdb
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  N_kyber:
    name: rig native kyber
    target_device: sdb
    scheduler: kyber
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  N_bfq:
    name: rig native bfq
    target_device: sdb
    scheduler: bfq
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  N_mq_deadline:
    name: rig native mq_deadline
    target_device: sdb
    scheduler: mq-deadline
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  N_io_max:
    name: rig native io_max
    target_device: sdb
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  N_io_latency:
    name: rig native io_latency
    target_device: sdb
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  N_io_cost:
    name: rig native io_cost
    target_device: sdb
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
  N_io_prio_class:
    name: rig native io_prio_class
    target_device: sdb
    scheduler: mq-deadline
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  N_io_bfq_weight:
    name: rig native io_bfq_weight
    target_device: sdb
    scheduler: bfq
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
tenant_groups:
  d2s5t_none_tl:
    count: 8
    execution_mode: fio_subjob
    scene_id_template: ib_rig_d2s5t_none_tl_t{idx1}
    collapsed_scene_id: ib_rig_d2s5t_none_tl_subjob
    template:
      base_scene: scene/io_ext/fio.yml
      parameters:
        target_device: sdb
        file_name: /dev/sdb
        scheduler: none
        scheduler_tunables: {}
        output_dir: ./test_results/isol_bench/rig_native/d2s5t/none/treeleaf
        duration: 120
        drop_caches_before_run: false
        cooldown_sec: 1
        fio_global:
          ioengine: libaio
          direct: 1
          bs: 4k
          rw: randread
          iodepth: 256
          numjobs: 1
          runtime_sec: 55
          ramp_time: 10
          time_based: true
          group_reporting: true
          percentile_list: 50:90:95:99:99.9:100
        io_ext:
          cleanup_stale_when_no_specs: true
          cleanup_bpffs_pins: true
          cgroup:
            path: /sys/fs/cgroup/ib_rig_d2nt_none_treeleaf/g1/t{idx1}
            controllers:
            - io
            io_weight: 100
            io_max:
              rbps: max
              wbps: max
              riops: max
              wiops: max
            io_cost:
              qos:
                enable: false
    per_tenant:
