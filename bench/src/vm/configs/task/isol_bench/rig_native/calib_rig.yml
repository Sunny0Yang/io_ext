- sequence_id: CALIB_solo_lc_none
  name: calibration solo LC native none
  io_ext_policy: N_none
  steps:
  - name: solo LC native none
    tenant_groups:
    - calib_lc
    monitoring_scenes:
    - ib_system_metric
    - ib_block_io_latency_cost
    monitoring_startup_time: 3
    duration: 120
    tenant_count: 1
- sequence_id: CALIB_solo_be_none
