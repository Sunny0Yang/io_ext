        scheduler_tunables: {}
        output_dir: ./test_results/isol_bench/rig_native/calib/be
        duration: 120
        drop_caches_before_run: false
        cooldown_sec: 1
        fio_global:
          ioengine: libaio
          direct: 1
          bs: 4k
          rw: randread
          iodepth: 256
          numjobs: 1
          runtime_sec: 60
          time_based: true
          group_reporting: true
          ramp_time: 20
          percentile_list: 50:90:95:99:99.9:100
        io_ext:
          cleanup_stale_when_no_specs: true
