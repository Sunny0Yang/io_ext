    tenant_groups:
    - lc_iox_q_arb
    - be_iox_q_arb
    monitoring_scenes:
    - ib_system_metric
    monitoring_startup_time: 3
    duration: 1700
    primary_scene: rq5_lc_iox_q_arb_t1
