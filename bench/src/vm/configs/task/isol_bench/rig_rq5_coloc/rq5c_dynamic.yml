test_sequences:
- sequence_id: RQ5C_NONE_DYN
  name: 'RQ5C NONE dynamic: BE LOW->HIGH fill steps, LC 1500s window'
  io_ext_policy: arm_none
  steps:
  - name: rq5c none dyn
    tenant_groups:
    - lc_none
    - be_none
    monitoring_scenes:
    - ib_system_metric
    monitoring_startup_time: 3
    duration: 1700
    primary_scene: rq5_lc_none_t1
- sequence_id: RQ5C_IO_WEIGHT_DYN
  name: 'RQ5C IO_WEIGHT dynamic: BE LOW->HIGH fill steps, LC 1500s window'
  io_ext_policy: arm_io_weight
  steps:
  - name: rq5c io_weight dyn
    tenant_groups:
    - lc_io_weight
    - be_io_weight
    monitoring_scenes:
    - ib_system_metric
    monitoring_startup_time: 3
    duration: 1700
    primary_scene: rq5_lc_io_weight_t1
- sequence_id: RQ5C_IOX_Q_ARB_DYN
  name: 'RQ5C IOX_Q_ARB dynamic: BE LOW->HIGH fill steps, LC 1500s window'
  io_ext_policy: arm_iox_q_arb
  steps:
