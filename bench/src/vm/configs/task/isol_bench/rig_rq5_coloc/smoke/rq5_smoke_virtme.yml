benchmark_name: 'RQ5 virtme-ng smoke: LC/BE co-location mechanism chain on the VM nvme0n1 test disk (short windows)'
description: 'RQ5 virtme-ng smoke (contract sections 1/6; same short-window calibers as the local smoke). Runs inside a virtme-ng VM where nvme0n1 is the disposable QEMU test disk: scripts/run_rq5_smoke_virtme.sh
  mkfs.ext4 + mounts it at /mnt/rq5_virtme BEFORE every sequence (per-sequence disk reset, mirroring the kvmhost runner), so every tenant scene sets system.skip_disk_setup and uses data dirs /mnt/rq5_virtme/{lc,be}
  (direct children of the mount, ext4, O_DIRECT) with no format_device/auto_format_disk anywhere. The VM shares the host root fs, so the YCSB runtime (src/vm/assets/ycsb/ycsb_runtime) and db_bench (/home/anon/rocksdb)
  run from the usual host paths and java comes from the host PATH (the rig_ycsb vng convention). Loaders /opt/io-ext/userspace/loader_*: the in-VM install carries the FULL kvmhost set (arb_wdrr, q_ddl, q_fifo,
  q_sp_edf, q_wedf) -- no local semantic substitution. recordcount 30000, operationcount 60000, threads 8, BE fill 60s at 16 MiB/s, load-window sleep 40s, run 90s, duration 200/250s. RQ5S_C_DYN exercises
  the Phase C timeline (BE wait 40 -> fill LOW 30s -> overwrite HIGH 30s (db_bench skips fillrandom on an existing DB) -> sleep 30, LC maxexecutiontime 150 with a raised operationcount so the time bound
  binds) under the IOX_Q_ARB arm -- the fullest mechanism chain; primary_scene = LC. RQ5S_BE_COMPACT exercises the A3 maintenance chain (BE wait 40 -> prefill 300k keys uncapped on 4 threads -> settle 10
  -> compact; no phase durations, compact runs to completion) under the none arm, step 300s, primary_scene = BE. Sequences: LC solo anchor, 8-arm co-location, C dyn, BE compact.'
default_sequence: RQ5S_LC_SOLO
fail_fast_on_scene_error: true
scenes:
  ib_system_metric:
    base_scene: scene/system/system_metric.yml
    parameters:
      collection_mode: proc
      sample_interval: 1.0
      max_samples: 4000
      require_samples: true
      disk_devices:
      - nvme0n1
      cgroup_paths:
      - /sys/fs/cgroup/rq5_lc
      - /sys/fs/cgroup/rq5_be
      output_dir: /tmp/rq5_virtme/monitor/system_metric
io_ext_policy_profiles:
  arm_none:
    name: 'rq5 coloc none: native none baseline'
    target_device: nvme0n1
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  arm_io_max:
    name: 'rq5 coloc io_max: none + BE io.max wbps cap 16777216 B/s (LOW level)'
    target_device: nvme0n1
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  arm_io_weight:
    name: 'rq5 coloc io_weight: none + io.weight LC 1000 / BE 10'
    target_device: nvme0n1
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  arm_io_cost:
    name: 'rq5 coloc io_cost: none + root io.cost RECAL model+qos'
    target_device: nvme0n1
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  arm_bfq:
    name: 'rq5 coloc bfq: bfq + io.bfq.weight LC 1000 / BE 50'
    target_device: nvme0n1
    scheduler: bfq
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  arm_iox_q:
    name: 'rq5 coloc iox_q: scx_io root q_fifo + BE cgroup q_ddl (queue-local)'
    target_device: nvme0n1
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - loader_arb_
      - loader_q_
      - loader_minimal
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      root_policies:
      - name: q_fifo_root
        path: /opt/io-ext/userspace/loader_q_fifo
        scope: root_policy
        args:
        - -c
        - '{policy_cgroup_path}'
      cgroup_policies_from_groups:
      - tenant_group: be_iox_q
        name_template: q_ddl_{tenant_id}
        path: /opt/io-ext/userspace/loader_q_ddl
        scope: cgroup_policy
        args:
        - -c
        - '{policy_cgroup_path}'
  arm_iox_arb:
    name: 'rq5 coloc iox_arb: scx_io arb_wdrr + root q_fifo (global arbiter only)'
    target_device: nvme0n1
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - loader_arb_
      - loader_q_
      - loader_minimal
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      arbiters:
      - name: arb_wdrr
        path: /opt/io-ext/userspace/loader_arb_wdrr
        scope: arbiter
      root_policies:
      - name: q_fifo_root
        path: /opt/io-ext/userspace/loader_q_fifo
        scope: root_policy
        args:
        - -c
        - '{policy_cgroup_path}'
  arm_iox_q_arb:
    name: 'rq5 coloc iox_q_arb: scx_io arb_wdrr + LC q_sp_edf + BE q_wedf (joint)'
    target_device: nvme0n1
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - loader_arb_
      - loader_q_
      - loader_minimal
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      arbiters:
      - name: arb_wdrr
        path: /opt/io-ext/userspace/loader_arb_wdrr
        scope: arbiter
      root_policies:
      - name: q_fifo_root
        path: /opt/io-ext/userspace/loader_q_fifo
        scope: root_policy
        args:
        - -c
        - '{policy_cgroup_path}'
      cgroup_policies_from_groups:
      - tenant_group: lc_iox_q_arb
        name_template: q_sp_edf_{tenant_id}
        path: /opt/io-ext/userspace/loader_q_sp_edf
        scope: cgroup_policy
        args:
        - -c
        - '{policy_cgroup_path}'
      - tenant_group: be_iox_q_arb
        name_template: q_wedf_{tenant_id}
        path: /opt/io-ext/userspace/loader_q_wedf
        scope: cgroup_policy
        args:
        - -c
        - '{policy_cgroup_path}'
tenant_groups:
  lc_none:
    count: 1
    scene_id_template: rq5_lc_none_t{idx1}
    template:
      base_scene: scene/io_ext/ycsb_rocksdb.yml
      parameters:
        target_device: nvme0n1
        output_dir: /tmp/rq5_virtme/scene/{group_id}
        duration: 250
        drop_caches_before_run: false
        database:
          db_type: rocksdb
          data_dir: /mnt/rq5_virtme/lc
          ycsb_dir: src/vm/assets/ycsb/ycsb_runtime
          use_direct_io: true
          write_buffer_size: 67108864
          storage_backend: kernel_block
        system:
          auto_format_disk: false
          format_device: false
          skip_disk_setup: true
          cgroup_path: /sys/fs/cgroup/rq5_lc
        scheduler: none
        io_ext:
          cleanup_stale_when_no_specs: true
          cleanup_bpffs_pins: true
        ycsb_workload:
          workload_type: b
          recordcount: 30000
          operationcount: 60000
          threads: 8
          jvm_args: -Xms1024m -Xmx1024m
          properties:
            fieldcount: 10
            fieldlength: 1024
            maxexecutiontime: 90
            status.interval: 5
            measurementtype: hdrhistogram
            hdrhistogram.percentiles: 50,95,99,99.9,99.99
  be_none:
    count: 1
    scene_id_template: rq5_be_none_t{idx1}
    template:
      base_scene: scene/io_ext/dbbench.yml
      parameters:
        target_device: nvme0n1
        output_dir: /tmp/rq5_virtme/scene/{group_id}
        duration: 250
        drop_caches_before_run: false
        dbbench:
          dbbench_bin: /home/anon/rocksdb/db_bench
          rocksdb_home: /home/anon/rocksdb
          db_path: /mnt/rq5_virtme/be
          use_direct_io: true
          common_args:
            num: 1000000
            value_size: 1024
            key_size: 16
            compression_type: none
            bloom_bits: 10
            cache_size: 0
            write_buffer_size: 67108864
        system:
          auto_format_disk: false
          format_device: false
          skip_disk_setup: true
          cgroup_path: /sys/fs/cgroup/rq5_be
        scheduler: none
        io_ext:
          cleanup_stale_when_no_specs: true
          cleanup_bpffs_pins: true
        phases:
        - name: wait
          benchmark: sleep
          settle_sec: 40
        - name: fill
          benchmark: fillrandom
          duration: 60
          args:
            num: 100000000
            value_size: 1024
            threads: 8
            benchmark_write_rate_limit: 16777216
