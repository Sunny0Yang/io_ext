    monitoring_scenes:
    - ib_system_metric
    monitoring_startup_time: 3
    duration: 1000
    primary_scene: rq5_be_ladder_256m_t1
- sequence_id: RQ5A86_LADDER_512M
  name: 'RQ5A ladder: LC + BE fillrandom capped at 512 MiB/s for 720s'
  io_ext_policy: arm_none
  steps:
  - name: rq5a lc + be ladder 512m
