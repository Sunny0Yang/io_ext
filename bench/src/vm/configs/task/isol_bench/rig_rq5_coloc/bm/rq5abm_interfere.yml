test_sequences:
- sequence_id: RQ5A86_LC_SOLO
  name: 'RQ5A A0: LC solo capacity anchor (no BE, no offered target)'
  io_ext_policy: arm_none
  steps:
  - name: rq5a lc solo
    tenant_groups:
    - lc_none
    monitoring_scenes:
    - ib_system_metric
    monitoring_startup_time: 3
    duration: 800
    primary_scene: rq5_lc_none_t1
- sequence_id: RQ5A86_BE_WRITE_MAX
  name: 'RQ5A A2: LC + BE UNCAPPED fillrandom for 720s (max reproducible interference on real NVMe)'
  io_ext_policy: arm_none
  steps:
  - name: rq5a lc + be write max
    tenant_groups:
    - lc_none
    - be_write_max
    monitoring_scenes:
    - ib_system_metric
    monitoring_startup_time: 3
    duration: 1000
    primary_scene: rq5_be_write_max_t1
- sequence_id: RQ5A86_BE_COMPACT
  name: 'RQ5A A3: LC + BE prefill 20M keys then compact (maintenance interference probe)'
  io_ext_policy: arm_none
  steps:
  - name: rq5a lc + be compact
    tenant_groups:
    - lc_none
    - be_compact
    monitoring_scenes:
    - ib_system_metric
    monitoring_startup_time: 3
    duration: 1700
    primary_scene: rq5_be_compact_t1
- sequence_id: RQ5A86_LADDER_128M
  name: 'RQ5A ladder: LC + BE fillrandom capped at 128 MiB/s for 720s'
  io_ext_policy: arm_none
  steps:
  - name: rq5a lc + be ladder 128m
    tenant_groups:
    - lc_none
    - be_ladder_128m
    monitoring_scenes:
    - ib_system_metric
    monitoring_startup_time: 3
    duration: 1000
    primary_scene: rq5_be_ladder_128m_t1
- sequence_id: RQ5A86_LADDER_256M
  name: 'RQ5A ladder: LC + BE fillrandom capped at 256 MiB/s for 720s'
  io_ext_policy: arm_none
  steps:
  - name: rq5a lc + be ladder 256m
