    primary_scene: rq5_be_ladder_512m_t1
- sequence_id: RQ5A86_LADDER_1024M
  name: 'RQ5A ladder: LC + BE fillrandom capped at 1024 MiB/s for 720s'
  io_ext_policy: arm_none
  steps:
