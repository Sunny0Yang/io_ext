benchmark_name: 'RQ5 Phase B policy matrix: 8 arms x LOW/MID/HIGH BE fill pressure (kvmhost sdb)'
description: 'RQ5 real-app co-location, Phase B (contract section 5 arm -> policy mapping). LC = YCSB workload-B (O_DIRECT, target from slo.json); BE = db_bench fillrandom 600s capped at the per-level offered
  rate. Arms: none / io_max (BE io.max wbps = LOW level) / io_weight (LC 1000, BE 10) / io_cost (root RECAL model+qos) / bfq (LC 1000, BE 50) / iox_q (root q_fifo + BE q_ddl) / iox_arb (arb_wdrr + root
  q_fifo) / iox_q_arb (arb_wdrr + LC q_sp_edf + BE q_wedf). Per-level BE rates need per-level BE tenant groups be_<arm>_<level> (framework has no per-sequence scene override; same pattern as Phase A be_ladder_<n>m);
  all BE level groups share the contractual cgroup /sys/fs/cgroup/rq5_be, so the iox profiles attach the BE cgroup policy explicitly (kvcfg structure) instead of via cgroup_policies_from_groups, which would
  start one q_* loader per level group on the same cgroup. Levels: low=32 MiB/s, mid=64 MiB/s, high=128 MiB/s; io.max cap: 33554432 B/s.'
default_sequence: RQ5B_NONE_LOW
fail_fast_on_scene_error: true
scenes:
  ib_system_metric:
    base_scene: scene/system/system_metric.yml
    parameters:
      collection_mode: proc
      sample_interval: 1.0
      max_samples: 4000
      require_samples: true
      disk_devices:
      - sdb
      cgroup_paths:
      - /sys/fs/cgroup/rq5_lc
      - /sys/fs/cgroup/rq5_be
      output_dir: /tmp/rq5_coloc/monitor/system_metric
io_ext_policy_profiles:
  arm_none:
    name: 'rq5 coloc none: native none baseline'
    target_device: sdb
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  arm_io_max:
    name: 'rq5 coloc io_max: none + BE io.max wbps cap 33554432 B/s (LOW level)'
    target_device: sdb
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  arm_io_weight:
    name: 'rq5 coloc io_weight: none + io.weight LC 1000 / BE 10'
    target_device: sdb
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  arm_io_cost:
    name: 'rq5 coloc io_cost: none + root io.cost RECAL model+qos'
    target_device: sdb
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  arm_bfq:
    name: 'rq5 coloc bfq: bfq + io.bfq.weight LC 1000 / BE 50'
    target_device: sdb
    scheduler: bfq
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  arm_iox_q:
    name: 'rq5 coloc iox_q: scx_io root q_fifo + BE cgroup q_ddl (queue-local)'
    target_device: sdb
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - loader_arb_
      - loader_q_
      - loader_minimal
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      root_policies:
      - name: q_fifo_root
        path: /opt/io-ext/userspace/loader_q_fifo
        scope: root_policy
        args:
        - -c
        - '{policy_cgroup_path}'
      cgroup_policies:
      - name: q_ddl_be
        path: /opt/io-ext/userspace/loader_q_ddl
        scope: cgroup_policy
        args:
        - -c
        - '{policy_cgroup_path}'
        policy_cgroup_path: /sys/fs/cgroup/rq5_be
  arm_iox_arb:
    name: 'rq5 coloc iox_arb: scx_io arb_wdrr + root q_fifo (global arbiter only)'
    target_device: sdb
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - loader_arb_
      - loader_q_
      - loader_minimal
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      arbiters:
      - name: arb_wdrr
        path: /opt/io-ext/userspace/loader_arb_wdrr
        scope: arbiter
      root_policies:
      - name: q_fifo_root
        path: /opt/io-ext/userspace/loader_q_fifo
        scope: root_policy
        args:
        - -c
        - '{policy_cgroup_path}'
  arm_iox_q_arb:
    name: 'rq5 coloc iox_q_arb: scx_io arb_wdrr + LC q_sp_edf + BE q_wedf (joint)'
    target_device: sdb
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - loader_arb_
      - loader_q_
      - loader_minimal
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      arbiters:
      - name: arb_wdrr
        path: /opt/io-ext/userspace/loader_arb_wdrr
        scope: arbiter
      root_policies:
      - name: q_fifo_root
        path: /opt/io-ext/userspace/loader_q_fifo
        scope: root_policy
        args:
        - -c
        - '{policy_cgroup_path}'
      cgroup_policies_from_groups:
      - tenant_group: lc_iox_q_arb
        name_template: q_sp_edf_{tenant_id}
        path: /opt/io-ext/userspace/loader_q_sp_edf
        scope: cgroup_policy
        args:
        - -c
        - '{policy_cgroup_path}'
      cgroup_policies:
      - name: q_wedf_be
        path: /opt/io-ext/userspace/loader_q_wedf
        scope: cgroup_policy
        args:
        - -c
        - '{policy_cgroup_path}'
        policy_cgroup_path: /sys/fs/cgroup/rq5_be
tenant_groups:
  lc_none:
    count: 1
    scene_id_template: rq5_lc_none_t{idx1}
    template:
      base_scene: scene/io_ext/ycsb_rocksdb.yml
      parameters:
        target_device: sdb
        output_dir: /tmp/rq5_coloc/scene/{group_id}
        duration: 950
        drop_caches_before_run: false
        database:
          db_type: rocksdb
          data_dir: /mnt/rq5_coloc/lc
          ycsb_dir: /opt/ioext-bench/src/vm/assets/ycsb/ycsb_runtime
          use_direct_io: true
          write_buffer_size: 67108864
          storage_backend: kernel_block
          environment:
            JAVA_HOME: /tmp/motivation_m2_pilot_20261030_bundle/motivation_m2_pilot_20261030/runtime/java-21-openjdk-amd64
            PATH: /tmp/motivation_m2_pilot_20261030_bundle/motivation_m2_pilot_20261030/runtime/java-21-openjdk-amd64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        system:
          mem_limit_mb: 0
          auto_format_disk: false
          format_device: false
          skip_disk_setup: true
          mount_options: noatime,nodiratime
          cgroup_path: /sys/fs/cgroup/rq5_lc
        scheduler: none
        io_ext:
          cleanup_stale_when_no_specs: true
          cleanup_bpffs_pins: true
        ycsb_workload:
          workload_type: b
          recordcount: 400000
          operationcount: 10000000
          threads: 16
          jvm_args: -Xms2048m -Xmx2048m
          target: 6554
          properties:
            fieldcount: 10
            fieldlength: 1024
            maxexecutiontime: 600
            status.interval: 10
            measurementtype: hdrhistogram
            hdrhistogram.percentiles: 50,95,99,99.9,99.99
  be_none_low:
    count: 1
    scene_id_template: rq5_be_none_low_t{idx1}
    template:
      base_scene: scene/io_ext/dbbench.yml
      parameters:
        target_device: sdb
        output_dir: /tmp/rq5_coloc/scene/{group_id}
        duration: 950
        drop_caches_before_run: false
        dbbench:
          dbbench_bin: /tmp/m1_cache_20261031_bundle/rocksdb/db_bench
          rocksdb_home: /tmp/m1_cache_20261031_bundle/rocksdb
          db_path: /mnt/rq5_coloc/be
          use_direct_io: true
          common_args:
            num: 1000000
            value_size: 1024
            key_size: 16
            compression_type: none
            bloom_bits: 10
            cache_size: 0
            write_buffer_size: 67108864
        system:
          auto_format_disk: false
          format_device: false
          skip_disk_setup: true
          cgroup_path: /sys/fs/cgroup/rq5_be
        scheduler: none
        io_ext:
          cleanup_stale_when_no_specs: true
          cleanup_bpffs_pins: true
        phases:
        - name: wait
          benchmark: sleep
          settle_sec: 150
        - name: fill
          benchmark: fillrandom
          duration: 600
          args:
            num: 100000000
            value_size: 1024
            threads: 8
            benchmark_write_rate_limit: 33554432
