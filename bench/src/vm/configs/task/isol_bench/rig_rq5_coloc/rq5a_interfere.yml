    - be_ladder_16m
    monitoring_scenes:
    - ib_system_metric
    monitoring_startup_time: 3
    duration: 950
    primary_scene: rq5_be_ladder_16m_t1
- sequence_id: RQ5A_LADDER_32M
  name: 'RQ5A ladder: LC + BE fillrandom capped at 32 MiB/s for 600s'
