benchmark_name: 'RQ5 Phase A interference probe: YCSB-B LC + db_bench BE write/compact on kvmhost sdb (native none)'
description: 'RQ5 real-app co-location, Phase A (contract docs/plans/rq5_realapp_coloc_experiment.md). LC = YCSB workload-B on RocksDB (O_DIRECT, recordcount 400000, maxexecutiontime 600, offered target
  from slo.json when frozen); BE = db_bench fillrandom at fixed ladder rates 8/16/32/64 MiB/s, a sustained-max 600s fill at 64 MiB/s, or a rate-bounded prefill->settle->compact chain, on the same /dev/sdb
  with independent cgroups rq5_lc/rq5_be and data dirs /mnt/rq5_coloc/{lc,be} (direct children of the mount). All sequences native none (cleanup-only io_ext). RQ5A_LC_SOLO is the A0 capacity anchor: no
  offered target until slo.json is frozen. Phase B levels for reference: low=32 MiB/s, mid=64 MiB/s, high=128 MiB/s.'
default_sequence: RQ5A_LC_SOLO
fail_fast_on_scene_error: true
scenes:
  ib_system_metric:
    base_scene: scene/system/system_metric.yml
    parameters:
      collection_mode: proc
      sample_interval: 1.0
      max_samples: 4000
      require_samples: true
      disk_devices:
      - sdb
      cgroup_paths:
      - /sys/fs/cgroup/rq5_lc
      - /sys/fs/cgroup/rq5_be
      output_dir: /tmp/rq5_coloc/monitor/system_metric
io_ext_policy_profiles:
  arm_none:
    name: 'rq5 coloc none: native none baseline'
    target_device: sdb
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
tenant_groups:
  lc_none:
    count: 1
    scene_id_template: rq5_lc_none_t{idx1}
    template:
      base_scene: scene/io_ext/ycsb_rocksdb.yml
      parameters:
        target_device: sdb
        output_dir: /tmp/rq5_coloc/scene/{group_id}
        duration: 950
        drop_caches_before_run: false
        database:
          db_type: rocksdb
          data_dir: /mnt/rq5_coloc/lc
          ycsb_dir: /opt/ioext-bench/src/vm/assets/ycsb/ycsb_runtime
          use_direct_io: true
          write_buffer_size: 67108864
          storage_backend: kernel_block
          environment:
            JAVA_HOME: /tmp/motivation_m2_pilot_20261030_bundle/motivation_m2_pilot_20261030/runtime/java-21-openjdk-amd64
            PATH: /tmp/motivation_m2_pilot_20261030_bundle/motivation_m2_pilot_20261030/runtime/java-21-openjdk-amd64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        system:
          mem_limit_mb: 0
          auto_format_disk: false
          format_device: false
          skip_disk_setup: true
          mount_options: noatime,nodiratime
          cgroup_path: /sys/fs/cgroup/rq5_lc
        scheduler: none
        io_ext:
          cleanup_stale_when_no_specs: true
          cleanup_bpffs_pins: true
        ycsb_workload:
          workload_type: b
          recordcount: 400000
          operationcount: 10000000
          threads: 16
          jvm_args: -Xms2048m -Xmx2048m
          target: 6554
          properties:
            fieldcount: 10
            fieldlength: 1024
            maxexecutiontime: 600
            status.interval: 10
            measurementtype: hdrhistogram
            hdrhistogram.percentiles: 50,95,99,99.9,99.99
  be_write_max:
    count: 1
    scene_id_template: rq5_be_write_max_t{idx1}
    template:
      base_scene: scene/io_ext/dbbench.yml
      parameters:
        target_device: sdb
        output_dir: /tmp/rq5_coloc/scene/{group_id}
        duration: 950
        drop_caches_before_run: false
        dbbench:
          dbbench_bin: /tmp/m1_cache_20261031_bundle/rocksdb/db_bench
          rocksdb_home: /tmp/m1_cache_20261031_bundle/rocksdb
          db_path: /mnt/rq5_coloc/be
          use_direct_io: true
          common_args:
            num: 1000000
            value_size: 1024
            key_size: 16
            compression_type: none
            bloom_bits: 10
            cache_size: 0
            write_buffer_size: 67108864
        system:
          auto_format_disk: false
          format_device: false
          skip_disk_setup: true
          cgroup_path: /sys/fs/cgroup/rq5_be
        scheduler: none
        io_ext:
          cleanup_stale_when_no_specs: true
          cleanup_bpffs_pins: true
        phases:
        - name: wait
          benchmark: sleep
          settle_sec: 150
        - name: fill
          benchmark: fillrandom
          duration: 600
          args:
            num: 100000000
            value_size: 1024
            threads: 8
            benchmark_write_rate_limit: 67108864
  be_compact:
    count: 1
    scene_id_template: rq5_be_compact_t{idx1}
    template:
      base_scene: scene/io_ext/dbbench.yml
      parameters:
        target_device: sdb
        output_dir: /tmp/rq5_coloc/scene/{group_id}
        duration: 1600
        drop_caches_before_run: false
        dbbench:
          dbbench_bin: /tmp/m1_cache_20261031_bundle/rocksdb/db_bench
          rocksdb_home: /tmp/m1_cache_20261031_bundle/rocksdb
          db_path: /mnt/rq5_coloc/be
          use_direct_io: true
          common_args:
            num: 1000000
            value_size: 1024
            key_size: 16
            compression_type: none
            bloom_bits: 10
            cache_size: 0
            write_buffer_size: 67108864
        system:
          auto_format_disk: false
          format_device: false
          skip_disk_setup: true
          cgroup_path: /sys/fs/cgroup/rq5_be
        scheduler: none
        io_ext:
          cleanup_stale_when_no_specs: true
          cleanup_bpffs_pins: true
        phases:
        - name: wait
          benchmark: sleep
          settle_sec: 150
        - name: prefill
          benchmark: fillrandom
          args:
            num: 20000000
            value_size: 1024
            threads: 8
            benchmark_write_rate_limit: 67108864
        - name: settle
          benchmark: sleep
          settle_sec: 30
        - name: compact
          benchmark: compact
          args: {}
  be_ladder_8m:
    count: 1
    scene_id_template: rq5_be_ladder_8m_t{idx1}
