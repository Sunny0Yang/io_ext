# rig_dbbench: RocksDB db_bench global-load scheduler matrix (virtme-ng local test)
#
# Design discipline (same as rig_ycsb, global load only):
#   - single real DB workload per sequence (ONE db_bench process per phase, one cgroup)
#   - NO cgroup io controller values written (no io_weight / io_max / io.latency)
#   - fixed accounting cgroup /sys/fs/cgroup/dbbench_rig (io.stat readable)
#   - no arbiter; iox arms attach one root_policy loader at the cgroup v2 root
#
# Arms (io_ext_policy_profiles):
#   native: none / kyber / mq-deadline / bfq   (scene pins scheduler, no loader)
#   iox:   scx_io + root_policies loader_q_{fifo,kyber,ddl} -c /sys/fs/cgroup
#
# Phase sequence per arm (settle discipline, learned from rig_ycsb §4):
#   fillrandom -> compact (manual full compaction: clears compaction debt
#   deterministically) -> settle 75s -> readrandom 150s (clean-read control)
#   -> settle 30s -> readwhilewriting 150s (foreground reads + background
#   writer thread + flush/compaction; THE tail-amplification target)
#   -> settle 75s -> readrandomwriterandom 150s (90/10 mixed per thread)
#
# Scale: num=1M x value_size=1024 -> ~1.4GB DB on the 10G vng nvme test disk.
# Key metrics: per-phase ops/sec + READ/WRITE percentile histograms parsed
# from db_bench output into phase_results JSON.
benchmark_name: "rig_dbbench global-load RocksDB db_bench scheduler matrix (vng local)"
description: >-
  Global single-tenant RocksDB db_bench load: 7 scheduler arms (none/kyber/
  mq-deadline/bfq native + scx_io q_fifo/q_kyber/q_ddl root-policy loaders),
  O_DIRECT reads + flush/compaction on the 10G vng nvme test disk, phase
  sequence fillrandom/compact/settle/readrandom/settle/readwhilewriting/
  settle/readrandomwriterandom, one fixed accounting cgroup, zero io
  controller writes.
default_sequence: "DBB_smoke_none"

_common_dbbench: &common_dbbench
  target_device: "nvme0n1"          # vng VM always exposes the QEMU nvme disk as nvme0n1
  output_dir: "./test_results/isol_bench/rig_dbbench/{group_id}"
  duration: 1500
  drop_caches_before_run: false
  dbbench:
    dbbench_bin: "/home/anon/rocksdb/db_bench"
    rocksdb_home: "/home/anon/rocksdb"
    db_path: "/tmp/nvme_data/{group_id}_db"
    use_direct_io: true
    common_args:
      num: 1000000
      value_size: 1024
      key_size: 16
      compression_type: "none"
      bloom_bits: 10
      cache_size: 0
      write_buffer_size: 67108864
  system:
    auto_format_disk: true
    format_device: true             # fresh ext4 on the 10G test disk every sequence
    mount_options: "noatime,nodiratime"
    cgroup_path: "/sys/fs/cgroup/dbbench_rig"

# Full-scale phase list; measurement phases are time-bounded via --duration.
_common_phases: &common_phases
  phases:
  - name: "fillrandom"
    benchmark: "fillrandom"         # builds num x value_size DB; runs to completion
  - name: "compact"
    benchmark: "compact"            # manual full compaction: deterministic settle
  - name: "settle1"
    benchmark: "sleep"              # drain residual background work
    settle_sec: 75
  - name: "readrandom"
    benchmark: "readrandom"
    duration: 150
    args:
      threads: 4
  - name: "settle2"
    benchmark: "sleep"
    settle_sec: 30
  - name: "readwhilewriting"
    benchmark: "readwhilewriting"  # foreground reads + writer thread + flush/compaction
    duration: 150
    args:
      threads: 4
      writes: 3000000             # cap writer: bounds DB growth to ~4.5GB on the 10G disk
                                   # (~3M keys worst case; flush/compaction keeps the
                                   # window polluted after the writer exhausts the cap)
  - name: "settle3"
    benchmark: "sleep"
    settle_sec: 75
  - name: "readrandomwriterandom"
    benchmark: "readrandomwriterandom"
    duration: 150
    args:
      threads: 8
      readwritepercent: 90

_smoke_phases: &smoke_phases
  phases:
  - name: "fillrandom"
    benchmark: "fillrandom"
  - name: "compact"
    benchmark: "compact"
  - name: "settle1"
    benchmark: "sleep"
    settle_sec: 30
  - name: "readrandom"
    benchmark: "readrandom"
    duration: 30
    args:
      threads: 4
  - name: "settle2"
    benchmark: "sleep"
    settle_sec: 10
  - name: "readwhilewriting"
    benchmark: "readwhilewriting"
    duration: 30
    args:
      threads: 4
      writes: 100000000
  - name: "settle3"
    benchmark: "sleep"
    settle_sec: 10
  - name: "readrandomwriterandom"
    benchmark: "readrandomwriterandom"
    duration: 30
    args:
      threads: 8
      readwritepercent: 90

_native_scene_io_ext: &native_scene_io_ext
  cleanup_stale_when_no_specs: true  # no loaders of our own; sweep leftovers from crashed sequences
  cleanup_bpffs_pins: true

_iox_scene_io_ext: &iox_scene_io_ext
  cleanup_stale: false               # global loader scene owns the loader chain for the sequence
  cleanup_bpffs_pins: false
  loaders: []
  cgroup_policies: []

scenes:
  ib_system_metric:
    base_scene: "scene/system/system_metric.yml"
    parameters:
      collection_mode: "proc"
      sample_interval: 1.0
      max_samples: 1800
      require_samples: true
      disk_devices:
      - nvme0n1
      output_dir: "./test_results/isol_bench/rig_dbbench/system_metric"

io_ext_policy_profiles:
  arm_none:
    name: "rig dbbench native none"
    target_device: "nvme0n1"
    scheduler: "none"
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  arm_kyber:
    name: "rig dbbench native kyber"
    target_device: "nvme0n1"
    scheduler: "kyber"
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  arm_mq_deadline:
    name: "rig dbbench native mq-deadline"
    target_device: "nvme0n1"
    scheduler: "mq-deadline"
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  arm_bfq:
    name: "rig dbbench native bfq"
    target_device: "nvme0n1"
    scheduler: "bfq"
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  arm_iox_q_fifo:
    name: "rig dbbench iox q_fifo"
    target_device: "nvme0n1"
    scheduler: "scx_io"
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - "loader_arb_"
      - "loader_q_"
      - "loader_minimal"
      root_cgroup:
        path: "/sys/fs/cgroup"
        controllers:
        - "io"
      root_policies:
      - name: "q_fifo_root"
        path: "/opt/io-ext/userspace/loader_q_fifo"
        scope: "root_policy"
        args:
        - "-c"
        - "{policy_cgroup_path}"
  arm_iox_q_kyber:
    name: "rig dbbench iox q_kyber"
    target_device: "nvme0n1"
    scheduler: "scx_io"
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - "loader_arb_"
      - "loader_q_"
      - "loader_minimal"
      root_cgroup:
        path: "/sys/fs/cgroup"
        controllers:
        - "io"
      root_policies:
      - name: "q_kyber_root"
        path: "/opt/io-ext/userspace/loader_q_kyber"
        scope: "root_policy"
        args:
        - "-c"
        - "{policy_cgroup_path}"
  arm_iox_q_ddl:
    name: "rig dbbench iox q_ddl"
    target_device: "nvme0n1"
    scheduler: "scx_io"
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - "loader_arb_"
      - "loader_q_"
      - "loader_minimal"
      root_cgroup:
        path: "/sys/fs/cgroup"
        controllers:
        - "io"
      root_policies:
      - name: "q_ddl_root"
        path: "/opt/io-ext/userspace/loader_q_ddl"
        scope: "root_policy"
        args:
        - "-c"
        - "{policy_cgroup_path}"

tenant_groups:
  # ---------- smoke: native none, 100k keys ----------
  dbb_smoke_none:
    count: 1
    scene_id_template: "dbb_smoke_none_t{idx1}"
    template:
      base_scene: "scene/io_ext/dbbench.yml"
      parameters:
        <<: *common_dbbench
        scheduler: "none"
        io_ext: *native_scene_io_ext
        duration: 900
        dbbench:
          dbbench_bin: "/home/anon/rocksdb/db_bench"
          rocksdb_home: "/home/anon/rocksdb"
          db_path: "/tmp/nvme_data/{group_id}_db"
          use_direct_io: true
          common_args:
            num: 100000
            value_size: 1024
            key_size: 16
            compression_type: "none"
            bloom_bits: 10
            cache_size: 0
            write_buffer_size: 67108864
        <<: *smoke_phases
  # ---------- full-scale arms ----------
  dbb_none:
    count: 1
    scene_id_template: "dbb_none_t{idx1}"
    template:
      base_scene: "scene/io_ext/dbbench.yml"
      parameters:
        <<: *common_dbbench
        scheduler: "none"
        io_ext: *native_scene_io_ext
        <<: *common_phases
  dbb_kyber:
    count: 1
    scene_id_template: "dbb_kyber_t{idx1}"
    template:
      base_scene: "scene/io_ext/dbbench.yml"
      parameters:
        <<: *common_dbbench
        scheduler: "kyber"
        io_ext: *native_scene_io_ext
        <<: *common_phases
  dbb_mq_deadline:
    count: 1
    scene_id_template: "dbb_mq_deadline_t{idx1}"
    template:
      base_scene: "scene/io_ext/dbbench.yml"
      parameters:
        <<: *common_dbbench
        scheduler: "mq-deadline"
        io_ext: *native_scene_io_ext
        <<: *common_phases
  dbb_bfq:
    count: 1
    scene_id_template: "dbb_bfq_t{idx1}"
    template:
      base_scene: "scene/io_ext/dbbench.yml"
      parameters:
        <<: *common_dbbench
        scheduler: "bfq"
        io_ext: *native_scene_io_ext
        <<: *common_phases
  dbb_iox_q_fifo:
    count: 1
    scene_id_template: "dbb_iox_q_fifo_t{idx1}"
    template:
      base_scene: "scene/io_ext/dbbench.yml"
      parameters:
        <<: *common_dbbench
        scheduler: "scx_io"
        io_ext: *iox_scene_io_ext
        <<: *common_phases
  dbb_iox_q_kyber:
    count: 1
    scene_id_template: "dbb_iox_q_kyber_t{idx1}"
    template:
      base_scene: "scene/io_ext/dbbench.yml"
      parameters:
        <<: *common_dbbench
        scheduler: "scx_io"
        io_ext: *iox_scene_io_ext
        <<: *common_phases
  dbb_iox_q_ddl:
    count: 1
    scene_id_template: "dbb_iox_q_ddl_t{idx1}"
    template:
      base_scene: "scene/io_ext/dbbench.yml"
      parameters:
        <<: *common_dbbench
        scheduler: "scx_io"
        io_ext: *iox_scene_io_ext
        <<: *common_phases

test_sequences:
- sequence_id: "DBB_smoke_none"
  name: "smoke: native none small scale (100k keys) full phase chain"
  io_ext_policy: "arm_none"
  steps:
  - name: "smoke dbbench 100k none"
    tenant_groups:
    - "dbb_smoke_none"
    monitoring_scenes:
    - "ib_system_metric"
    monitoring_startup_time: 3
    duration: 900
- sequence_id: "DBB_none"
  name: "dbbench native none"
  io_ext_policy: "arm_none"
  steps:
  - name: "dbbench none"
    tenant_groups:
    - "dbb_none"
    monitoring_scenes:
    - "ib_system_metric"
    monitoring_startup_time: 3
    duration: 1500
- sequence_id: "DBB_kyber"
  name: "dbbench native kyber"
  io_ext_policy: "arm_kyber"
  steps:
  - name: "dbbench kyber"
    tenant_groups:
    - "dbb_kyber"
    monitoring_scenes:
    - "ib_system_metric"
    monitoring_startup_time: 3
    duration: 1500
- sequence_id: "DBB_mq_deadline"
  name: "dbbench native mq-deadline"
  io_ext_policy: "arm_mq_deadline"
  steps:
  - name: "dbbench mq-deadline"
    tenant_groups:
    - "dbb_mq_deadline"
    monitoring_scenes:
    - "ib_system_metric"
    monitoring_startup_time: 3
    duration: 1500
- sequence_id: "DBB_bfq"
  name: "dbbench native bfq"
  io_ext_policy: "arm_bfq"
  steps:
  - name: "dbbench bfq"
    tenant_groups:
    - "dbb_bfq"
    monitoring_scenes:
    - "ib_system_metric"
    monitoring_startup_time: 3
    duration: 1500
- sequence_id: "DBB_q_fifo"
  name: "dbbench iox scx_io q_fifo"
  io_ext_policy: "arm_iox_q_fifo"
  steps:
  - name: "dbbench iox q_fifo"
    tenant_groups:
    - "dbb_iox_q_fifo"
    monitoring_scenes:
    - "ib_system_metric"
    monitoring_startup_time: 3
    duration: 1500
- sequence_id: "DBB_q_kyber"
  name: "dbbench iox scx_io q_kyber"
  io_ext_policy: "arm_iox_q_kyber"
  steps:
  - name: "dbbench iox q_kyber"
    tenant_groups:
    - "dbb_iox_q_kyber"
    monitoring_scenes:
    - "ib_system_metric"
    monitoring_startup_time: 3
    duration: 1500
- sequence_id: "DBB_q_ddl"
  name: "dbbench iox scx_io q_ddl"
  io_ext_policy: "arm_iox_q_ddl"
  steps:
  - name: "dbbench iox q_ddl"
    tenant_groups:
    - "dbb_iox_q_ddl"
    monitoring_scenes:
    - "ib_system_metric"
    monitoring_startup_time: 3
    duration: 1500