        <<: *common_ycsb
        scheduler: "none"
        io_ext: *native_scene_io_ext
        duration: 900
        ycsb_workload:
          <<: *common_workload
          workload_type: "c"
          recordcount: 100000
          operationcount: 100000
          threads: 16
          jvm_args: "-Xms2048m -Xmx2048m"
