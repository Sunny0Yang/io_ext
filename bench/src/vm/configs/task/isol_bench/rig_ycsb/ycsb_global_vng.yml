  name: "smoke: native none + workloadc small scale (100k records)"
  io_ext_policy: "arm_none"
  steps:
  - name: "smoke workloadc 100k/100k none"
    tenant_groups:
    - "ycsb_smoke_none_c"
    monitoring_scenes:
    - "ib_system_metric"
    - "ib_block_io_latency_cost"
    monitoring_startup_time: 3
    duration: 900
- sequence_id: "YCSB_none_a"
