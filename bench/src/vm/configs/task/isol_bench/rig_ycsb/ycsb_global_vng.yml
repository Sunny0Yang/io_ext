# rig_ycsb: YCSB/RocksDB GLOBAL-load scheduler matrix (virtme-ng local test)
#
# Design discipline (this round = global load only):
#   - single real DB workload per sequence (one YCSB process, one cgroup)
#   - NO cgroup io controller values written (no io_weight / io_max / io_latency)
#   - fixed workload cgroup /sys/fs/cgroup/ycsb_rig for accounting only
#   - no arbiter; iox arms attach one root_policy loader at the cgroup v2 root
#
# Arms (io_ext_policy_profiles):
#   native: none / kyber / mq-deadline / bfq   (scene pins scheduler, no loader)
#   iox:   scx_io + root_policies loader_q_{fifo,kyber,ddl,sp_edf} -c /sys/fs/cgroup
#
# Workloads: a (50% read / 50% update -> WAL + flush/compaction background writes)
#            c (100% read -> pure foreground read control)
# Run phase is time-bounded via YCSB maxexecutiontime=150s; operationcount is a
# high ceiling so ops/sec measurement is over a fixed ~150s window.
benchmark_name: "rig_ycsb global-load YCSB/RocksDB scheduler x workload matrix (vng local)"
description: >-
  Global single-tenant YCSB/RocksDB load: 8 scheduler arms (none/kyber/mq-deadline/
  bfq native + scx_io q_fifo/q_kyber/q_ddl/q_sp_edf root-policy loaders) x 2 YCSB
  workloads (a=read/update, c=read-only), direct-I/O RocksDB on the 10G vng nvme
  test disk, one fixed accounting cgroup, zero io controller writes.
default_sequence: "YCSB_smoke_none_c"

# Common YCSB run-scale knobs; per-arm templates merge `<<: *common_workload`
# inside ycsb_workload and add workload_type. Explicit keys here MUST stay
# complete because base-scene defaults (recordcount=1000 etc.) are only
# overridden by keys actually present in the task-level mapping.
_common_workload: &common_workload
  recordcount: 400000              # ~4GB logical (10 x 1024B fields); sized so 16 matrix
                                     # loads fit the 2.5h local budget at ~3k inserts/s
  operationcount: 10000000        # ceiling; maxexecutiontime bounds the run phase
  threads: 16
  jvm_args: "-Xms2048m -Xmx2048m"
  properties:
    fieldcount: 10
    fieldlength: 1024
    maxexecutiontime: 150          # run phase ~150s regardless of ops rate

_common_ycsb_params: &common_ycsb
  target_device: "nvme0n1"          # vng VM always exposes the QEMU nvme disk as nvme0n1
  output_dir: "./test_results/isol_bench/rig_ycsb/{group_id}"
  duration: 2100                     # scene-level bound (informational); real bound is step duration
  drop_caches_before_run: false      # direct-I/O RocksDB: page cache irrelevant for data files
  database:
    db_type: "rocksdb"
    data_dir: "/tmp/nvme_data/{group_id}_tenant_{idx1}"   # /tmp/nvme_data = target disk mount point
    ycsb_dir: "src/vm/assets/ycsb/ycsb_runtime"
    use_direct_io: true              # scene emits options file: O_DIRECT reads + flush/compaction
    write_buffer_size: 67108864      # 64MB memtable: load phase fast enough for the 2.5h local budget,
                                     # still ~1 flush every few seconds of workloada run-phase updates
    storage_backend: "kernel_block"
  system:
    mem_limit_mb: 0                  # no memory cgroup limiting
    auto_format_disk: true
    format_device: true              # fresh ext4 on the 10G test disk every sequence
    mount_options: "noatime,nodiratime"
    cgroup_path: "/sys/fs/cgroup/ycsb_rig"   # fixed accounting-only cgroup; no io.* values written

_native_scene_io_ext: &native_scene_io_ext
  cleanup_stale_when_no_specs: true  # no loaders of our own; sweep leftovers from crashed sequences
  cleanup_bpffs_pins: true

_iox_scene_io_ext: &iox_scene_io_ext
  cleanup_stale: false               # global loader scene owns the loader chain for the sequence
  cleanup_bpffs_pins: false
  loaders: []
  cgroup_policies: []

scenes:
  ib_system_metric:
    base_scene: "scene/system/system_metric.yml"
    parameters:
      collection_mode: "proc"
      sample_interval: 1.0
      max_samples: 3600
      require_samples: true
      disk_devices:
      - nvme0n1
      output_dir: "./test_results/isol_bench/rig_ycsb/system_metric"
  ib_block_io_latency_cost:
    base_scene: "scene/block_bpf/block_io_latency_cost.yml"
    parameters:
      output_dir: "./test_results/isol_bench/rig_ycsb/block_io_latency_cost"
      output_file: "./test_results/isol_bench/rig_ycsb/block_io_latency_cost/block_io_latency_cost.bpftrace.log"
      summary_file: "./test_results/isol_bench/rig_ycsb/block_io_latency_cost/block_io_latency_cost_summary.json"
      require_events: false
      privilege:
        method: "sudo_nopasswd"
        askpass_script: ""

io_ext_policy_profiles:
  arm_none:
    name: "rig ycsb native none"
    target_device: "nvme0n1"
    scheduler: "none"
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  arm_kyber:
    name: "rig ycsb native kyber"
    target_device: "nvme0n1"
    scheduler: "kyber"
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  arm_mq_deadline:
    name: "rig ycsb native mq-deadline"
    target_device: "nvme0n1"
    scheduler: "mq-deadline"
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  arm_bfq:
    name: "rig ycsb native bfq"
    target_device: "nvme0n1"
    scheduler: "bfq"
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  arm_iox_q_fifo:
    name: "rig ycsb iox q_fifo"
    target_device: "nvme0n1"
    scheduler: "scx_io"
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - "loader_arb_"
      - "loader_q_"
      - "loader_minimal"
      root_cgroup:
        path: "/sys/fs/cgroup"
        controllers:
        - "io"
      root_policies:
      - name: "q_fifo_root"
        path: "/opt/io-ext/userspace/loader_q_fifo"
        scope: "root_policy"
        args:
        - "-c"
        - "{policy_cgroup_path}"
  arm_iox_q_kyber:
    name: "rig ycsb iox q_kyber"
    target_device: "nvme0n1"
    scheduler: "scx_io"
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - "loader_arb_"
      - "loader_q_"
      - "loader_minimal"
      root_cgroup:
        path: "/sys/fs/cgroup"
        controllers:
        - "io"
      root_policies:
      - name: "q_kyber_root"
        path: "/opt/io-ext/userspace/loader_q_kyber"
        scope: "root_policy"
        args:
        - "-c"
        - "{policy_cgroup_path}"
  arm_iox_q_ddl:
    name: "rig ycsb iox q_ddl"
    target_device: "nvme0n1"
    scheduler: "scx_io"
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - "loader_arb_"
      - "loader_q_"
      - "loader_minimal"
      root_cgroup:
        path: "/sys/fs/cgroup"
        controllers:
        - "io"
      root_policies:
      - name: "q_ddl_root"
        path: "/opt/io-ext/userspace/loader_q_ddl"
        scope: "root_policy"
        args:
        - "-c"
        - "{policy_cgroup_path}"
  arm_iox_q_sp_edf:
    name: "rig ycsb iox q_sp_edf"
    target_device: "nvme0n1"
    scheduler: "scx_io"
    io_ext:
      cleanup_stale: true
