# AUTO-GENERATED by scripts/gen_d2d4_addendum.py (2026-11-02 addendum batch)
# Addendum-only config: no existing sequence ids are modified.
benchmark_name: isol_bench D2 fairness addendum (q+arb arms)
description: 'D2 addendum 2026-11-02: q+arb arms on saturated weighted gradient. iox_q_ddl_arb_wdrr (q_ddl LAT/BULK dual FIFO under arb_wdrr) is the primary arm; iox_q_sp_edf_arb_wdrr is the backup arm. cg=[2,4,8,16] x iter=[1,2,3]. Same saturation/weight ladder as d2_fairness.yml (-W 100*i).'
scenes:
  ib_system_metric:
    base_scene: scene/system/system_metric.yml
    parameters:
      collection_mode: proc
      sample_interval: 1.0
      max_samples: 120
      require_samples: true
      disk_devices:
      - sdb
      output_dir: ./test_results/isol_bench/paper_sdb/d2qb/system_metric
  ib_block_io_latency_cost:
    base_scene: scene/block_bpf/block_io_latency_cost.yml
    parameters:
      output_dir: ./test_results/isol_bench/paper_sdb/d2qb/block_io_latency_cost
      output_file: ./test_results/isol_bench/paper_sdb/d2qb/block_io_latency_cost/block_io_latency_cost.bpftrace.log
      summary_file: ./test_results/isol_bench/paper_sdb/d2qb/block_io_latency_cost/block_io_latency_cost_summary.json
      require_events: false
      privilege:
        method: sudo_nopasswd
  ib_scx_io_bypass_fallback:
    base_scene: scene/block_bpf/scx_io_bypass_fallback.yml
    parameters:
      require_events: false
      output_dir: ./test_results/isol_bench/paper_sdb/d2qb/scx_io_bypass_fallback
  ib_perf_stat:
    base_scene: scene/system/perf_stat.yml
    parameters:
      cpu_list: '2'
      sample_interval_ms: 1000
      require_available: false
      output_dir: ./test_results/isol_bench/paper_sdb/d2qb/perf_stat
io_ext_policy_profiles:
  iox_q_ddl_arb_wdrr_cg2:
    name: paper iox q_ddl_arb_wdrr per-cgroup cg2
    target_device: sdb
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - loader_arb_
      - loader_q_
      - loader_minimal
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      arbiters:
      - name: arb_wdrr
        path: /opt/io-ext/userspace/loader_arb_wdrr
        scope: arbiter
      cgroup_policies_from_groups:
      - tenant_group: d2qb_w1_ncg2
        name_template: q_ddl_w1
        path: /opt/io-ext/userspace/loader_q_ddl
