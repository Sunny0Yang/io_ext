# AUTO-GENERATED by scripts/gen_d2d4_addendum.py (2026-11-02 addendum batch)
# Addendum-only config: no existing sequence ids are modified.
benchmark_name: isol_bench D3 priority-vs-util addendum (hetero q+arb)
description: "D3 addendum 2026-11-02: hetero Pareto points on the 1 LC + 4 BE rread_4k axis. Point 1 (mandated): q_ddl under arb_wdrr \u2014 LC cgroup q_ddl prio 0 (LAT channel via 4k-read fallback), BE cgroups q_ddl prio 7 with io.prio.class=idle (BULK channel). Point 2: LC q_sp_edf prio 0 + BE q_wedf prio 7 under arb_wdrr (weighted-EDF BE to reduce BE-induced LC interference vs the q_fifo BE baseline)."
scenes:
  ib_system_metric:
    base_scene: scene/system/system_metric.yml
    parameters:
      collection_mode: proc
      sample_interval: 1.0
      max_samples: 120
      require_samples: true
      disk_devices:
      - sdb
      output_dir: ./test_results/isol_bench/paper_sdb/d3qb/system_metric
  ib_block_io_latency_cost:
    base_scene: scene/block_bpf/block_io_latency_cost.yml
    parameters:
      output_dir: ./test_results/isol_bench/paper_sdb/d3qb/block_io_latency_cost
      output_file: ./test_results/isol_bench/paper_sdb/d3qb/block_io_latency_cost/block_io_latency_cost.bpftrace.log
      summary_file: ./test_results/isol_bench/paper_sdb/d3qb/block_io_latency_cost/block_io_latency_cost_summary.json
      require_events: false
      privilege:
        method: sudo_nopasswd
  ib_scx_io_bypass_fallback:
    base_scene: scene/block_bpf/scx_io_bypass_fallback.yml
    parameters:
      require_events: false
      output_dir: ./test_results/isol_bench/paper_sdb/d3qb/scx_io_bypass_fallback
  ib_perf_stat:
    base_scene: scene/system/perf_stat.yml
    parameters:
      cpu_list: '2'
      sample_interval_ms: 1000
      require_available: false
      output_dir: ./test_results/isol_bench/paper_sdb/d3qb/perf_stat
io_ext_policy_profiles:
  iox_q_ddl_arb_wdrr_hetero:
    name: paper iox q_ddl arb_wdrr hetero (LC LAT / BE BULK)
    target_device: sdb
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - loader_arb_
      - loader_q_
      - loader_minimal
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      arbiters:
      - name: arb_wdrr
        path: /opt/io-ext/userspace/loader_arb_wdrr
        scope: arbiter
      cgroup_policies_from_groups:
      - tenant_group: d3qb_iox_lc
        name_template: q_ddl_lc
        path: /opt/io-ext/userspace/loader_q_ddl
        scope: cgroup_policy
        args:
        - -c
        - '{policy_cgroup_path}'
        - -p
        - '0'
      - tenant_group: d3qb_iox_be_ddl
        name_template: q_ddl_be_t{idx1}
        path: /opt/io-ext/userspace/loader_q_ddl
        scope: cgroup_policy
        args:
        - -c
        - '{policy_cgroup_path}'
        - -p
        - '7'
  iox_q_sp_wedf_arb_wdrr_hetero:
    name: paper iox q_sp_edf(LC) + q_wedf(BE) arb_wdrr hetero
    target_device: sdb
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - loader_arb_
      - loader_q_
      - loader_minimal
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      arbiters:
      - name: arb_wdrr
        path: /opt/io-ext/userspace/loader_arb_wdrr
        scope: arbiter
      cgroup_policies_from_groups:
      - tenant_group: d3qb_iox_lc
        name_template: q_sp_edf_lc
        path: /opt/io-ext/userspace/loader_q_sp_edf
        scope: cgroup_policy
        args:
        - -c
        - '{policy_cgroup_path}'
        - -p
        - '0'
      - tenant_group: d3qb_iox_be
        name_template: q_wedf_be_t{idx1}
        path: /opt/io-ext/userspace/loader_q_wedf
        scope: cgroup_policy
        args:
        - -c
        - '{policy_cgroup_path}'
        - -p
        - '7'
