      cleanup_bpffs_pins: true
  IB_io_max:
    name: D4bw io_max
    target_device: sdb
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  iox_q_wedf:
    name: D4bw iox q_wedf
    target_device: sdb
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - loader_arb_
      - loader_q_
      - loader_minimal
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      root_policies:
      - name: q_wedf_root
        path: /opt/io-ext/userspace/loader_q_wedf
        scope: root_policy
        args:
        - -c
        - '{policy_cgroup_path}'
  iox_arb_only:
    name: D4bw iox arb_only (arb_wdrr + q_fifo passthrough)
    target_device: sdb
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - loader_arb_
      - loader_q_
      - loader_minimal
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      arbiters:
      - name: arb_wdrr
        path: /opt/io-ext/userspace/loader_arb_wdrr
        scope: arbiter
      cgroup_policies_from_groups:
      - tenant_group: d4bw_iox_arb_only_lc
        name_template: q_fifo_lc
        path: /opt/io-ext/userspace/loader_q_fifo
        scope: cgroup_policy
        args:
        - -c
        - '{policy_cgroup_path}'
        - -W
        - '400'
      - tenant_group: d4bw_iox_arb_only_be
        name_template: q_fifo_be
        path: /opt/io-ext/userspace/loader_q_fifo
        scope: cgroup_policy
        args:
