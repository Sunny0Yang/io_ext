# AUTO-GENERATED by scripts/gen_d2d4_addendum.py (2026-11-02 addendum batch)
# Addendum-only config: no existing sequence ids are modified.
benchmark_name: isol_bench D4 burst design-fix rerun (7 representative arms)
description: 'D4 addendum 2026-11-02 (design-fix rerun): BE job now carries write_bw_log + log_avg_msec=1000 + log_unix_epoch=1 (1s bandwidth buckets) so the post-burst background-throughput recovery panel can be rendered alongside the 1ms LC clat timeline. LC burst structure unchanged (60s saturation startdelay + 10s QD1 burst, 90s total). 7 representative arms, single run each: none, bfq, io_latency, io_max, iox q_wedf, iox_arb_only (arb_wdrr+q_fifo), iox_q_ddl_arb_wdrr (q_ddl LAT/BULK under arb_wdrr, LC:BE weight 400:100, BE io.prio.class=idle routes BE reads to the BULK channel).'
scenes:
  ib_system_metric:
    base_scene: scene/system/system_metric.yml
    parameters:
      collection_mode: proc
      sample_interval: 1.0
      max_samples: 120
      require_samples: true
      disk_devices:
      - sdb
      output_dir: ./test_results/isol_bench/paper_sdb/d4bw/system_metric
  ib_block_io_latency_cost:
    base_scene: scene/block_bpf/block_io_latency_cost.yml
    parameters:
      output_dir: ./test_results/isol_bench/paper_sdb/d4bw/block_io_latency_cost
      output_file: ./test_results/isol_bench/paper_sdb/d4bw/block_io_latency_cost/block_io_latency_cost.bpftrace.log
      summary_file: ./test_results/isol_bench/paper_sdb/d4bw/block_io_latency_cost/block_io_latency_cost_summary.json
      require_events: false
      privilege:
        method: sudo_nopasswd
  ib_scx_io_bypass_fallback:
    base_scene: scene/block_bpf/scx_io_bypass_fallback.yml
    parameters:
      require_events: false
      output_dir: ./test_results/isol_bench/paper_sdb/d4bw/scx_io_bypass_fallback
  ib_perf_stat:
    base_scene: scene/system/perf_stat.yml
    parameters:
      cpu_list: '2'
      sample_interval_ms: 1000
      require_available: false
      output_dir: ./test_results/isol_bench/paper_sdb/d4bw/perf_stat
io_ext_policy_profiles:
  IB_none:
    name: D4bw none
    target_device: sdb
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  IB_bfq:
    name: D4bw bfq
    target_device: sdb
    scheduler: bfq
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  IB_io_latency:
    name: D4bw io_latency
