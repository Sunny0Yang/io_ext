benchmark_name: isol_bench D4 burst — LC (paper reproduction)
description: 'D4-LC: 1 LC (delay 60s, 10s burst, libaio QD=1) + 1 BE (80s, QD=256); 9 native knobs + 8 iox policies. Batch
  burst variant removed 2026-10-21.'
scenes:
  ib_system_metric:
    base_scene: scene/system/system_metric.yml
    parameters:
      collection_mode: proc
      sample_interval: 1.0
      max_samples: 120
      require_samples: true
      disk_devices:
      - sdb
      output_dir: ./test_results/isol_bench/paper_sdb/d4_lc/system_metric
  ib_block_io_latency_cost:
    base_scene: scene/block_bpf/block_io_latency_cost.yml
    parameters:
      output_dir: ./test_results/isol_bench/paper_sdb/d4_lc/block_io_latency_cost
      output_file: ./test_results/isol_bench/paper_sdb/d4_lc/block_io_latency_cost/block_io_latency_cost.bpftrace.log
      summary_file: ./test_results/isol_bench/paper_sdb/d4_lc/block_io_latency_cost/block_io_latency_cost_summary.json
      require_events: false
      privilege:
        method: sudo_nopasswd
  ib_scx_io_bypass_fallback:
    base_scene: scene/block_bpf/scx_io_bypass_fallback.yml
    parameters:
      require_events: false
      output_dir: ./test_results/isol_bench/paper_sdb/d4_lc/scx_io_bypass_fallback
  ib_perf_stat:
    base_scene: scene/system/perf_stat.yml
    parameters:
      cpu_list: '2'
      sample_interval_ms: 1000
      require_available: false
      output_dir: ./test_results/isol_bench/paper_sdb/d4_lc/perf_stat
