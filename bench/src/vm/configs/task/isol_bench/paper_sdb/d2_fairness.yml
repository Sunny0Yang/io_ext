# AUTO-GENERATED by gen_isol_bench_paper_yamls.py --track sdb
# RECAL on new hardware (grep for 'RECAL('):
#   RECAL(DEVICE)  target_device=sdb  (file_name=/dev/sdb)
#   RECAL(CPUBIND) batch cpu pinning='1-5' (D1-Q2 axes)
#   RECAL(IOCOST)  io.cost linear model r/w bps=335544320 iops=82000
#   RECAL(D2SAT)   D2 saturation bytes (io.max share divisor)=335544320
#   RECAL(LAT)     io.latency targets us: D2 weighted=96000..12000 D4 LC=12000
#   RECAL(D3AXIS)  D3 io.max MiB/s axis=32..640 io.latency axis=10..30000 io.cost rlat grid(us)=[15, 10000, 20000]
benchmark_name: isol_bench D2 fairness (paper reproduction)
description: 'D2: saturated contention + weight gradient 1:2:...:ncg ONLY (uniform/unfair_output/mixed_* variants removed
  2026-10-21); 1 fio process/cgroup via fio_subjob; 9 native knobs + 8 iox policies; ncg=[2, 4, 8, 16] (rig point cg=8); iter=[1,
  2, 3].'
scenes:
  ib_system_metric:
    base_scene: scene/system/system_metric.yml
    parameters:
      collection_mode: proc
      sample_interval: 1.0
      max_samples: 120
      require_samples: true
      disk_devices:
      - sdb
      output_dir: ./test_results/isol_bench/paper_sdb/d2/system_metric
  ib_block_io_latency_cost:
    base_scene: scene/block_bpf/block_io_latency_cost.yml
    parameters:
      output_dir: ./test_results/isol_bench/paper_sdb/d2/block_io_latency_cost
      output_file: ./test_results/isol_bench/paper_sdb/d2/block_io_latency_cost/block_io_latency_cost.bpftrace.log
      summary_file: ./test_results/isol_bench/paper_sdb/d2/block_io_latency_cost/block_io_latency_cost_summary.json
      require_events: false
      privilege:
        method: sudo_nopasswd
  ib_scx_io_bypass_fallback:
    base_scene: scene/block_bpf/scx_io_bypass_fallback.yml
    parameters:
      require_events: false
      output_dir: ./test_results/isol_bench/paper_sdb/d2/scx_io_bypass_fallback
  ib_perf_stat:
    base_scene: scene/system/perf_stat.yml
    parameters:
      cpu_list: '2'
      sample_interval_ms: 1000
      require_available: false
      output_dir: ./test_results/isol_bench/paper_sdb/d2/perf_stat
