test_sequences:
  # === depth 1 ===
  - sequence_id: "D1Q6_d1_native"
    name: "D1-Q6 depth=1 native none"
    io_ext_policy: "nat_none"
    steps:
      - {name: "depth=1 native", tenant_groups: ["d1_native"], monitoring_scenes: ["ib_system_metric", "ib_perf_stat"], monitoring_startup_time: 3, duration: 120}
  - sequence_id: "D1Q6_d1_iox_bare"
    name: "D1-Q6 depth=1 iox_bare"
    io_ext_policy: "iox_bare"
    steps:
      - {name: "depth=1 iox_bare", tenant_groups: ["d1_iox_bare"], monitoring_scenes: ["ib_system_metric", "ib_perf_stat"], monitoring_startup_time: 3, duration: 120}
  - sequence_id: "D1Q6_d1_iox_fifo"
