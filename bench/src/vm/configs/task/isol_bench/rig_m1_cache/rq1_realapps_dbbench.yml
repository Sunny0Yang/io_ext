# rq1_realapps_dbbench: RQ1 real-app controller comparison on RocksDB db_bench
# readwhilewriting (cache=on 口径, kvmhost /dev/sdb; runner formats+mounts
# /mnt/rq1_20261031 per case).
#
# Arms: RQ1_DBB_{NONE, IO_COST, IOX_Q_DDL, IOX_ARB_Q} -- same controller set as
# rq1_realapps_ycsb.yml (io.cost root write uses the dbbench scene's
# setup_iocost_at_root support; iox profiles identical to the ycsb file;
# IOX_ARB_Q is the optional ours_global arm, select/exclude via runner --only).
# Workload: fillrandom -> settle 75s -> readwhilewriting 150s (measured window),
# buffered + explicit 32 MiB block cache + drop_caches_before_run: true.
#
# Repeats are runner-controlled (--repeats N -> case <seq>_r<k>); >= 3 per arm.
#
# Result convention (results dir, separated from motivation_*):
#   results/rq1_realapps_dbbench/<RUN_ID>/
benchmark_name: "RQ1 real-app db_bench readwhilewriting: none / io.cost / iox_q_ddl / iox_arb_q (cache=on)"
description: >-
  Single-tenant db_bench readwhilewriting on freshly formatted /dev/sdb, one arm
  per sequence. Native none, root io.cost (sdb RECAL calibration), iox
  queue-only (loader_q_ddl), iox arbiter+queue (arb_wdrr + q_fifo). Repeats via
  the campaign runner.
default_sequence: "RQ1_DBB_NONE"
fail_fast_on_scene_error: true

_native_none_io_ext: &native_none_io_ext
  cleanup_stale_when_no_specs: true
  cleanup_bpffs_pins: true

_iox_scene_io_ext: &iox_scene_io_ext
  cleanup_stale: false
  cleanup_bpffs_pins: false
  loaders: []
  cgroup_policies: []

_io_cost_model: &io_cost_model
  ctrl: "user"
  model: "linear"
  rbps: 335544320
  rseqiops: 82000
  rrandiops: 82000
  wbps: 335544320
  wseqiops: 82000
  wrandiops: 82000
_io_cost_qos: &io_cost_qos
  enable: true
  ctrl: "user"
  rpct: 95.0
  rlat: 1000000
  wpct: 95.0
  wlat: 1000000
  min: 50.0
  max: 150.0

_common_dbbench: &common_dbbench
  target_device: "sdb"
  output_dir: "/tmp/rq1_20261031/scene/{group_id}"
  duration: 900
  drop_caches_before_run: true   # cache=on attribution discipline (§0.2)
  dbbench:
    dbbench_bin: "/tmp/m1_cache_20261031_bundle/rocksdb/db_bench"
    rocksdb_home: "/tmp/m1_cache_20261031_bundle/rocksdb"
    db_path: "/mnt/rq1_20261031/dbbench_db"
    use_direct_io: false
    common_args:
      num: 1000000
      value_size: 1024
      key_size: 16
      compression_type: "none"
      bloom_bits: 10
      cache_size: 33554432   # explicit 32 MiB block cache (cache=on 口径)
      write_buffer_size: 67108864
  system:
    auto_format_disk: true
    format_device: false
    mount_options: "noatime,nodiratime"
    cgroup_path: "/sys/fs/cgroup/rq1_dbb"

_common_phases: &common_phases
  phases:
  - name: "fillrandom"
    benchmark: "fillrandom"
  - name: "settle1"
    benchmark: "sleep"
    settle_sec: 75
  - name: "readwhilewriting"
    benchmark: "readwhilewriting"
    duration: 150
    args:
      threads: 4
      writes: 3000000

scenes:
  ib_system_metric:
    base_scene: "scene/system/system_metric.yml"
    parameters:
      collection_mode: "proc"
      sample_interval: 1.0
      max_samples: 3600
      require_samples: true
      disk_devices:
      - "sdb"
      output_dir: "/tmp/rq1_20261031/monitor/system_metric"

io_ext_policy_profiles:
  arm_none:
    name: "rq1 dbbench native none"
    target_device: "sdb"
    scheduler: "none"
    io_ext: *native_none_io_ext
  arm_io_cost:
    name: "rq1 dbbench io.cost root controller"
    target_device: "sdb"
    scheduler: "none"
    io_ext: *native_none_io_ext
  arm_iox_q_ddl:
    name: "rq1 dbbench iox q_ddl (queue-only)"
    target_device: "sdb"
    scheduler: "scx_io"
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - "loader_arb_"
      - "loader_q_"
      - "loader_minimal"
      root_cgroup:
        path: "/sys/fs/cgroup"
        controllers:
        - "io"
      root_policies:
      - name: "q_ddl_root"
        path: "/opt/io-ext/userspace/loader_q_ddl"
        scope: "root_policy"
        args:
        - "-c"
        - "{policy_cgroup_path}"
  arm_iox_arb_q:
    name: "rq1 dbbench iox arb_wdrr + q_fifo (ours_global)"
    target_device: "sdb"
    scheduler: "scx_io"
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - "loader_arb_"
      - "loader_q_"
      - "loader_minimal"
      root_cgroup:
        path: "/sys/fs/cgroup"
        controllers:
        - "io"
      arbiters:
      - name: "arb_wdrr"
        path: "/opt/io-ext/userspace/loader_arb_wdrr"
        scope: "arbiter"
      root_policies:
      - name: "q_fifo_root"
        path: "/opt/io-ext/userspace/loader_q_fifo"
        scope: "root_policy"
        args:
        - "-c"
        - "{policy_cgroup_path}"

tenant_groups:
  dbb_none:
    count: 1
    scene_id_template: "rq1_dbb_none_t{idx1}"
    template:
      base_scene: "scene/io_ext/dbbench.yml"
      parameters:
        <<: *common_dbbench
        scheduler: "none"
        io_ext: *native_none_io_ext
        <<: *common_phases
  dbb_io_cost:
    count: 1
    scene_id_template: "rq1_dbb_io_cost_t{idx1}"
    template:
      base_scene: "scene/io_ext/dbbench.yml"
      parameters:
        <<: *common_dbbench
        scheduler: "none"
        io_ext:
          <<: *native_none_io_ext
          root_cgroup:
            path: "/sys/fs/cgroup"
            controllers:
            - "io"
          cgroup:
            path: "/sys/fs/cgroup/rq1_dbb"
            controllers:
            - "io"
            io_cost:
              model: *io_cost_model
              qos: *io_cost_qos
        <<: *common_phases
  dbb_iox_q_ddl:
    count: 1
    scene_id_template: "rq1_dbb_iox_q_ddl_t{idx1}"
    template:
      base_scene: "scene/io_ext/dbbench.yml"
      parameters:
        <<: *common_dbbench
        scheduler: "scx_io"
        io_ext: *iox_scene_io_ext
        <<: *common_phases
  dbb_iox_arb_q:
    count: 1
    scene_id_template: "rq1_dbb_iox_arb_q_t{idx1}"
    template:
      base_scene: "scene/io_ext/dbbench.yml"
      parameters:
        <<: *common_dbbench
        scheduler: "scx_io"
        io_ext: *iox_scene_io_ext
        <<: *common_phases

test_sequences:
- sequence_id: "RQ1_DBB_NONE"
  name: "RQ1 db_bench rww cache=on, native none baseline"
  io_ext_policy: "arm_none"
  steps:
  - name: "dbbench rww none"
    tenant_groups: ["dbb_none"]
    monitoring_scenes: ["ib_system_metric"]
    monitoring_startup_time: 3
    duration: 900
- sequence_id: "RQ1_DBB_IO_COST"
  name: "RQ1 db_bench rww cache=on, root io.cost (sdb RECAL calibration)"
  io_ext_policy: "arm_io_cost"
  steps:
  - name: "dbbench rww io.cost"
    tenant_groups: ["dbb_io_cost"]
    monitoring_scenes: ["ib_system_metric"]
    monitoring_startup_time: 3
    duration: 900
- sequence_id: "RQ1_DBB_IOX_Q_DDL"
  name: "RQ1 db_bench rww cache=on, iox queue-only loader_q_ddl"
  io_ext_policy: "arm_iox_q_ddl"
  steps:
  - name: "dbbench rww iox q_ddl"
    tenant_groups: ["dbb_iox_q_ddl"]
    monitoring_scenes: ["ib_system_metric"]
    monitoring_startup_time: 3
    duration: 900
- sequence_id: "RQ1_DBB_IOX_ARB_Q"
  name: "RQ1 db_bench rww cache=on, iox arb_wdrr + q_fifo (ours_global; optional arm)"
  io_ext_policy: "arm_iox_arb_q"
  steps:
  - name: "dbbench rww iox arb_q"
    tenant_groups: ["dbb_iox_arb_q"]
    monitoring_scenes: ["ib_system_metric"]
    monitoring_startup_time: 3
    duration: 900
