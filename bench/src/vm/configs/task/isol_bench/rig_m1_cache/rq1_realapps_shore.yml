# rq1_realapps_shore: RQ1 real-app controller comparison on TailBench Shore
# QPS50 open loop (kvmhost /dev/sdb; runner formats+mounts /mnt/rq1_20261031
# per case).
#
# Arms: RQ1_SHORE_{NONE, IO_COST, IOX_Q_DDL, IOX_ARB_Q}. Shore is pure buffered
# I/O (no cache switch exists), i.e. the cache path is naturally on; A/B vs
# direct is meaningless and is deliberately absent (noted in
# m1_cache_ab.yml). The io.cost arm uses the shore scene's
# setup_iocost_at_root support (root model+qos, sdb RECAL calibration);
# iox profiles identical to the ycsb/dbbench rq1 files; IOX_ARB_Q is the
# optional ours_global arm (select/exclude via runner --only).
#
# Repeats are runner-controlled (--repeats N -> case <seq>_r<k>); >= 3 per arm.
#
# Result convention (results dir, separated from motivation_*):
#   results/rq1_realapps_shore/<RUN_ID>/
benchmark_name: "RQ1 real-app Shore QPS50: none / io.cost / iox_q_ddl / iox_arb_q"
description: >-
  Single-tenant Shore QPS50 open loop (~600s ROI) on freshly formatted /dev/sdb,
  one arm per sequence. Native none, root io.cost (sdb RECAL calibration), iox
  queue-only (loader_q_ddl), iox arbiter+queue (arb_wdrr + q_fifo). Shore is
  buffered by nature (cache path always on). Repeats via the campaign runner.
default_sequence: "RQ1_SHORE_NONE"
fail_fast_on_scene_error: true

_native_none_io_ext: &native_none_io_ext
  cleanup_stale_when_no_specs: true
  cleanup_bpffs_pins: true

_iox_scene_io_ext: &iox_scene_io_ext
  cleanup_stale: false
  cleanup_bpffs_pins: false
  loaders: []
  cgroup_policies: []

_io_cost_model: &io_cost_model
  ctrl: "user"
  model: "linear"
  rbps: 335544320
  rseqiops: 82000
  rrandiops: 82000
  wbps: 335544320
  wseqiops: 82000
  wrandiops: 82000
_io_cost_qos: &io_cost_qos
  enable: true
  ctrl: "user"
  rpct: 95.0
  rlat: 1000000
  wpct: 95.0
  wlat: 1000000
  min: 50.0
  max: 150.0

_common_tailbench: &common_tailbench
  home: "/tmp/m1_cache_20261031_bundle/tailbench/tailbench-v0.9"
  working_dir: "/tmp/m1_cache_20261031_bundle/tailbench/tailbench-v0.9/shore"
  bench_script: "/opt/ioext-bench/src/vm/assets/tailbench/shore/shore_bench.py"
  binary: "/tmp/m1_cache_20261031_bundle/tailbench/tailbench-v0.9/shore/shore-kits/shore_kits_integrated"
  run_build: false
  scratch_dir: "/mnt/rq1_20261031/shore_scratch"   # Shore diskrw traffic -> sdb
  require_latency: true
  latency_unit: "us"
  binary_latency_format: "triplet"
  p99_threshold_us: 50000
  slo_deadline_us: 50000

_shore_common_params: &shore_common_params
  target_device: "sdb"
  output_dir: "/tmp/rq1_20261031/scene/{group_id}"
  duration: 1000
  drop_caches_before_run: true   # cache=on attribution discipline (§0.2)
  tailbench:
    <<: *common_tailbench
    mode: "shore_integrated"
    # Data file lives on the guest root disk (outside the reformatted sdb).
    data_file: "/tmp/m1_cache_20261031_bundle/data/db-tpcc-1"
    env:
      TBENCH_CLIENT_THREADS: "2"
      TBENCH_QPS: "50"
      TBENCH_WARMUPREQS: "1000"
      TBENCH_MAXREQS: "30000"     # 30000/50 = 600s ROI
      TBENCH_MINSLEEPNS: "10000"

scenes:
  ib_system_metric:
    base_scene: "scene/system/system_metric.yml"
    parameters:
      collection_mode: "proc"
      sample_interval: 1.0
      max_samples: 3600
      require_samples: true
      disk_devices:
      - "sdb"
      output_dir: "/tmp/rq1_20261031/monitor/system_metric"

io_ext_policy_profiles:
  arm_none:
    name: "rq1 shore native none"
    target_device: "sdb"
    scheduler: "none"
    io_ext: *native_none_io_ext
  arm_io_cost:
    name: "rq1 shore io.cost root controller"
    target_device: "sdb"
    scheduler: "none"
    io_ext: *native_none_io_ext
  arm_iox_q_ddl:
    name: "rq1 shore iox q_ddl (queue-only)"
    target_device: "sdb"
    scheduler: "scx_io"
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - "loader_arb_"
      - "loader_q_"
      - "loader_minimal"
      root_cgroup:
        path: "/sys/fs/cgroup"
        controllers:
        - "io"
      root_policies:
      - name: "q_ddl_root"
        path: "/opt/io-ext/userspace/loader_q_ddl"
        scope: "root_policy"
        args:
        - "-c"
        - "{policy_cgroup_path}"
  arm_iox_arb_q:
    name: "rq1 shore iox arb_wdrr + q_fifo (ours_global)"
    target_device: "sdb"
    scheduler: "scx_io"
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - "loader_arb_"
      - "loader_q_"
      - "loader_minimal"
      root_cgroup:
        path: "/sys/fs/cgroup"
        controllers:
        - "io"
      arbiters:
      - name: "arb_wdrr"
        path: "/opt/io-ext/userspace/loader_arb_wdrr"
        scope: "arbiter"
      root_policies:
      - name: "q_fifo_root"
        path: "/opt/io-ext/userspace/loader_q_fifo"
        scope: "root_policy"
        args:
        - "-c"
        - "{policy_cgroup_path}"

tenant_groups:
  shore_none:
    count: 1
    scene_id_template: "rq1_shore_none_t{idx1}"
    template:
      base_scene: "scene/io_ext/tailbench_shore.yml"
      parameters:
        <<: *shore_common_params
        scheduler: "none"
        io_ext: *native_none_io_ext
  shore_io_cost:
    count: 1
    scene_id_template: "rq1_shore_io_cost_t{idx1}"
    template:
      base_scene: "scene/io_ext/tailbench_shore.yml"
      parameters:
        <<: *shore_common_params
        scheduler: "none"
        io_ext:
          <<: *native_none_io_ext
          root_cgroup:
            path: "/sys/fs/cgroup"
            controllers:
            - "io"
          cgroup:
            path: "/sys/fs/cgroup/rq1_shore"
            controllers:
            - "io"
            io_cost:
              model: *io_cost_model
              qos: *io_cost_qos
  shore_iox_q_ddl:
    count: 1
    scene_id_template: "rq1_shore_iox_q_ddl_t{idx1}"
    template:
      base_scene: "scene/io_ext/tailbench_shore.yml"
      parameters:
        <<: *shore_common_params
        scheduler: "scx_io"
        io_ext: *iox_scene_io_ext
  shore_iox_arb_q:
    count: 1
    scene_id_template: "rq1_shore_iox_arb_q_t{idx1}"
    template:
      base_scene: "scene/io_ext/tailbench_shore.yml"
      parameters:
        <<: *shore_common_params
        scheduler: "scx_io"
        io_ext: *iox_scene_io_ext

test_sequences:
- sequence_id: "RQ1_SHORE_NONE"
  name: "RQ1 Shore QPS50, native none baseline"
  io_ext_policy: "arm_none"
  steps:
  - name: "shore none"
    tenant_groups: ["shore_none"]
    monitoring_scenes: ["ib_system_metric"]
    monitoring_startup_time: 3
    duration: 1000
- sequence_id: "RQ1_SHORE_IO_COST"
  name: "RQ1 Shore QPS50, root io.cost (sdb RECAL calibration)"
  io_ext_policy: "arm_io_cost"
  steps:
  - name: "shore io.cost"
    tenant_groups: ["shore_io_cost"]
    monitoring_scenes: ["ib_system_metric"]
    monitoring_startup_time: 3
    duration: 1000
- sequence_id: "RQ1_SHORE_IOX_Q_DDL"
  name: "RQ1 Shore QPS50, iox queue-only loader_q_ddl"
  io_ext_policy: "arm_iox_q_ddl"
  steps:
  - name: "shore iox q_ddl"
    tenant_groups: ["shore_iox_q_ddl"]
    monitoring_scenes: ["ib_system_metric"]
    monitoring_startup_time: 3
    duration: 1000
- sequence_id: "RQ1_SHORE_IOX_ARB_Q"
  name: "RQ1 Shore QPS50, iox arb_wdrr + q_fifo (ours_global; optional arm)"
  io_ext_policy: "arm_iox_arb_q"
  steps:
  - name: "shore iox arb_q"
    tenant_groups: ["shore_iox_arb_q"]
    monitoring_scenes: ["ib_system_metric"]
    monitoring_startup_time: 3
    duration: 1000
