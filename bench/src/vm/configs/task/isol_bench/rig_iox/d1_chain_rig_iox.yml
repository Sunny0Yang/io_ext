benchmark_name: isol_bench rig D1-Q1 iox cgroup chain topology (kvmhost/sdb)
description: "Rig D1-Q1 iox T1: LC 4K randread QD=1 io_uring, policy at v2 root, chain depth D x 4 x 2 policies + q_none controls + leafpol16, n=32 (design \xA74)."
scenes:
  ib_system_metric:
    base_scene: scene/system/system_metric.yml
    parameters:
      collection_mode: proc
      sample_interval: 1.0
      max_samples: 120
      require_samples: true
      disk_devices:
      - sdb
      output_dir: ./test_results/isol_bench/rig_iox/d1c/system_metric
  ib_block_io_latency_cost:
    base_scene: scene/block_bpf/block_io_latency_cost.yml
    parameters:
      output_dir: ./test_results/isol_bench/rig_iox/d1c/block_io_latency_cost
      output_file: ./test_results/isol_bench/rig_iox/d1c/block_io_latency_cost/block_io_latency_cost.bpftrace.log
      summary_file: ./test_results/isol_bench/rig_iox/d1c/block_io_latency_cost/block_io_latency_cost_summary.json
      require_events: false
      privilege:
        method: sudo_nopasswd
  ib_scx_io_bypass_fallback:
    base_scene: scene/block_bpf/scx_io_bypass_fallback.yml
    parameters:
      require_events: false
      output_dir: ./test_results/isol_bench/rig_iox/d1c/scx_io_bypass_fallback
io_ext_policy_profiles:
  iox_q_fifo_chain2:
    name: rig iox q_fifo_chain2
    target_device: sdb
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns: &id001
      - loader_arb_
      - loader_q_
      - loader_minimal
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      root_policies:
      - name: q_fifo_chain2_root
        path: /opt/io-ext/userspace/loader_q_fifo
        scope: root_policy
        args:
        - -c
        - '{policy_cgroup_path}'
  iox_q_fifo_chain4:
