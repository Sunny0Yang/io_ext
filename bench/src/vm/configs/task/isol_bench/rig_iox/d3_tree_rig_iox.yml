test_sequences:
- sequence_id: D3LC_rread_4k_iox_arb_wdrr_treedeleg_hetero
  name: D3 LC rread_4k iox arb_wdrr treedeleg hetero
  io_ext_policy: iox_arb_wdrr_treedeleg_hetero
  workload: rread_4k
  steps:
  - name: 1 LC + 4 BE hetero arb_wdrr treedeleg
    tenant_groups:
    - d3t_lc_treedeleg
    - d3t_be_treedeleg
    monitoring_scenes:
    - ib_system_metric
    - ib_block_io_latency_cost
    - ib_scx_io_bypass_fallback
    monitoring_startup_time: 3
    duration: 120
- sequence_id: D3LC_rread_4k_iox_arb_wdrr_treedeleg_w400_hetero
  name: D3 LC rread_4k iox arb_wdrr treedeleg_w400 hetero
  io_ext_policy: iox_arb_wdrr_treedeleg_w400_hetero
