benchmark_name: isol_bench rig D2 iox fairness (kvmhost/sdb)
description: 'Rig D2 iox: saturated weighted cg=8, 8 policies.'
scenes:
  ib_system_metric:
    base_scene: scene/system/system_metric.yml
    parameters:
      collection_mode: proc
      sample_interval: 1.0
      max_samples: 120
      require_samples: true
      disk_devices:
      - sdb
      output_dir: ./test_results/isol_bench/rig_iox/d2/system_metric
  ib_block_io_latency_cost:
    base_scene: scene/block_bpf/block_io_latency_cost.yml
    parameters:
      output_dir: ./test_results/isol_bench/rig_iox/d2/block_io_latency_cost
      output_file: ./test_results/isol_bench/rig_iox/d2/block_io_latency_cost/block_io_latency_cost.bpftrace.log
      summary_file: ./test_results/isol_bench/rig_iox/d2/block_io_latency_cost/block_io_latency_cost_summary.json
      require_events: false
      privilege:
        method: sudo_nopasswd
  ib_scx_io_bypass_fallback:
    base_scene: scene/block_bpf/scx_io_bypass_fallback.yml
    parameters:
      require_events: false
      output_dir: ./test_results/isol_bench/rig_iox/d2/scx_io_bypass_fallback
io_ext_policy_profiles:
  iox_q_fifo:
    name: rig iox q_fifo
    target_device: sdb
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns: &id001
      - loader_arb_
      - loader_q_
      - loader_minimal
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      root_policies:
      - name: q_fifo_root
        path: /opt/io-ext/userspace/loader_q_fifo
        scope: root_policy
        args:
        - -c
        - '{policy_cgroup_path}'
  iox_q_wedf:
    name: rig iox q_wedf per-cgroup
    target_device: sdb
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns: *id001
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
    cgroup_policies_from_groups:
    - tenant_group: d2_tenants
      name_template: q_wedf_{tenant_id}
      path: /opt/io-ext/userspace/loader_q_wedf
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
  iox_arb_wdrr:
    name: rig iox arb_wdrr + fifo per-cgroup
    target_device: sdb
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns: *id001
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      arbiters:
      - name: arb_wdrr
        path: /opt/io-ext/userspace/loader_arb_wdrr
        scope: arbiter
    cgroup_policies_from_groups:
    - tenant_group: d2_w1
      name_template: q_fifo_w1
      path: /opt/io-ext/userspace/loader_q_fifo
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - -W
      - '100'
    - tenant_group: d2_w2
