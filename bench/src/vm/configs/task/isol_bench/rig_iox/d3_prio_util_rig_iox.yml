benchmark_name: isol_bench rig D3 iox priority (kvmhost/sdb)
description: 'Rig D3 iox: 1 LC + 4 BE, 16 sequences.'
scenes:
  ib_system_metric:
    base_scene: scene/system/system_metric.yml
    parameters:
      collection_mode: proc
      sample_interval: 1.0
      max_samples: 120
      require_samples: true
      disk_devices:
      - sdb
      output_dir: ./test_results/isol_bench/rig_iox/d3/system_metric
  ib_block_io_latency_cost:
    base_scene: scene/block_bpf/block_io_latency_cost.yml
    parameters:
      output_dir: ./test_results/isol_bench/rig_iox/d3/block_io_latency_cost
      output_file: ./test_results/isol_bench/rig_iox/d3/block_io_latency_cost/block_io_latency_cost.bpftrace.log
      summary_file: ./test_results/isol_bench/rig_iox/d3/block_io_latency_cost/block_io_latency_cost_summary.json
      require_events: false
      privilege:
        method: sudo_nopasswd
  ib_scx_io_bypass_fallback:
    base_scene: scene/block_bpf/scx_io_bypass_fallback.yml
    parameters:
      require_events: false
      output_dir: ./test_results/isol_bench/rig_iox/d3/scx_io_bypass_fallback
io_ext_policy_profiles:
  iox_q_sp_edf:
    name: rig iox q_sp_edf
    target_device: sdb
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns: &id001
      - loader_arb_
      - loader_q_
      - loader_minimal
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      root_policies:
      - name: q_sp_edf_root
        path: /opt/io-ext/userspace/loader_q_sp_edf
        scope: root_policy
        args:
        - -c
        - '{policy_cgroup_path}'
