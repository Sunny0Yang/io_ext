      - name: q_wedf_g1
        path: /opt/io-ext/userspace/loader_q_wedf
        scope: cgroup_policy
        args:
        - -c
        - /sys/fs/cgroup/ib_rig_d2t_q_wedf_treesub/g1
        policy_cgroup_path: /sys/fs/cgroup/ib_rig_d2t_q_wedf_treesub/g1
      - name: q_wedf_g2
