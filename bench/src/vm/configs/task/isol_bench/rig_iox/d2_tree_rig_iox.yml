benchmark_name: isol_bench rig D2 iox cgroup tree topology (kvmhost/sdb)
description: "Rig D2 iox T2: saturated weighted cg=8 under g1/g2 subtrees, arb_wdrr + q_wedf + q_fifo flavors x {treeleaf,treesub} policy mounts (design \xA75; q_wedf/q_fifo are default-weight B-family\
  \ controls, ruler-exempt)."
scenes:
  ib_system_metric:
    base_scene: scene/system/system_metric.yml
    parameters:
      collection_mode: proc
      sample_interval: 1.0
      max_samples: 120
      require_samples: true
      disk_devices:
      - sdb
      output_dir: ./test_results/isol_bench/rig_iox/d2t/system_metric
  ib_block_io_latency_cost:
    base_scene: scene/block_bpf/block_io_latency_cost.yml
    parameters:
      output_dir: ./test_results/isol_bench/rig_iox/d2t/block_io_latency_cost
      output_file: ./test_results/isol_bench/rig_iox/d2t/block_io_latency_cost/block_io_latency_cost.bpftrace.log
      summary_file: ./test_results/isol_bench/rig_iox/d2t/block_io_latency_cost/block_io_latency_cost_summary.json
      require_events: false
      privilege:
        method: sudo_nopasswd
  ib_scx_io_bypass_fallback:
    base_scene: scene/block_bpf/scx_io_bypass_fallback.yml
    parameters:
      require_events: false
      output_dir: ./test_results/isol_bench/rig_iox/d2t/scx_io_bypass_fallback
io_ext_policy_profiles:
  iox_arb_wdrr_treeleaf:
    name: rig iox arb_wdrr + fifo per-leaf treeleaf
    target_device: sdb
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns: &id001
      - loader_arb_
      - loader_q_
      - loader_minimal
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      arbiters:
      - name: arb_wdrr
        path: /opt/io-ext/userspace/loader_arb_wdrr
        scope: arbiter
    cgroup_policies_from_groups:
    - tenant_group: d2t_w1_treeleaf
      name_template: q_fifo_w1
      path: /opt/io-ext/userspace/loader_q_fifo
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - -W
      - '100'
    - tenant_group: d2t_w2_treeleaf
      name_template: q_fifo_w2
      path: /opt/io-ext/userspace/loader_q_fifo
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - -W
      - '200'
    - tenant_group: d2t_w3_treeleaf
      name_template: q_fifo_w3
      path: /opt/io-ext/userspace/loader_q_fifo
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - -W
      - '300'
    - tenant_group: d2t_w4_treeleaf
      name_template: q_fifo_w4
      path: /opt/io-ext/userspace/loader_q_fifo
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - -W
      - '400'
    - tenant_group: d2t_w5_treeleaf
      name_template: q_fifo_w5
      path: /opt/io-ext/userspace/loader_q_fifo
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - -W
      - '500'
    - tenant_group: d2t_w6_treeleaf
      name_template: q_fifo_w6
      path: /opt/io-ext/userspace/loader_q_fifo
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - -W
      - '600'
    - tenant_group: d2t_w7_treeleaf
      name_template: q_fifo_w7
      path: /opt/io-ext/userspace/loader_q_fifo
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - -W
      - '700'
    - tenant_group: d2t_w8_treeleaf
      name_template: q_fifo_w8
      path: /opt/io-ext/userspace/loader_q_fifo
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - -W
      - '800'
  iox_arb_wdrr_treesub:
    name: rig iox arb_wdrr + fifo per-subtree treesub
    target_device: sdb
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns: *id001
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      arbiters:
      - name: arb_wdrr
        path: /opt/io-ext/userspace/loader_arb_wdrr
        scope: arbiter
      cgroup_policies:
      - name: q_fifo_g1
        path: /opt/io-ext/userspace/loader_q_fifo
        scope: cgroup_policy
        args:
        - -c
        - /sys/fs/cgroup/ib_rig_d2t_arb_wdrr_treesub/g1
        - -W
        - '1000'
        policy_cgroup_path: /sys/fs/cgroup/ib_rig_d2t_arb_wdrr_treesub/g1
      - name: q_fifo_g2
        path: /opt/io-ext/userspace/loader_q_fifo
        scope: cgroup_policy
        args:
        - -c
        - /sys/fs/cgroup/ib_rig_d2t_arb_wdrr_treesub/g2
        - -W
        - '2600'
        policy_cgroup_path: /sys/fs/cgroup/ib_rig_d2t_arb_wdrr_treesub/g2
  iox_q_wedf_treeleaf:
    name: rig iox q_wedf per-leaf treeleaf
    target_device: sdb
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns: *id001
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
    cgroup_policies_from_groups:
    - tenant_group: d2t_tenants_q_wedf_treeleaf
      name_template: q_wedf_{tenant_id}
      path: /opt/io-ext/userspace/loader_q_wedf
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
  iox_q_wedf_treesub:
    name: rig iox q_wedf per-subtree treesub
    target_device: sdb
    scheduler: scx_io
    io_ext:
