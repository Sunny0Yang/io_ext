# rig_m1: M1 solo load-pattern diversity profile (P0-2 / prompt B, vng local)
#
# Design discipline (solo run, mirrors rig_ycsb/rig_dbbench/rig_tailbench global
# loads; per docs/plans/paper_motivation_design.md §3.4 six axes):
#   - single GLOBAL workload per sequence (one tenant, accounting-only cgroup)
#   - scheduler pinned to `none`, ZERO cgroup io.* values written, no loader,
#     no arbiter — characterize load NATURE, not scheduler effects
#     (gpu_ext Figure 2 discipline)
#   - monitoring: ib_system_metric (1 Hz authoritative /proc/diskstats
#     ios_in_progress = concurrency axis) + m1_pattern_sampler (per-request
#     thinned dump + exact in-kernel aggregates; supersedes
#     ib_block_io_latency_cost for this task to avoid double-attaching
#     per-event BPF probes and stack sampling perturbation)
#
# Sequences (execution order = solo collection order):
#   M1_FIO_smoke    sampler validation task (QD256 = highest loss-risk rate)
#   M1_YCSB_a / _c  workloada / workloadc, 16 threads, maxexecutiontime 600
#   M1_DBB_chain    db_bench phase chain (fillrandom->compact->settle->
#                   readrandom->settle->readwhilewriting->settle->
#                   readrandomwriterandom; measured phases 150s each)
#   M1_SHORE_qps50  TailBench/Shore integrated, open loop QPS=50,
#                   WARMUP 1000 + MAXREQS 30000 -> ~600s ROI window
#   M1_F1..M1_F6    fio pattern family (controlled complement; 180s + ramp
#                   20s each; F6 = burst timeline 60s idle + 10s LC QD1 +
#                   80s BE QD256, D4 job shapes, no fio ramp_time — the idle
#                   lead-in plays that role)
#
# MLPerf topo: CUT this night (kvmhost sdb occupied by task C) — RUN_LOG.
benchmark_name: "rig_m1 M1 solo load-pattern diversity profile (vng local)"
description: >-
  Solo single-tenant load-pattern profile for M1 (P0-2): native-none arms
  only, zero io.* controller writes, per-request bpftrace sampling
  (m1_pattern_sampler) + 1 Hz system metrics on the 10G vng nvme test disk.
  Real workloads: YCSB/RocksDB workloada + workloadc (600s run phase),
  db_bench phase chain (150s phases), Shore QPS50 open loop (~600s ROI).
  Controlled complement: fio F1-F6 pattern family.
default_sequence: "M1_FIO_smoke"
fail_fast_on_scene_error: true

_native_scene_io_ext: &native_scene_io_ext
  cleanup_stale_when_no_specs: true
  cleanup_bpffs_pins: true

_fio_solo_io_ext: &fio_solo_io_ext
  cleanup_stale_when_no_specs: true
  cleanup_bpffs_pins: true
  # NO cgroup at all for fio solo runs: fio runs in the root cgroup, zero
  # io.* values written anywhere (axis-7 metadata: direct=1 raw device).

_common_fio: &common_fio
  target_device: "nvme0n1"
  file_name: "/dev/nvme0n1"
  scheduler: "none"
  scheduler_tunables: {}
  output_dir: "./test_results/isol_bench/rig_m1/{group_id}"
  drop_caches_before_run: false
  cooldown_sec: 1

_common_ycsb: &common_ycsb
  target_device: "nvme0n1"
  output_dir: "./test_results/isol_bench/rig_m1/{group_id}"
  duration: 1100
  drop_caches_before_run: false
  database:
    db_type: "rocksdb"
    data_dir: "/tmp/nvme_data/{group_id}_tenant_{idx1}"
    ycsb_dir: "src/vm/assets/ycsb/ycsb_runtime"
    use_direct_io: true
    write_buffer_size: 67108864
    storage_backend: "kernel_block"
  system:
    mem_limit_mb: 0
    auto_format_disk: true
    format_device: true
    mount_options: "noatime,nodiratime"
    cgroup_path: "/sys/fs/cgroup/m1_ycsb"   # accounting only; no io.* values

_common_dbbench: &common_dbbench
  target_device: "nvme0n1"
  output_dir: "./test_results/isol_bench/rig_m1/{group_id}"
  duration: 1500
  drop_caches_before_run: false
  dbbench:
    dbbench_bin: "/home/anon/rocksdb/db_bench"
    rocksdb_home: "/home/anon/rocksdb"
    db_path: "/tmp/nvme_data/{group_id}_db"
    use_direct_io: true
    common_args:
      num: 1000000
      value_size: 1024
      key_size: 16
      compression_type: "none"
      bloom_bits: 10
      cache_size: 0
      write_buffer_size: 67108864
  system:
    auto_format_disk: true
    format_device: true
    mount_options: "noatime,nodiratime"
    cgroup_path: "/sys/fs/cgroup/m1_dbb"    # accounting only; no io.* values

_common_phases: &common_phases
  phases:
  - name: "fillrandom"
    benchmark: "fillrandom"
  - name: "compact"
    benchmark: "compact"
  - name: "settle1"
    benchmark: "sleep"
    settle_sec: 75
  - name: "readrandom"
    benchmark: "readrandom"
    duration: 150
    args:
      threads: 4
  - name: "settle2"
    benchmark: "sleep"
    settle_sec: 30
  - name: "readwhilewriting"
    benchmark: "readwhilewriting"
    duration: 150
    args:
      threads: 4
      writes: 3000000
  - name: "settle3"
    benchmark: "sleep"
    settle_sec: 75
  - name: "readrandomwriterandom"
    benchmark: "readrandomwriterandom"
    duration: 150
    args:
      threads: 8
      readwritepercent: 90

_common_tailbench: &common_tailbench
  home: "/home/anon/tailbench/tailbench-v0.9"
  working_dir: "/home/anon/tailbench/tailbench-v0.9/shore"
  bench_script: "/opt/ioext/src/vm/assets/tailbench/shore/shore_bench.py"
  binary: "/home/anon/tailbench/tailbench-v0.9/shore/shore-kits/shore_kits_integrated"
  run_build: false
  scratch_dir: "/tmp/nvme_data/shore_scratch"
  require_latency: true
  latency_unit: "us"
  binary_latency_format: "triplet"
  p99_threshold_us: 50000
  slo_deadline_us: 50000

scenes:
  ib_system_metric:
    base_scene: "scene/system/system_metric.yml"
    parameters:
      collection_mode: "proc"
      sample_interval: 1.0
      max_samples: 3600
      require_samples: true
      disk_devices:
      - nvme0n1
      output_dir: "./test_results/isol_bench/rig_m1/system_metric"
  m1_pattern_sampler:
    base_scene: "scene/block_bpf/m1_pattern_sampler.yml"
    parameters:
      output_dir: "./test_results/isol_bench/rig_m1/m1_pattern_sampler"
      output_file: "./test_results/isol_bench/rig_m1/m1_pattern_sampler/m1_pattern_sampler.bpftrace.log"
      summary_file: "./test_results/isol_bench/rig_m1/m1_pattern_sampler/m1_pattern_sampler_summary.json"
      require_events: false
      privilege:
        method: "sudo_nopasswd"
        askpass_script: ""

io_ext_policy_profiles:
  arm_m1_none:
    name: "rig m1 native none (solo)"
    target_device: "nvme0n1"
    scheduler: "none"
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true

tenant_groups:
  # ---------- fio smoke: sampler validation at the highest-rate shape ----------
  m1_fio_smoke:
    count: 1
    scene_id_template: "m1_fio_smoke_t{idx1}"
    template:
      base_scene: "scene/io_ext/fio.yml"
      parameters:
        <<: *common_fio
        io_ext: *fio_solo_io_ext
        duration: 120
        job_name: "m1_fio_smoke"
        fio_global:
          ioengine: "libaio"
          direct: 1
          bs: "4k"
          rw: "randread"
          iodepth: 256
          numjobs: 1
          runtime_sec: 20
          time_based: true
          group_reporting: true
  # ---------- real workload 1/2: YCSB-RocksDB workloada / workloadc ----------
  m1_ycsb_a:
    count: 1
    scene_id_template: "m1_ycsb_a_t{idx1}"
    template:
      base_scene: "scene/io_ext/ycsb_rocksdb.yml"
      parameters:
        <<: *common_ycsb
        scheduler: "none"
        io_ext: *native_scene_io_ext
        ycsb_workload:
          recordcount: 400000
          operationcount: 10000000
          threads: 16
          jvm_args: "-Xms2048m -Xmx2048m"
          workload_type: "a"
          properties:
            fieldcount: 10
            fieldlength: 1024
            maxexecutiontime: 600
  m1_ycsb_c:
    count: 1
    scene_id_template: "m1_ycsb_c_t{idx1}"
    template:
      base_scene: "scene/io_ext/ycsb_rocksdb.yml"
      parameters:
        <<: *common_ycsb
        scheduler: "none"
        io_ext: *native_scene_io_ext
        ycsb_workload:
          recordcount: 400000
          operationcount: 10000000
          threads: 16
          jvm_args: "-Xms2048m -Xmx2048m"
          workload_type: "c"
          properties:
            fieldcount: 10
            fieldlength: 1024
            maxexecutiontime: 600
  # ---------- real workload 3: db_bench phase chain ----------
  m1_dbb_chain:
    count: 1
    scene_id_template: "m1_dbb_chain_t{idx1}"
    template:
      base_scene: "scene/io_ext/dbbench.yml"
      parameters:
        <<: *common_dbbench
        scheduler: "none"
        io_ext: *native_scene_io_ext
        <<: *common_phases
  # ---------- real workload 4: Shore QPS50 open loop ----------
  m1_shore_qps50:
    count: 1
    scene_id_template: "m1_shore_qps50_t{idx1}"
    template:
      base_scene: "scene/io_ext/tailbench_shore.yml"
      parameters:
        target_device: "nvme0n1"
        output_dir: "./test_results/isol_bench/rig_m1/{group_id}"
        duration: 900
        scheduler: "none"
        io_ext:
          cleanup_stale_when_no_specs: true
          cleanup_bpffs_pins: true
          cgroup:
            path: "/sys/fs/cgroup/m1_shore"   # accounting only; no io.* values
            controllers:
            - "io"
        tailbench:
          <<: *common_tailbench
          mode: "shore_integrated"
          data_file: "/tmp/nvme_data/db-tpcc-1"
          env:
            TBENCH_CLIENT_THREADS: "2"
            TBENCH_QPS: "50"
            TBENCH_WARMUPREQS: "1000"
            TBENCH_MAXREQS: "30000"     # 30000/50 = 600s ROI (prompt B spec)
            TBENCH_MINSLEEPNS: "10000"
  # ---------- fio family F1: randread 4K QD1 ----------
  m1_f1:
    count: 1
    scene_id_template: "m1_f1_t{idx1}"
    template:
      base_scene: "scene/io_ext/fio.yml"
      parameters:
        <<: *common_fio
        io_ext: *fio_solo_io_ext
        duration: 240
        job_name: "m1_f1_randread_qd1"
        fio_global:
          ioengine: "libaio"
          direct: 1
          bs: "4k"
          rw: "randread"
          iodepth: 1
          numjobs: 1
          runtime_sec: 180
          time_based: true
          group_reporting: true
          ramp_time: 20
  # ---------- F2: randread 4K QD256 ----------
  m1_f2:
    count: 1
    scene_id_template: "m1_f2_t{idx1}"
    template:
      base_scene: "scene/io_ext/fio.yml"
      parameters:
        <<: *common_fio
        io_ext: *fio_solo_io_ext
        duration: 240
        job_name: "m1_f2_randread_qd256"
        fio_global:
          ioengine: "libaio"
          direct: 1
          bs: "4k"
          rw: "randread"
          iodepth: 256
          numjobs: 1
          runtime_sec: 180
          time_based: true
          group_reporting: true
          ramp_time: 20
  # ---------- F3: seqread 128K QD32 ----------
  m1_f3:
    count: 1
    scene_id_template: "m1_f3_t{idx1}"
    template:
      base_scene: "scene/io_ext/fio.yml"
      parameters:
        <<: *common_fio
        io_ext: *fio_solo_io_ext
        duration: 240
        job_name: "m1_f3_seqread_128k_qd32"
        fio_global:
          ioengine: "libaio"
          direct: 1
          bs: "128k"
          rw: "read"
          iodepth: 32
          numjobs: 1
          runtime_sec: 180
          time_based: true
          group_reporting: true
          ramp_time: 20
  # ---------- F4: randwrite 4K QD256 ----------
  m1_f4:
    count: 1
    scene_id_template: "m1_f4_t{idx1}"
    template:
      base_scene: "scene/io_ext/fio.yml"
      parameters:
        <<: *common_fio
        io_ext: *fio_solo_io_ext
        duration: 240
        job_name: "m1_f4_randwrite_qd256"
        fio_global:
          ioengine: "libaio"
          direct: 1
          bs: "4k"
          rw: "randwrite"
          iodepth: 256
          numjobs: 1
          runtime_sec: 180
          time_based: true
          group_reporting: true
          ramp_time: 20
  # ---------- F5: randrw 70/30 QD64 ----------
  m1_f5:
    count: 1
    scene_id_template: "m1_f5_t{idx1}"
    template:
      base_scene: "scene/io_ext/fio.yml"
      parameters:
        <<: *common_fio
        io_ext: *fio_solo_io_ext
        duration: 240
        job_name: "m1_f5_randrw_7030_qd64"
        fio_global:
          ioengine: "libaio"
          direct: 1
          bs: "4k"
          rw: "randrw"
          rwmixread: 70
          iodepth: 64
          numjobs: 1
          runtime_sec: 180
          time_based: true
          group_reporting: true
          ramp_time: 20
  # ---------- F6: burst shape (D4 job shapes, serial D4-like timeline) ----------
  # 60s idle -> 10s LC 4K randread QD1 -> 80s BE 4K randread QD256; wall 150s.
  # No fio ramp_time: the 60s idle lead-in absorbs job startup.
  m1_f6:
    count: 1
    scene_id_template: "m1_f6_t{idx1}"
    template:
      base_scene: "scene/io_ext/fio.yml"
      parameters:
        <<: *common_fio
        io_ext: *fio_solo_io_ext
        duration: 200
        job_name: "m1_f6_burst_d4shape"
        fio_global:
          ioengine: "libaio"
          direct: 1
          bs: "4k"
          time_based: true
          group_reporting: true
          runtime_sec: 180
        fio_jobs:
        - name: "lc_burst"
          rw: "randread"
          iodepth: 1
          numjobs: 1
          runtime: 10
          startdelay: 60
        - name: "be_deep"
          rw: "randread"
          iodepth: 256
          numjobs: 1
          runtime: 80
          startdelay: 70

test_sequences:
- sequence_id: "M1_FIO_smoke"
  name: "sampler validation: fio randread QD256 20s (native none, solo)"
  io_ext_policy: "arm_m1_none"
  steps:
  - name: "fio smoke randread qd256 20s"
    tenant_groups:
    - "m1_fio_smoke"
    monitoring_scenes:
    - "ib_system_metric"
    - "m1_pattern_sampler"
    monitoring_startup_time: 3
    duration: 120
- sequence_id: "M1_YCSB_a"
  name: "solo YCSB workloada (16 threads, 600s run phase, none)"
  io_ext_policy: "arm_m1_none"
  steps:
  - name: "ycsb workloada solo none"
    tenant_groups:
    - "m1_ycsb_a"
    monitoring_scenes:
    - "ib_system_metric"
    - "m1_pattern_sampler"
    monitoring_startup_time: 3
    duration: 1100
- sequence_id: "M1_YCSB_c"
  name: "solo YCSB workloadc (16 threads, 600s run phase, none)"
  io_ext_policy: "arm_m1_none"
  steps:
  - name: "ycsb workloadc solo none"
    tenant_groups:
    - "m1_ycsb_c"
    monitoring_scenes:
    - "ib_system_metric"
    - "m1_pattern_sampler"
    monitoring_startup_time: 3
    duration: 1100
- sequence_id: "M1_DBB_chain"
  name: "solo db_bench phase chain (none, measured phases 150s)"
  io_ext_policy: "arm_m1_none"
  steps:
  - name: "dbbench chain solo none"
    tenant_groups:
    - "m1_dbb_chain"
    monitoring_scenes:
    - "ib_system_metric"
    - "m1_pattern_sampler"
    monitoring_startup_time: 3
    duration: 1500
- sequence_id: "M1_SHORE_qps50"
  name: "solo Shore QPS50 open loop (~600s ROI, none)"
  io_ext_policy: "arm_m1_none"
  steps:
  - name: "shore qps50 solo none"
    tenant_groups:
    - "m1_shore_qps50"
    monitoring_scenes:
    - "ib_system_metric"
    - "m1_pattern_sampler"
    monitoring_startup_time: 3
    duration: 1000
- sequence_id: "M1_F1"
  name: "solo fio F1 randread 4K QD1 (180s + ramp 20s, none)"
  io_ext_policy: "arm_m1_none"
  steps:
  - name: "fio f1 randread qd1"
    tenant_groups:
    - "m1_f1"
    monitoring_scenes:
    - "ib_system_metric"
    - "m1_pattern_sampler"
    monitoring_startup_time: 3
    duration: 300
- sequence_id: "M1_F2"
  name: "solo fio F2 randread 4K QD256 (180s + ramp 20s, none)"
  io_ext_policy: "arm_m1_none"
  steps:
  - name: "fio f2 randread qd256"
    tenant_groups:
    - "m1_f2"
    monitoring_scenes:
    - "ib_system_metric"
    - "m1_pattern_sampler"
    monitoring_startup_time: 3
    duration: 300
- sequence_id: "M1_F3"
  name: "solo fio F3 seqread 128K QD32 (180s + ramp 20s, none)"
  io_ext_policy: "arm_m1_none"
  steps:
  - name: "fio f3 seqread 128k qd32"
    tenant_groups:
    - "m1_f3"
    monitoring_scenes:
    - "ib_system_metric"
    - "m1_pattern_sampler"
    monitoring_startup_time: 3
    duration: 300
- sequence_id: "M1_F4"
  name: "solo fio F4 randwrite 4K QD256 (180s + ramp 20s, none)"
  io_ext_policy: "arm_m1_none"
  steps:
  - name: "fio f4 randwrite qd256"
    tenant_groups:
    - "m1_f4"
    monitoring_scenes:
    - "ib_system_metric"
    - "m1_pattern_sampler"
    monitoring_startup_time: 3
    duration: 300
- sequence_id: "M1_F5"
  name: "solo fio F5 randrw 70/30 QD64 (180s + ramp 20s, none)"
  io_ext_policy: "arm_m1_none"
  steps:
  - name: "fio f5 randrw 70/30 qd64"
    tenant_groups:
    - "m1_f5"
    monitoring_scenes:
    - "ib_system_metric"
    - "m1_pattern_sampler"
    monitoring_startup_time: 3
    duration: 300
- sequence_id: "M1_F6"
  name: "solo fio F6 burst: 60s idle + 10s LC QD1 + 80s BE QD256 (D4 shapes, none)"
  io_ext_policy: "arm_m1_none"
  steps:
  - name: "fio f6 burst d4 shape"
    tenant_groups:
    - "m1_f6"
    monitoring_scenes:
    - "ib_system_metric"
    - "m1_pattern_sampler"
    monitoring_startup_time: 3
    duration: 300