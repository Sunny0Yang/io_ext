benchmark_name: isol_bench D3 priority vs utilization — LC (paper reproduction)
description: 'D3-LC: 1 LC (libaio 4k randread QD=1) + 4 BE (libaio 4k randread QD=256), Pareto sweep per knob with the rig
  point as grid vertex; 9 native knobs + 14 iox sequences. Batch-foreground variant removed 2026-10-21.'
scenes:
  ib_system_metric:
    base_scene: scene/system/system_metric.yml
    parameters:
      collection_mode: proc
      sample_interval: 1.0
      max_samples: 120
      require_samples: true
      disk_devices:
      - nvme0n1
      output_dir: ./test_results/isol_bench/paper/d3_lc/system_metric
  ib_block_io_latency_cost:
    base_scene: scene/block_bpf/block_io_latency_cost.yml
    parameters:
      output_dir: ./test_results/isol_bench/paper/d3_lc/block_io_latency_cost
      output_file: ./test_results/isol_bench/paper/d3_lc/block_io_latency_cost/block_io_latency_cost.bpftrace.log
      summary_file: ./test_results/isol_bench/paper/d3_lc/block_io_latency_cost/block_io_latency_cost_summary.json
      require_events: false
      privilege:
        method: sudo_nopasswd
  ib_scx_io_bypass_fallback:
    base_scene: scene/block_bpf/scx_io_bypass_fallback.yml
    parameters:
      require_events: false
      output_dir: ./test_results/isol_bench/paper/d3_lc/scx_io_bypass_fallback
  ib_perf_stat:
    base_scene: scene/system/perf_stat.yml
    parameters:
      cpu_list: '2'
      sample_interval_ms: 1000
      require_available: false
      output_dir: ./test_results/isol_bench/paper/d3_lc/perf_stat
