#   RECAL(CPUBIND) batch cpu pinning='1-10' (D1-Q2 axes)
#   RECAL(IOCOST)  io.cost linear model r/w bps=2706339840 iops=786432
#   RECAL(D2SAT)   D2 saturation bytes (io.max share divisor)=2411724800
