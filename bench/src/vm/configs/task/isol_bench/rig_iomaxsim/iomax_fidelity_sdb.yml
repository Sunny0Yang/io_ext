# RECAL: sdb saturation ~320MB/s (paper_sdb calibration constant, must
# NOT be copied into the paper/ track).
benchmark_name: isol_bench iomax_fidelity sdb — q_ratelimit vs io.max (P1-6)
description: 'P1-6 controller-lineage fidelity matrix on kvmhost sdb: cap
  tracking (sub-matrix a, single BE) and interference profile (sub-matrix b,
  BE + LC), arms {none, io.max wbps=R, q_ratelimit rate=R} x R in {32,64,128,256}
  MiB/s, iter=2, none bookends at the head and tail of each sub-matrix.'
scenes:
  ib_system_metric:
    base_scene: scene/system/system_metric.yml
