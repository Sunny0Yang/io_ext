benchmark_name: isol_bench D2/D3 iox smoke
description: 'Focused iox smoke: D2 weighted fairness (mixed_rw + saturated, cg=4) and D3 LC priority (1 LC + 4 BE). Hetero profiles pass arb_prio to loaders.'
scenes: {}
io_ext_policy_profiles:
  iox_arb_sp_weighted:
    name: iox D2 arb_sp + fifo per-cgroup (prio by weight)
    target_device: nvme0n1
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns: &id001
      - loader_arb_
      - loader_q_
      - loader_minimal
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      arbiters:
      - name: arb_sp
        path: /opt/io-ext/userspace/loader_arb_sp
        scope: arbiter
    cgroup_policies_from_groups:
    - tenant_group: d2_w1
      name_template: q_fifo_w1
      path: /opt/io-ext/userspace/loader_q_fifo
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - -p
      - '3'
    - tenant_group: d2_w2
      name_template: q_fifo_w2
      path: /opt/io-ext/userspace/loader_q_fifo
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - -p
      - '2'
    - tenant_group: d2_w3
      name_template: q_fifo_w3
      path: /opt/io-ext/userspace/loader_q_fifo
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - -p
      - '1'
    - tenant_group: d2_w4
      name_template: q_fifo_w4
      path: /opt/io-ext/userspace/loader_q_fifo
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - -p
      - '0'
  iox_wedf_cg:
    name: iox D2 wedf per-cgroup
    target_device: nvme0n1
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns: *id001
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
    cgroup_policies_from_groups:
    - tenant_group: d2_tenants
      name_template: q_wedf_{tenant_id}
      path: /opt/io-ext/userspace/loader_q_wedf
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
  iox_hetero:
    name: iox D3 hetero arb_mix LC sp_edf + BE fifo
    target_device: nvme0n1
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns: *id001
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      arbiters:
      - name: arb_mix
        path: /opt/io-ext/userspace/loader_arb_mix
        scope: arbiter
    cgroup_policies_from_groups:
    - tenant_group: d3_lc
      name_template: q_sp_edf_lc
      path: /opt/io-ext/userspace/loader_q_sp_edf
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - -p
      - '0'
    - tenant_group: d3_be
      name_template: q_fifo_be
      path: /opt/io-ext/userspace/loader_q_fifo
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - -p
      - '7'
  iox_fifo:
    name: iox D2/D3 fifo homo
    target_device: nvme0n1
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns: *id001
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      root_policies:
      - name: q_fifo_root
        path: /opt/io-ext/userspace/loader_q_fifo
        scope: root_policy
        args:
        - -c
        - '{policy_cgroup_path}'
  iox_hetero_wedf:
    name: iox D3 hetero arb_mix LC sp_edf + BE wedf
    target_device: nvme0n1
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns: *id001
