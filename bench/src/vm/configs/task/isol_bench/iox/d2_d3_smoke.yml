    tenant_groups:
    - d2_w1
    - d2_w2
    - d2_w3
    - d2_w4
    duration: 60
- sequence_id: D3_lc_rread_4k_iox_fifo
  name: D3 LC 1+4BE iox_fifo
  io_ext_policy: iox_fifo
  steps:
  - name: 1 LC + 4 BE
    tenant_groups:
    - d3_lc
    - d3_be
    duration: 60
- sequence_id: D3_lc_rread_4k_iox_homo_sp_edf
