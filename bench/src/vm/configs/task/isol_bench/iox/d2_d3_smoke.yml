        path: /sys/fs/cgroup
        controllers:
        - io
      arbiters:
      - name: arb_mix
        path: /opt/io-ext/userspace/loader_arb_mix
        scope: arbiter
    cgroup_policies_from_groups:
    - tenant_group: d3_lc
      name_template: q_sp_edf_lc
      path: /opt/io-ext/userspace/loader_q_sp_edf
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - -p
      - '0'
    - tenant_group: d3_be
      name_template: q_wedf_be
      path: /opt/io-ext/userspace/loader_q_wedf
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - -p
      - '7'
  iox_homo_sp_edf:
    name: iox D3 homo sp_edf
    target_device: nvme0n1
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns: *id001
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      root_policies:
      - name: q_sp_edf_root
        path: /opt/io-ext/userspace/loader_q_sp_edf
        scope: root_policy
        args:
        - -c
        - '{policy_cgroup_path}'
