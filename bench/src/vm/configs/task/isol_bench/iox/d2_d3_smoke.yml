              wiops: max
    template:
      base_scene: scene/io_ext/fio.yml
      parameters:
        target_device: nvme0n1
        file_name: /dev/nvme0n1
        scheduler: scx_io
        output_dir: ./test_results/isol_bench/iox_d2_d3_smoke/d2/saturated_weighted_ncg4
        duration: 60
        drop_caches_before_run: false
        cooldown_sec: 1
        fio_global:
          ioengine: libaio
          direct: 1
          runtime_sec: 55
          time_based: true
          group_reporting: true
          percentile_list: 50:90:95:99:99.9:100
          bs: 4k
          rw: randread
          iodepth: 256
          numjobs: 1
        io_ext:
          cleanup_stale: false
          cleanup_bpffs_pins: false
          loaders: []
