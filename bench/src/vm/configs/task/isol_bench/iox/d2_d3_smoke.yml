  d2_tenants:
    count: 4
    execution_mode: fio_subjob
    scene_id_template: ib_d2_saturated_w_ncg4_cg{idx1}
    collapsed_scene_id: ib_d2_saturated_w_ncg4_subjob
    per_tenant:
    - parameters:
        io_ext:
          cgroup:
            io_weight: 100
            io_max:
              rbps: 241172480
              wbps: 241172480
              riops: max
              wiops: max
    - parameters:
        io_ext:
