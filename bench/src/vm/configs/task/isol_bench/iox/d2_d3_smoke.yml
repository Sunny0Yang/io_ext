test_sequences:
- sequence_id: D2_saturated_weighted_cg4_iox_fifo
  name: D2 saturated weighted cg=4 iox_fifo
  io_ext_policy: iox_fifo
  steps:
  - name: contention saturated cg=4
    tenant_groups:
    - d2_tenants
    tenant_count: 4
    duration: 60
- sequence_id: D2_saturated_weighted_cg4_iox_wedf_cg
  name: D2 saturated weighted cg=4 iox_wedf_cg
  io_ext_policy: iox_wedf_cg
