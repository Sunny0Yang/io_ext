# rq1_directio_shore: RQ1 real-app scheduler comparison on TailBench Shore
# QPS20 open loop, page-cache bypass + reduced application cache (kvmhost /dev/sdb;
# runner formats+mounts /mnt/rq1dio_20261102
# per case).
#
# DEVICE-ADAPTED CALIBER: database on sdb, native SM_VOL_RAW=1 O_DIRECT,
# and Shore's application buffer pool reduced from ~2GiB to 8MiB (still on).
# Buffered QPS100 baseline overloaded; direct QPS20 baseline was stable with
# sustained sdb reads. Formal parameters are frozen at QPS20/6000req/200warmup.
# Result directory tuned_qps100 retains its historical name; see RUN_REPORT.
#
# Arms (7): RQ1D_SHORE_{NONE,KYBER,MQ_DEADLINE,BFQ} native, RQ1D_SHORE_IO_COST
# (root io.cost, sdb RECAL), RQ1D_SHORE_IOX_Q_DDL, RQ1D_SHORE_IOX_ARB_Q.
#
# Repeats are runner-controlled (--repeats N -> case <seq>_r<k>).
#
# Result convention (results dir, separated from motivation_* and cache=on):
#   results/rq1_realapps_directio_shore/<stage_dir>/
benchmark_name: "RQ1 Shore QPS20: 7 scheduler/controller arms (page-cache bypass + reduced app cache)"
description: >-
  Single-tenant Shore QPS20 open loop (6000 requests, nominal 300s ROI),
  database on freshly formatted /dev/sdb, 8192KiB application buffer pool,
  SM_VOL_RAW=1 native O_DIRECT. Native none/kyber/mq-deadline/bfq, root io.cost
  (sdb RECAL), io_ext queue-only and arbiter+queue. Baseline-calibrated for
  stable queue and sustained device reads. Buffer pool remains enabled;
  drop_caches is cold start only. Repeats via runner.
default_sequence: "RQ1D_SHORE_NONE"
fail_fast_on_scene_error: true

_native_none_io_ext: &native_none_io_ext
  cleanup_stale_when_no_specs: true
  cleanup_bpffs_pins: true

_iox_scene_io_ext: &iox_scene_io_ext
  cleanup_stale: false
  cleanup_bpffs_pins: false
  loaders: []
  cgroup_policies: []

_io_cost_model: &io_cost_model
  ctrl: "user"
  model: "linear"
  rbps: 335544320
  rseqiops: 82000
  rrandiops: 82000
  wbps: 335544320
  wseqiops: 82000
  wrandiops: 82000
_io_cost_qos: &io_cost_qos
  enable: true
  ctrl: "user"
  rpct: 95.0
  rlat: 1000000
  wpct: 95.0
  wlat: 1000000
  min: 50.0
  max: 150.0

_common_tailbench: &common_tailbench
  home: "/tmp/m1_cache_20261031_bundle/tailbench/tailbench-v0.9"
  working_dir: "/tmp/m1_cache_20261031_bundle/tailbench/tailbench-v0.9/shore"
  bench_script: "/opt/ioext-bench/src/vm/assets/tailbench/shore/shore_bench.py"
  binary: "/tmp/m1_cache_20261031_bundle/tailbench/tailbench-v0.9/shore/shore-kits/shore_kits_integrated"
  run_build: false
  scratch_dir: "/mnt/rq1dio_20261102/shore_scratch"   # Shore diskrw traffic -> sdb
  require_latency: true
  latency_unit: "us"
  binary_latency_format: "triplet"
  p99_threshold_us: 50000
  slo_deadline_us: 50000

_shore_common_params: &shore_common_params
  target_device: "sdb"
  cgroup_path: "/sys/fs/cgroup/rq1dio_shore"
  output_dir: "/tmp/rq1dio_20261102/scene/{group_id}"
  duration: 1000
  drop_caches_before_run: true       # identical discipline to the cache=on round
  tailbench:
    <<: *common_tailbench
    mode: "shore_integrated"
    # Runner copies pristine 145MB database to sdb after each mkfs.
    data_file: "/mnt/rq1dio_20261102/db-tpcc-1"
    trace_roi: true                  # read-only userspace probes record exact ROI elapsed time
    shore_conf_overrides:
      tpcc-1-bufpoolsize: 8192         # 8MiB, below 145MB dataset to force DB page reads
    env:
      TBENCH_CLIENT_THREADS: "2"
      SM_VOL_RAW: "1"                # native Shore volume OPEN_RAW -> O_DIRECT; verify fdinfo
      TBENCH_QPS: "20"                # baseline-only candidate after QPS100 persistent backlog
      TBENCH_WARMUPREQS: "200"
      TBENCH_MAXREQS: "6000"          # nominal 300s ROI at offered 20 QPS
      TBENCH_MINSLEEPNS: "10000"

scenes:
  ib_system_metric:
    base_scene: "scene/system/system_metric.yml"
    parameters:
      collection_mode: "proc"
      sample_interval: 1.0
      max_samples: 3600
      require_samples: true
      disk_devices:
      - "sdb"
      output_dir: "/tmp/rq1dio_20261102/monitor/system_metric"

io_ext_policy_profiles:
  arm_none:
    name: "rq1dio shore native none"
    target_device: "sdb"
    scheduler: "none"
    io_ext: *native_none_io_ext
  arm_kyber:
    name: "rq1dio shore native kyber"
    target_device: "sdb"
    scheduler: "kyber"
    io_ext: *native_none_io_ext
  arm_mq_deadline:
    name: "rq1dio shore native mq-deadline"
    target_device: "sdb"
    scheduler: "mq-deadline"
    io_ext: *native_none_io_ext
  arm_bfq:
    name: "rq1dio shore native bfq"
    target_device: "sdb"
    scheduler: "bfq"
    io_ext: *native_none_io_ext
  arm_io_cost:
    name: "rq1dio shore io.cost root controller"
    target_device: "sdb"
    scheduler: "none"
    io_ext: *native_none_io_ext
  arm_iox_q_ddl:
    name: "rq1dio shore iox q_ddl (queue-only)"
    target_device: "sdb"
    scheduler: "scx_io"
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - "loader_arb_"
      - "loader_q_"
      - "loader_minimal"
      root_cgroup:
        path: "/sys/fs/cgroup"
        controllers:
        - "io"
      root_policies:
      - name: "q_ddl_root"
        path: "/opt/io-ext/userspace/loader_q_ddl"
        scope: "root_policy"
        args:
        - "-c"
        - "{policy_cgroup_path}"
  arm_iox_arb_q:
    name: "rq1dio shore iox arb_wdrr + q_fifo (arb-dominant)"
    target_device: "sdb"
    scheduler: "scx_io"
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - "loader_arb_"
      - "loader_q_"
      - "loader_minimal"
      root_cgroup:
        path: "/sys/fs/cgroup"
        controllers:
        - "io"
      arbiters:
      - name: "arb_wdrr"
        path: "/opt/io-ext/userspace/loader_arb_wdrr"
        scope: "arbiter"
      root_policies:
      - name: "q_fifo_root"
        path: "/opt/io-ext/userspace/loader_q_fifo"
        scope: "root_policy"
        args:
        - "-c"
        - "{policy_cgroup_path}"

tenant_groups:
  shore_none:
    count: 1
    scene_id_template: "rq1d_shore_none_t{idx1}"
    template:
      base_scene: "scene/io_ext/tailbench_shore.yml"
      parameters:
        <<: *shore_common_params
        scheduler: "none"
        io_ext: *native_none_io_ext
  shore_kyber:
    count: 1
    scene_id_template: "rq1d_shore_kyber_t{idx1}"
    template:
      base_scene: "scene/io_ext/tailbench_shore.yml"
      parameters:
        <<: *shore_common_params
        scheduler: "kyber"
        io_ext: *native_none_io_ext
  shore_mq_deadline:
    count: 1
    scene_id_template: "rq1d_shore_mq_deadline_t{idx1}"
    template:
      base_scene: "scene/io_ext/tailbench_shore.yml"
      parameters:
        <<: *shore_common_params
        scheduler: "mq-deadline"
        io_ext: *native_none_io_ext
  shore_bfq:
    count: 1
    scene_id_template: "rq1d_shore_bfq_t{idx1}"
    template:
      base_scene: "scene/io_ext/tailbench_shore.yml"
      parameters:
        <<: *shore_common_params
        scheduler: "bfq"
        io_ext: *native_none_io_ext
  shore_io_cost:
    count: 1
    scene_id_template: "rq1d_shore_io_cost_t{idx1}"
    template:
      base_scene: "scene/io_ext/tailbench_shore.yml"
      parameters:
        <<: *shore_common_params
        scheduler: "none"
        io_ext:
          <<: *native_none_io_ext
          root_cgroup:
            path: "/sys/fs/cgroup"
            controllers:
            - "io"
          cgroup:
            path: "/sys/fs/cgroup/rq1dio_shore"
            controllers:
            - "io"
            io_cost:
              model: *io_cost_model
              qos: *io_cost_qos
  shore_iox_q_ddl:
    count: 1
    scene_id_template: "rq1d_shore_iox_q_ddl_t{idx1}"
    template:
      base_scene: "scene/io_ext/tailbench_shore.yml"
      parameters:
        <<: *shore_common_params
        scheduler: "scx_io"
        io_ext: *iox_scene_io_ext
  shore_iox_arb_q:
    count: 1
    scene_id_template: "rq1d_shore_iox_arb_q_t{idx1}"
    template:
      base_scene: "scene/io_ext/tailbench_shore.yml"
      parameters:
        <<: *shore_common_params
        scheduler: "scx_io"
        io_ext: *iox_scene_io_ext

test_sequences:
- sequence_id: "RQ1D_SHORE_NONE"
  name: "RQ1D Shore QPS20, native none baseline"
  io_ext_policy: "arm_none"
  steps:
  - name: "shore none"
    tenant_groups: ["shore_none"]
    monitoring_scenes: ["ib_system_metric"]
    monitoring_startup_time: 3
    duration: 1000
- sequence_id: "RQ1D_SHORE_KYBER"
  name: "RQ1D Shore QPS20, native kyber"
  io_ext_policy: "arm_kyber"
  steps:
  - name: "shore kyber"
    tenant_groups: ["shore_kyber"]
    monitoring_scenes: ["ib_system_metric"]
    monitoring_startup_time: 3
    duration: 1000
- sequence_id: "RQ1D_SHORE_MQ_DEADLINE"
  name: "RQ1D Shore QPS20, native mq-deadline"
  io_ext_policy: "arm_mq_deadline"
  steps:
  - name: "shore mq-deadline"
    tenant_groups: ["shore_mq_deadline"]
    monitoring_scenes: ["ib_system_metric"]
    monitoring_startup_time: 3
    duration: 1000
- sequence_id: "RQ1D_SHORE_BFQ"
  name: "RQ1D Shore QPS20, native bfq"
  io_ext_policy: "arm_bfq"
  steps:
  - name: "shore bfq"
    tenant_groups: ["shore_bfq"]
    monitoring_scenes: ["ib_system_metric"]
    monitoring_startup_time: 3
    duration: 1000
- sequence_id: "RQ1D_SHORE_IO_COST"
  name: "RQ1D Shore QPS20, root io.cost (sdb RECAL calibration)"
  io_ext_policy: "arm_io_cost"
  steps:
  - name: "shore io.cost"
    tenant_groups: ["shore_io_cost"]
    monitoring_scenes: ["ib_system_metric"]
    monitoring_startup_time: 3
    duration: 1000
- sequence_id: "RQ1D_SHORE_IOX_Q_DDL"
  name: "RQ1D Shore QPS20, iox queue-only loader_q_ddl"
  io_ext_policy: "arm_iox_q_ddl"
  steps:
  - name: "shore iox q_ddl"
    tenant_groups: ["shore_iox_q_ddl"]
    monitoring_scenes: ["ib_system_metric"]
    monitoring_startup_time: 3
    duration: 1000
- sequence_id: "RQ1D_SHORE_IOX_ARB_Q"
  name: "RQ1D Shore QPS20, iox arb_wdrr + q_fifo (arb-dominant)"
  io_ext_policy: "arm_iox_arb_q"
  steps:
  - name: "shore iox arb_q"
    tenant_groups: ["shore_iox_arb_q"]
    monitoring_scenes: ["ib_system_metric"]
    monitoring_startup_time: 3
    duration: 1000