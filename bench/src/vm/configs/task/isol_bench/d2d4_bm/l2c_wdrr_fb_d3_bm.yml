  - name: ALLOW_FALLBACK arb_wdrr probe (patch 0004) cg2
    tenant_groups:
    - l2c_lc
    - l2c_be1
    - l2c_be2
    - l2c_be3
    - l2c_be4
    monitoring_scenes:
