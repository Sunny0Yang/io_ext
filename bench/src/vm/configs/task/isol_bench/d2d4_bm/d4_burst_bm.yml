# AUTO-GENERATED by scripts/gen_d2d4_bm_yamls.py (D2/D3/D4 bare-metal bm batch, 2026-11-10)
# RECAL on new hardware (grep for 'RECAL('):
#   RECAL(DEVICE)    target_device=nvme0n1  (single disk; root ext4 spans it)
#   RECAL(REGION)   file_name=/opt/ioext/d2d4_regions/region.bin (shared region file; runner fallocates 64GiB once, reads only)
#   RECAL(LOADERS)  loader dir=/opt/ioext/d2d4_bm/loaders/loader-bundle (bare-metal manifest-hash staging dir; D2D4_bm_LOADER_DIR)
#   RECAL(IOCOST)   io.cost linear model = experiments/homo_v2/calibration_bm.json (rbps=1877961028, rseqiops=436504, rrandiops=504812, wbps=1895474286, wseqiops=436118, wrandiops=324051)
#   RECAL(IOCOSTQOS) io.cost.qos rlat=2000us (homo_v2 frozen binding set; written at the cgroup root via setup_iocost_at_root)
#   RECAL(D2SAT)    D2_bm_satprobe measures the bm saturated aggregate (cg16 equal weights, none arm)
#   RECAL(LCSOLO)   D3_bm_lcsolo_none measures the solo LC anchor (D3 SLO line = 2x its p99)
benchmark_name: isol_bench D4 LC burst bm (bare-metal nvme0n1, shared region file)
description: 'D4 bm v2 (2026-11-10): BE = 4 tenant job(s) x QD1024 4k randread (aggregate QD4096; --d4-be 4x1024; the legacy 1x1024 single job only drove ~61% saturation, 4x256 reaches 93%+), 80s, per-job write_bw_log log_avg_msec=1000 log_unix_epoch=1 (fio splits the bw log per job: _bw.1.log .. _bw.N.log under the one collapsed BE subjob scene; the analyzer sums the per-second buckets) + 1 LC (4k randread QD1, startdelay 60s, 10s burst) with write_lat_log log_avg_msec=1 (1ms clat samples). duration 90. Metric: LC p99 (whole 10s window) + 250ms-window peak + aggregate-BE dip%/recovery (scripts/analyze_d2d4_bm.py).'
scenes:
  ib_system_metric:
    base_scene: scene/system/system_metric.yml
    parameters:
      collection_mode: proc
      sample_interval: 1.0
      max_samples: 120
      require_samples: true
      disk_devices:
      - nvme0n1
      output_dir: ./test_results/isol_bench/d2d4_bm/d4/system_metric
  ib_block_io_latency_cost:
    base_scene: scene/block_bpf/block_io_latency_cost.yml
    parameters:
      output_dir: ./test_results/isol_bench/d2d4_bm/d4/block_io_latency_cost
      output_file: ./test_results/isol_bench/d2d4_bm/d4/block_io_latency_cost/block_io_latency_cost.bpftrace.log
      summary_file: ./test_results/isol_bench/d2d4_bm/d4/block_io_latency_cost/block_io_latency_cost_summary.json
      require_events: false
      privilege:
        method: sudo_nopasswd
  ib_scx_io_bypass_fallback:
    base_scene: scene/block_bpf/scx_io_bypass_fallback.yml
    parameters:
      require_events: false
      output_dir: ./test_results/isol_bench/d2d4_bm/d4/scx_io_bypass_fallback
  ib_perf_stat:
    base_scene: scene/system/perf_stat.yml
    parameters:
      cpu_list: '2'
      sample_interval_ms: 1000
      require_available: false
      output_dir: ./test_results/isol_bench/d2d4_bm/d4/perf_stat
io_ext_policy_profiles:
  IB_none:
    name: D4_bm none
    target_device: nvme0n1
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  IB_io_cost:
    name: D4_bm io_cost (root model+qos from calibration_bm.json)
    target_device: nvme0n1
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
  iox_qonly:
    name: 'D4_bm iox_qonly (hetero per-tenant: LC q_fifo -p0 / BE q_ratelimit -p7 + TUNE)'
    target_device: nvme0n1
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - loader_arb_
      - loader_q_
      - loader_minimal
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
    cgroup_policies_from_groups:
    - tenant_group: d4_iox_lc
      name_template: q_fifo_lc
      path: /opt/ioext/d2d4_bm/loaders/bundle/loader_q_fifo
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - -p
      - '0'
    - tenant_group: d4_iox_be
      name_template: q_ratelimit_be_t{idx1}
      path: /opt/ioext/d2d4_bm/loaders/bundle/loader_q_ratelimit
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - -p
      - '7'
      - --rate-mib-s
      - '300'
  iox_arbonly:
    name: D4_bm iox_arbonly (arb_wdrr + q_fifo, PD4BW verbatim LC -W400 / BE -W100)
    target_device: nvme0n1
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - loader_arb_
      - loader_q_
      - loader_minimal
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      arbiters:
      - name: arb_wdrr
        path: /opt/ioext/d2d4_bm/loaders/bundle/loader_arb_wdrr
        scope: arbiter
        args:
        - --allow-fallback
        - '1'
    cgroup_policies_from_groups:
    - tenant_group: d4_iox_lc
      name_template: q_fifo_lc
      path: /opt/ioext/d2d4_bm/loaders/bundle/loader_q_fifo
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - -W
      - '400'
    - tenant_group: d4_iox_be
      name_template: q_fifo_be_t{idx1}
      path: /opt/ioext/d2d4_bm/loaders/bundle/loader_q_fifo
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - -W
      - '100'
  iox_qarb:
    name: D4_bm iox_qarb (arb_wdrr + q_ddl, PD4BW q_ddl_arb_wdrr verbatim LC -W400 / BE -W100 + TUNE)
    target_device: nvme0n1
    scheduler: scx_io
    io_ext:
      cleanup_stale: true
      cleanup_bpffs_pins: true
      stale_loader_patterns:
      - loader_arb_
      - loader_q_
      - loader_minimal
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
      arbiters:
      - name: arb_wdrr
        path: /opt/ioext/d2d4_bm/loaders/bundle/loader_arb_wdrr
        scope: arbiter
        args:
        - --allow-fallback
        - '1'
    cgroup_policies_from_groups:
    - tenant_group: d4_iox_lc
      name_template: q_ddl_lc
      path: /opt/ioext/d2d4_bm/loaders/bundle/loader_q_ddl
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - -W
      - '400'
      - --lat-deadline-ns
      - '200000'
      - --bulk-starvation-ns
      - '100000'
      - --guard-ns
      - '20000'
    - tenant_group: d4_iox_be_ddl
      name_template: q_ddl_be_t{idx1}
      path: /opt/ioext/d2d4_bm/loaders/bundle/loader_q_ddl
      scope: cgroup_policy
      args:
      - -c
      - '{policy_cgroup_path}'
      - -W
      - '100'
