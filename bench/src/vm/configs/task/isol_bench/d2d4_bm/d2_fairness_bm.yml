# AUTO-GENERATED by scripts/gen_d2d4_bm_yamls.py (D2/D3/D4 bare-metal bm batch, 2026-11-10)
# RECAL on new hardware (grep for 'RECAL('):
#   RECAL(DEVICE)    target_device=nvme0n1  (single disk; root ext4 spans it)
#   RECAL(REGION)   file_name=/opt/ioext/d2d4_regions/region.bin (shared region file; runner fallocates 64GiB once, reads only)
#   RECAL(LOADERS)  loader dir=/opt/ioext/d2d4_bm/loaders/loader-bundle (bare-metal manifest-hash staging dir; D2D4_bm_LOADER_DIR)
#   RECAL(IOCOST)   io.cost linear model = experiments/homo_v2/calibration_bm.json (rbps=1877961028, rseqiops=436504, rrandiops=504812, wbps=1895474286, wseqiops=436118, wrandiops=324051)
#   RECAL(IOCOSTQOS) io.cost.qos rlat=2000us (homo_v2 frozen binding set; written at the cgroup root via setup_iocost_at_root)
#   RECAL(D2SAT)    D2_bm_satprobe measures the bm saturated aggregate (cg16 equal weights, none arm)
#   RECAL(LCSOLO)   D3_bm_lcsolo_none measures the solo LC anchor (D3 SLO line = 2x its p99)
benchmark_name: isol_bench D2 fairness bm (bare-metal nvme0n1, shared region file)
description: 'D2 bm (2026-11-10): saturated contention + weight gradient 1:2:...:ncg on the bm bare-metal root disk (single-disk mode: every tenant reads the SHARED region file /opt/ioext/d2d4_regions/region.bin; runner fallocates it once, reads only). 5 arms x ncg=[2,4,8,16] x iter=[1..reps]. Weight ladder w_i=i: loader -W=100*i (iox), io.weight=100*i (io_cost arm per-cg ladder, d2_fairness.yml style). Metric: w-indexed JainW (ratio_i=bw_i/w_i) + aggregate MB/s (scripts/analyze_d2d4_bm.py).'
scenes:
  ib_system_metric:
    base_scene: scene/system/system_metric.yml
    parameters:
      collection_mode: proc
      sample_interval: 1.0
      max_samples: 120
      require_samples: true
      disk_devices:
      - nvme0n1
      output_dir: ./test_results/isol_bench/d2d4_bm/d2/system_metric
  ib_block_io_latency_cost:
    base_scene: scene/block_bpf/block_io_latency_cost.yml
    parameters:
      output_dir: ./test_results/isol_bench/d2d4_bm/d2/block_io_latency_cost
      output_file: ./test_results/isol_bench/d2d4_bm/d2/block_io_latency_cost/block_io_latency_cost.bpftrace.log
      summary_file: ./test_results/isol_bench/d2d4_bm/d2/block_io_latency_cost/block_io_latency_cost_summary.json
      require_events: false
      privilege:
        method: sudo_nopasswd
  ib_scx_io_bypass_fallback:
    base_scene: scene/block_bpf/scx_io_bypass_fallback.yml
    parameters:
      require_events: false
      output_dir: ./test_results/isol_bench/d2d4_bm/d2/scx_io_bypass_fallback
  ib_perf_stat:
    base_scene: scene/system/perf_stat.yml
    parameters:
      cpu_list: '2'
      sample_interval_ms: 1000
      require_available: false
      output_dir: ./test_results/isol_bench/d2d4_bm/d2/perf_stat
io_ext_policy_profiles:
  IB_none:
    name: D2_bm none
    target_device: nvme0n1
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  IB_io_cost:
    name: D2_bm io_cost (root model+qos from calibration_bm.json)
    target_device: nvme0n1
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
