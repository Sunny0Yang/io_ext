benchmark_name: isol_bench rig M2 fig2 replication (bare-metal bare metal)
description: 'M2'' motivation on bare-metal bm: near-verbatim replication of the isol-bench paper Fig.
  2 (IISWC''25) cgroups I/O knob arms + native kyber arm; three identical 64K randread QD8 fio apps rate-limited
  to 1536M MiB/s (bare-metal solo calibration), staggered A 0-50s / B 10-70s / C 20-50s, reading a preallocated
  32G direct=1 file (/opt/ioext/m2fig2/data/m2f2_data.bin) on nvme0n1; io.* knobs applied
  on per-tenant child cgroups. Generated by experiments/m1m2_bm/scripts/gen_m2_fig2_yamls_bm.py.'
fail_fast_on_scene_error: true
io_ext_policy_profiles:
  F2_a_none:
    name: M2F2 fig2 arm a_none (bare-metal)
    target_device: nvme0n1
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  F2_b_mqdl_prio:
    name: M2F2 fig2 arm b_mqdl_prio (bare-metal)
    target_device: nvme0n1
    scheduler: mq-deadline
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  F2_c_bfq:
    name: M2F2 fig2 arm c_bfq (bare-metal)
    target_device: nvme0n1
    scheduler: bfq
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  F2_d_bfq_weight:
    name: M2F2 fig2 arm d_bfq_weight (bare-metal)
    target_device: nvme0n1
    scheduler: bfq
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  F2_e_io_max:
    name: M2F2 fig2 arm e_io_max (bare-metal)
    target_device: nvme0n1
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  F2_g_io_cost:
    name: M2F2 fig2 arm g_io_cost (bare-metal)
    target_device: nvme0n1
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
  F2_h_io_cost_weight:
    name: M2F2 fig2 arm h_io_cost_weight (bare-metal)
    target_device: nvme0n1
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
  F2_i_native_kyber:
    name: M2F2 fig2 arm i_native_kyber (bare-metal)
    target_device: nvme0n1
    scheduler: kyber
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
  F2_f_io_latency:
    name: M2F2 fig2 arm f_io_latency (bare-metal)
    target_device: nvme0n1
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
tenant_groups:
  m2f2_a_none:
    count: 3
    scene_id_template: ib_m2f2_a_none_t_{idx1}
    name_template: M2F2 (a) No knob or I/O scheduler tenant {idx1}
    template:
      base_scene: scene/io_ext/fio.yml
      parameters:
        target_device: nvme0n1
        file_name: /opt/ioext/m2fig2/data/m2f2_data.bin
        data_file_size_gb: 32
        scheduler: none
        scheduler_tunables: {}
        output_dir: ./test_results/isol_bench/rig_m2_fig2_bm/a_none
        duration: 110
        drop_caches_before_run: false
        cooldown_sec: 1
        fio_global:
          ioengine: io_uring
          direct: 1
          bs: 64k
          rw: randread
          iodepth: 8
          numjobs: 1
          rate: 1536M
          runtime_sec: 50
          startdelay: 0
          time_based: true
          group_reporting: true
          log_avg_msec: 1000
          write_bw_log: bw
        io_ext:
          cleanup_stale_when_no_specs: true
          cleanup_bpffs_pins: true
          cgroup:
            path: /sys/fs/cgroup/ib_m2f2_a_none_t_a
            controllers:
            - io
            io_cost:
              qos:
                enable: false
    per_tenant:
    - parameters:
        job_name: m2f2_a_none_a
        fio_global:
          runtime_sec: 50
          startdelay: 0
        io_ext:
