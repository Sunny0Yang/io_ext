# rig_m1_cache bm adaptation -- P0-2 native scheduler x real-app matrix under
# the SAME cache=on caliber as m1_cache_on_bm.yml. Derived 1:1 from
# src/vm/configs/task/isol_bench/rig_m1_cache/m1_native_matrix_cacheon.yml
# (kvmhost sdb); only the bm caliber paths/device differ (see the
# m1_cache_on_bm.yml header for the full adaptation list: nvme0n1 root disk,
# no mkfs/mount, data dirs under /opt/ioext/data/m1_cache/,
# skip_disk_setup: true, staging bundle/asset paths, /tmp/m1_cache_bm output
# root).
#
# Native scheduler switching mechanism (identical to kvmhost): per-arm tenant
# groups pin `scheduler` on the tenant scene parameters (each scene
# re-asserts the device scheduler at run start via set_scheduler -- writes
# /sys/block/nvme0n1/queue/scheduler through NOPASSWD sudo), and each arm's
# io_ext_policy profile additionally generates a global loader scene that
# pins the scheduler before the steps run. bm ioext2 kernel carries
# none/mq-deadline/kyber/bfq BUILT-IN (LEDGER 2026-11-05 acceptance: scheduler
# list "[none] mq-deadline kyber bfq scx_io") -- NO modprobe needed.
#
# Protocol (identical to kvmhost): repeats are NOT enumerated in this yml --
# the runner runs each sequence N times (case names <seq>_r<k>); target >= 3
# repeats per cell, or 1 probe first (--probe) then 3 confirming repeats.
# State reset between repeats on bm = runner data-dir rm-rf/mkdir +
# drop_caches (NOT kvmhost's per-case mkfs; see m1_cache_on_bm.yml header).
# cache=on attribution discipline: drop_caches_before_run: true on every scene.
#
# NO iox arms here: m1_1/m1_2 figures are iox-free by design.
#
# Result convention (bare-metal): runner pulls to
#   experiments/m1m2_bm/runs/m1_campaign/<RUN_ID>/<CASE>.tar.gz
# (case naming M1MATRIX_*_r<k> identical to kvmhost -> native_matrix_cases.csv /
# native_matrix_summary.csv schema unchanged; the bm analysis pass walks the
# same case-dir layout: run_results.json + step_0/*/JSON + monitor/system_metric).
benchmark_name: "rig_m1_cache native scheduler x real-app matrix, cache=on (baremetal bm nvme0n1)"
description: >-
  4 real-app scenarios (YCSB-A buffered, default 8 MiB block cache; YCSB-C
  read-only buffered, default 8 MiB block cache; db_bench readwhilewriting
  buffered + explicit 32 MiB cache; Shore QPS50) x 4 native
  block schedulers (none / kyber / mq-deadline / bfq) = 16 sequences. No
  cgroup io.* controller values, no io_ext loader policy.
default_sequence: "M1MATRIX_YCSB_A_NONE"
fail_fast_on_scene_error: true

_native_none_io_ext: &native_none_io_ext
  cleanup_stale_when_no_specs: true
  cleanup_bpffs_pins: true

_JAVA_HOME: &java_home "/opt/ioext/staging/motivation_m2_pilot_20261030_bundle/motivation_m2_pilot_20261030/runtime/java-21-openjdk-amd64"

_common_ycsb: &common_ycsb
  target_device: "nvme0n1"
  output_dir: "/tmp/m1_cache_bm/scene/{group_id}"
  duration: 1100
  drop_caches_before_run: true   # cache=on attribution discipline
  database:
    db_type: "rocksdb"
    data_dir: "/opt/ioext/data/m1_cache/ycsb_db"
    ycsb_dir: "/opt/ioext/src/vm/assets/ycsb/ycsb_runtime"
    use_direct_io: false
    write_buffer_size: 67108864
    # Block cache = bundled rocksdbjni default 8 MiB LRU (verified constant;
    # explicit sizes are impossible with the bundled YCSB runtime -- see
    # m1_cache_on_bm.yml header and the ycsb_rocksdb.py guard).
    storage_backend: "kernel_block"
    environment:
      JAVA_HOME: *java_home
      PATH: "/opt/ioext/staging/motivation_m2_pilot_20261030_bundle/motivation_m2_pilot_20261030/runtime/java-21-openjdk-amd64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  system:
    mem_limit_mb: 0
    # bm: never format/mount the root disk (see m1_cache_on_bm.yml header).
    skip_disk_setup: true
    auto_format_disk: false
    format_device: false
    cgroup_path: "/sys/fs/cgroup/m1_cache_ycsb"   # accounting only; no io.* values

_common_dbbench: &common_dbbench
  target_device: "nvme0n1"
  output_dir: "/tmp/m1_cache_bm/scene/{group_id}"
  duration: 900
  drop_caches_before_run: true
  dbbench:
    dbbench_bin: "/opt/ioext/staging/m1_cache_bm_bundle/rocksdb/db_bench"
    rocksdb_home: "/opt/ioext/staging/m1_cache_bm_bundle/rocksdb"
    db_path: "/opt/ioext/data/m1_cache/dbbench_db"
    use_direct_io: false
    common_args:
      num: 1000000
      value_size: 1024
      key_size: 16
      compression_type: "none"
      bloom_bits: 10
      cache_size: 33554432
      write_buffer_size: 67108864
  system:
    skip_disk_setup: true
    auto_format_disk: false
    format_device: false
    cgroup_path: "/sys/fs/cgroup/m1_cache_dbb"   # accounting only; no io.* values

_common_tailbench: &common_tailbench
  home: "/opt/ioext/staging/m1_cache_bm_bundle/tailbench/tailbench-v0.9"
  working_dir: "/opt/ioext/staging/m1_cache_bm_bundle/tailbench/tailbench-v0.9/shore"
  bench_script: "/opt/ioext/src/vm/assets/tailbench/shore/shore_bench.py"
  binary: "/opt/ioext/staging/m1_cache_bm_bundle/tailbench/tailbench-v0.9/shore/shore-kits/shore_kits_integrated"
  run_build: false
  # bm: scratch on the root fs (runner resets it per case).
  scratch_dir: "/opt/ioext/data/m1_cache/shore_scratch"
  require_latency: true
  latency_unit: "us"
  binary_latency_format: "triplet"
  p99_threshold_us: 50000
  slo_deadline_us: 50000

_shore_common_params: &shore_common_params
  target_device: "nvme0n1"
  output_dir: "/tmp/m1_cache_bm/scene/{group_id}"
  duration: 1000
  drop_caches_before_run: true
  # io_ext.cgroup here is LOAD-BEARING beyond accounting: run_command only wraps
  # the scene command under sudo when cgroup_path is set (common.py), and the
  # shore_integrated command starts with `chrt -r 99` which needs root on bm
  # (m1cacheon's shore group has this block; the matrix arm without it failed
  # all 12 shore cases with "chrt: failed to set pid 0's policy" EPERM).
  io_ext:
    <<: *native_none_io_ext
    cgroup:
      path: "/sys/fs/cgroup/m1matrix_shore"   # accounting only; no io.* values
      controllers:
      - "io"
  tailbench:
    <<: *common_tailbench
    mode: "shore_integrated"
    # READ-ONLY bundle input: any reset must NEVER delete this file (runner
    # resets only data/m1_cache/* under the deploy root). Shore's own write
    # traffic (diskrw) goes to scratch_dir under the deploy-root data dir.
    data_file: "/opt/ioext/staging/m1_cache_bm_bundle/data/db-tpcc-1"
    env:
      TBENCH_CLIENT_THREADS: "2"
      TBENCH_QPS: "50"
      TBENCH_WARMUPREQS: "1000"
      TBENCH_MAXREQS: "30000"     # 30000/50 = 600s ROI
      TBENCH_MINSLEEPNS: "10000"

scenes:
  ib_system_metric:
    base_scene: "scene/system/system_metric.yml"
    parameters:
      collection_mode: "proc"
      sample_interval: 1.0
      max_samples: 3600
      require_samples: true
      disk_devices:
      - "nvme0n1"
      output_dir: "/tmp/m1_cache_bm/monitor/system_metric"

io_ext_policy_profiles:
  # Native arms only: scheduler pinned by the generated global loader scene
  # (and re-asserted per tenant scene).
  arm_none:
    name: "m1 matrix bm native none"
    target_device: "nvme0n1"
    scheduler: "none"
    io_ext: *native_none_io_ext
  arm_kyber:
    name: "m1 matrix bm native kyber"
    target_device: "nvme0n1"
    scheduler: "kyber"
    io_ext: *native_none_io_ext
  arm_mq_deadline:
    name: "m1 matrix bm native mq-deadline"
    target_device: "nvme0n1"
    scheduler: "mq-deadline"
    io_ext: *native_none_io_ext
  arm_bfq:
    name: "m1 matrix bm native bfq"
    target_device: "nvme0n1"
    scheduler: "bfq"
    io_ext: *native_none_io_ext

tenant_groups:
