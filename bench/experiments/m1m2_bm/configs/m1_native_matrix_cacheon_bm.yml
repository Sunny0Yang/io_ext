  ycsb_a_none:
    count: 1
    scene_id_template: "m1matrix_ycsb_a_none_t{idx1}"
    template:
      base_scene: "scene/io_ext/ycsb_rocksdb.yml"
      parameters:
        <<: *common_ycsb
        scheduler: "none"
