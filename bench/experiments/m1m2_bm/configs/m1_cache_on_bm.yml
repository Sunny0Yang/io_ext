# rig_m1_cache bm adaptation -- M1 real-app profile on the NORMAL cache path
# (cache=on 口径) for bare-metal bm (ssh alias `bm`, hostname user, kernel
# 7.3.1-ioext2). Derived 1:1 from
# src/vm/configs/task/isol_bench/rig_m1_cache/m1_cache_on.yml (kvmhost sdb);
# every behavioral change is listed in the header -- everything else (scene
# ids, sequence ids, workload parameters, durations, repeats semantics,
# monitoring set) is IDENTICAL so the pulled case dirs feed the same
# analysis tooling (m1_cache_cases.py --results-root ... / render_m1_1_*
# with parameterized paths; CSV schema unchanged).
#
# bm caliber (LEDGER.md 决策 1 -- 根盘数据目录口径):
#   - Target device is nvme0n1: the ONLY disk, one ext4 root partition filling
#     the whole device, mounted at /. NO mkfs, NO mount, NO raw-disk direct
#     I/O. Scene data lands in ordinary directories on the root fs:
#       /opt/ioext/data/m1_cache/{ycsb_db,dbbench_db,shore_scratch}
#     The campaign runner (experiments/m1m2_bm/scripts/run_m1_cache_campaign_bm.py)
#     resets state per case = rm -rf + mkdir those data dirs (user-owned, no
#     sudo) + drop_caches; it NEVER touches the Shore input file db-tpcc-1
#     (read-only bundle input under staging/m1_cache_bm_bundle/data/).
#   - system.skip_disk_setup: true on ycsb/dbbench scenes is LOAD-BEARING:
#     _setup_test_disk() would otherwise blkid /dev/nvme0n1, see "not ext4"
#     (whole-disk GPT label, not the ext4 partition) and either fail or, with
#     auto_format_disk: true, mkfs.ext4 THE ROOT DISK. auto_format_disk/format_
#     device stay false as a second belt (fail-closed if skip is ever flipped).
#   - Cache=on attribution discipline unchanged: drop_caches_before_run: true
#     on every scene (drop before load AND between load and run; scenes'
#     run_sudo_shell works on bm via NOPASSWD sudo). Measured-window cache
#     hits still come only from the app's own caches (RocksDB 8 MiB block
#     cache / Shore buffer pool), never stale page cache.
#   - YCSB/RocksDB: buffered (use_direct_io: false); block cache stays at the
#     bundled rocksdbjni default 8 MiB LRU (explicit sizes impossible with the
#     bundled runtime -- options-file table options rejected/segfault; see
#     ycsb_rocksdb.py guard). Block cache is a constant across every arm.
#   - db_bench: buffered + cache_size 33554432 (32 MiB, explicit) + bloom_bits 10 kept.
#   - Shore: inherently buffered; scratch (diskrw writes) -> data/m1_cache/
#     shore_scratch on the root fs; data_file db-tpcc-1 is a read-only input
#     from the bundle (never deleted by any reset).
#   - cgroup v2 paths are accounting-only: NO io.* values anywhere (bare-metal has
#     io.max/io.latency only on child cgroups anyway; nothing is written).
#   - m1_pattern_sampler (bpftrace 0.25.0 at /usr/bin/bpftrace): the base
#     scene scene/block_bpf/m1_pattern_sampler.yml has NO device hardcode
#     (samples the whole block layer); privilege sudo_nopasswd works on bm
#     (/etc/sudoers.d/90-ioext-nopasswd, NOPASSWD for user).
#
# Result convention (bare-metal): the runner pulls per-case tars to
#   experiments/m1m2_bm/runs/m1_campaign/<RUN_ID>/[ab/]<CASE>.tar.gz
# (m1cacheon -> root level; m1cacheab -> ab/ sublevel; same RUN_ID across the
# two campaigns gives exactly the layout m1_cache_cases.py walks:
# --results-root <RUN_ID> with ab/<CASE> underneath).
benchmark_name: "rig_m1_cache M1 real-app cache=on profile (baremetal bm nvme0n1)"
description: >-
  M1 cache-on caliber on bare-metal bm root disk (nvme0n1, no mkfs/mount,
  data dirs under the deploy root): YCSB workloada + workloadc (RocksDB
  buffered, default 8 MiB block cache -- see header), db_bench readwhilewriting
  + readrandom (buffered, cache_size 32 MiB), Shore QPS50 open loop. Native
  none only, zero io.* controller writes, page-cache drop before every
  measured window, runner data-dir reset per case.
default_sequence: "M1CACHE_YCSB_a"
fail_fast_on_scene_error: true

_RUN_ROOT: &run_root "/tmp/m1_cache_bm"
_JAVA_HOME: &java_home "/opt/ioext/staging/motivation_m2_pilot_20261030_bundle/motivation_m2_pilot_20261030/runtime/java-21-openjdk-amd64"

_native_none_io_ext: &native_none_io_ext
  cleanup_stale_when_no_specs: true
  cleanup_bpffs_pins: true

_common_ycsb: &common_ycsb
  target_device: "nvme0n1"
  scheduler: "none"
  output_dir: "/tmp/m1_cache_bm/scene/{group_id}"
  duration: 1100
  # Attribution discipline: drop page cache before load AND between load and run
  # so measured-window hits come from the RocksDB block cache, not stale page cache.
  drop_caches_before_run: true
  database:
    db_type: "rocksdb"
    # bm caliber: data_dir is a plain directory on the root fs (NOT under a
    # test-disk mount point). The runner rm-rf's/recreates it per case;
    # the scene also wipes it at run start. Never on a mount point -> no
    # mount/format logic may trigger: system.skip_disk_setup: true below.
    data_dir: "/opt/ioext/data/m1_cache/ycsb_db"
    ycsb_dir: "/opt/ioext/src/vm/assets/ycsb/ycsb_runtime"
    # cache=on: the normal application path (buffered page cache + RocksDB default
    # 8 MiB block cache, a verified constant across all arms here; explicit sizes
    # are impossible with the bundled rocksdbjni -- see header comment).
    use_direct_io: false
    write_buffer_size: 67108864
    storage_backend: "kernel_block"
    environment:
      JAVA_HOME: *java_home
      PATH: "/opt/ioext/staging/motivation_m2_pilot_20261030_bundle/motivation_m2_pilot_20261030/runtime/java-21-openjdk-amd64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  system:
    mem_limit_mb: 0
    # bm: NO formatting/mounting of nvme0n1 EVER (it is the root disk).
    # skip_disk_setup=true bypasses _setup_test_disk entirely (same switch the
    # RQ5 coloc configs use for pre-mounted/plain-directory data dirs);
    # auto_format_disk/format_device=false keep the path fail-closed anyway.
    skip_disk_setup: true
    auto_format_disk: false
    format_device: false
    cgroup_path: "/sys/fs/cgroup/m1_cache_ycsb"   # accounting only; no io.* values
  io_ext:
    <<: *native_none_io_ext

_common_dbbench: &common_dbbench
  target_device: "nvme0n1"
  scheduler: "none"
  output_dir: "/tmp/m1_cache_bm/scene/{group_id}"
  duration: 900
  drop_caches_before_run: true   # same attribution discipline as YCSB
  dbbench:
    # m1 bundle on bm (provisioned under the deploy root, NOT /tmp): db_bench +
    # librocksdb.so.11.2.0 + hostlibs/ (see staging/m1_cache_bm_bundle).
    dbbench_bin: "/opt/ioext/staging/m1_cache_bm_bundle/rocksdb/db_bench"
    rocksdb_home: "/opt/ioext/staging/m1_cache_bm_bundle/rocksdb"
    db_path: "/opt/ioext/data/m1_cache/dbbench_db"
    # cache=on: buffered + explicit 32 MiB block cache (same magnitude as the
    # YCSB arm; db_bench builds a fresh LRUCache(cache_size) when > 0).
    use_direct_io: false
    common_args:
      num: 1000000
      value_size: 1024
      key_size: 16
      compression_type: "none"
      bloom_bits: 10
      cache_size: 33554432
      write_buffer_size: 67108864
  system:
    skip_disk_setup: true
    auto_format_disk: false
    format_device: false
    cgroup_path: "/sys/fs/cgroup/m1_cache_dbb"   # accounting only; no io.* values
  io_ext:
    <<: *native_none_io_ext

_common_tailbench: &common_tailbench
  home: "/opt/ioext/staging/m1_cache_bm_bundle/tailbench/tailbench-v0.9"
  working_dir: "/opt/ioext/staging/m1_cache_bm_bundle/tailbench/tailbench-v0.9/shore"
  bench_script: "/opt/ioext/src/vm/assets/tailbench/shore/shore_bench.py"
  binary: "/opt/ioext/staging/m1_cache_bm_bundle/tailbench/tailbench-v0.9/shore/shore-kits/shore_kits_integrated"
  run_build: false
  # bm: Shore's diskrw write traffic -> scratch on the root fs (data dir reset
  # by the runner per case). NOT the kvmhost sdb mount point anymore.
  scratch_dir: "/opt/ioext/data/m1_cache/shore_scratch"
  require_latency: true
  latency_unit: "us"
  binary_latency_format: "triplet"
  p99_threshold_us: 50000
  slo_deadline_us: 50000

scenes:
  ib_system_metric:
    base_scene: "scene/system/system_metric.yml"
    parameters:
      collection_mode: "proc"
      sample_interval: 1.0
      max_samples: 3600
      require_samples: true
      disk_devices:
      - "nvme0n1"
      output_dir: "/tmp/m1_cache_bm/monitor/system_metric"
  m1_pattern_sampler:
    base_scene: "scene/block_bpf/m1_pattern_sampler.yml"
    parameters:
      output_dir: "/tmp/m1_cache_bm/monitor/m1_pattern_sampler"
      output_file: "/tmp/m1_cache_bm/monitor/m1_pattern_sampler/m1_pattern_sampler.bpftrace.log"
      summary_file: "/tmp/m1_cache_bm/monitor/m1_pattern_sampler/m1_pattern_sampler_summary.json"
      require_events: false
      privilege:
        method: "sudo_nopasswd"
        askpass_script: ""

io_ext_policy_profiles:
  arm_m1cache_none:
    name: "rig_m1_cache bm native none (cache=on profile)"
    target_device: "nvme0n1"
    scheduler: "none"
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true

tenant_groups:
  # ---------- YCSB workloada (50/50 read/update) ----------
  m1cache_ycsb_a:
    count: 1
    scene_id_template: "m1cache_ycsb_a_t{idx1}"
    template:
      base_scene: "scene/io_ext/ycsb_rocksdb.yml"
      parameters:
        <<: *common_ycsb
        ycsb_workload:
          recordcount: 400000
          operationcount: 10000000
          threads: 16
          jvm_args: "-Xms2048m -Xmx2048m"
          workload_type: "a"
          properties:
            fieldcount: 10
            fieldlength: 1024
            maxexecutiontime: 600
  # ---------- YCSB workloadc (read only) ----------
  m1cache_ycsb_c:
    count: 1
    scene_id_template: "m1cache_ycsb_c_t{idx1}"
    template:
      base_scene: "scene/io_ext/ycsb_rocksdb.yml"
      parameters:
        <<: *common_ycsb
        ycsb_workload:
          recordcount: 400000
          operationcount: 10000000
          threads: 16
          jvm_args: "-Xms2048m -Xmx2048m"
          workload_type: "c"
          properties:
            fieldcount: 10
            fieldlength: 1024
            maxexecutiontime: 600
  # ---------- db_bench readwhilewriting (fill -> settle -> 150s measured) ----------
  m1cache_dbb_rww:
    count: 1
    scene_id_template: "m1cache_dbb_rww_t{idx1}"
    template:
      base_scene: "scene/io_ext/dbbench.yml"
      parameters:
        <<: *common_dbbench
        phases:
        - name: "fillrandom"
          benchmark: "fillrandom"
        - name: "settle1"
          benchmark: "sleep"
          settle_sec: 75
        - name: "readwhilewriting"
          benchmark: "readwhilewriting"
          duration: 150
          args:
            threads: 4
            writes: 3000000
  # ---------- db_bench readrandom (fill -> settle -> 150s measured) ----------
  m1cache_dbb_rr:
    count: 1
    scene_id_template: "m1cache_dbb_rr_t{idx1}"
    template:
      base_scene: "scene/io_ext/dbbench.yml"
      parameters:
        <<: *common_dbbench
        phases:
        - name: "fillrandom"
          benchmark: "fillrandom"
        - name: "settle2"
          benchmark: "sleep"
          settle_sec: 75
        - name: "readrandom"
          benchmark: "readrandom"
          duration: 150
          args:
            threads: 4
  # ---------- Shore QPS50 open loop (~600s ROI) ----------
  m1cache_shore_qps50:
    count: 1
    scene_id_template: "m1cache_shore_qps50_t{idx1}"
    template:
      base_scene: "scene/io_ext/tailbench_shore.yml"
      parameters:
        target_device: "nvme0n1"
        output_dir: "/tmp/m1_cache_bm/scene/{group_id}"
        duration: 1000
        drop_caches_before_run: true   # attribution discipline (scene: tailbench_shore)
        scheduler: "none"
        io_ext:
          cleanup_stale_when_no_specs: true
          cleanup_bpffs_pins: true
          cgroup:
            path: "/sys/fs/cgroup/m1_cache_shore"   # accounting only; no io.* values
            controllers:
            - "io"
        tailbench:
          <<: *common_tailbench
          mode: "shore_integrated"
          # READ-ONLY bundle input (staging/m1_cache_bm_bundle/data/db-tpcc-1):
          # any reset must NEVER delete this file (runner resets only
          # data/m1_cache/* on the deploy root). Shore's own write traffic
          # (diskrw) goes to scratch_dir under the deploy-root data dir.
          data_file: "/opt/ioext/staging/m1_cache_bm_bundle/data/db-tpcc-1"
          env:
            TBENCH_CLIENT_THREADS: "2"
            TBENCH_QPS: "50"
            TBENCH_WARMUPREQS: "1000"
            TBENCH_MAXREQS: "30000"     # 30000/50 = 600s ROI (m1_solo spec)
            TBENCH_MINSLEEPNS: "10000"

test_sequences:
- sequence_id: "M1CACHE_YCSB_a"
  name: "M1 cache=on YCSB workloada (buffered, default 8MiB block cache, none)"
  io_ext_policy: "arm_m1cache_none"
  steps:
  - name: "ycsb workloada cache=on solo none"
    tenant_groups:
    - "m1cache_ycsb_a"
    monitoring_scenes:
    - "ib_system_metric"
    - "m1_pattern_sampler"
    monitoring_startup_time: 3
    duration: 1100
- sequence_id: "M1CACHE_YCSB_c"
  name: "M1 cache=on YCSB workloadc (buffered, default 8MiB block cache, none)"
  io_ext_policy: "arm_m1cache_none"
  steps:
  - name: "ycsb workloadc cache=on solo none"
    tenant_groups:
    - "m1cache_ycsb_c"
    monitoring_scenes:
    - "ib_system_metric"
    - "m1_pattern_sampler"
    monitoring_startup_time: 3
    duration: 1100
- sequence_id: "M1CACHE_DBB_rww"
  name: "M1 cache=on db_bench readwhilewriting (buffered + 32MiB cache, none)"
  io_ext_policy: "arm_m1cache_none"
  steps:
  - name: "dbbench readwhilewriting cache=on solo none"
    tenant_groups:
    - "m1cache_dbb_rww"
    monitoring_scenes:
    - "ib_system_metric"
    - "m1_pattern_sampler"
    monitoring_startup_time: 3
    duration: 900
- sequence_id: "M1CACHE_DBB_rr"
  name: "M1 cache=on db_bench readrandom (buffered + 32MiB cache, none)"
  io_ext_policy: "arm_m1cache_none"
  steps:
  - name: "dbbench readrandom cache=on solo none"
    tenant_groups:
    - "m1cache_dbb_rr"
    monitoring_scenes:
    - "ib_system_metric"
    - "m1_pattern_sampler"
    monitoring_startup_time: 3
    duration: 900
- sequence_id: "M1CACHE_SHORE_qps50"
  name: "M1 cache=on Shore QPS50 open loop (~600s ROI, none; buffered by nature)"
  io_ext_policy: "arm_m1cache_none"
  steps:
  - name: "shore qps50 cache=on solo none"
    tenant_groups:
    - "m1cache_shore_qps50"
    monitoring_scenes:
    - "ib_system_metric"
    - "m1_pattern_sampler"
    monitoring_startup_time: 3
    duration: 1000
