benchmark_name: isol_bench rig M2 fig2 replication (bare-metal bare metal)
description: 'M2'' motivation on bare-metal bm: near-verbatim replication of the isol-bench paper Fig.
  2 (IISWC''25) cgroups I/O knob arms + native kyber arm; three identical 64K randread QD8 fio apps rate-limited
  to 2644M MiB/s (bare-metal solo calibration), staggered A 0-50s / B 10-70s / C 20-50s, reading a preallocated
  32G direct=1 file (/opt/ioext/m2fig2/data/m2f2_data.bin) on nvme0n1; io.* knobs applied
  on per-tenant child cgroups. Generated by experiments/m1m2_bm/scripts/gen_m2_fig2_yamls_bm.py.'
fail_fast_on_scene_error: true
io_ext_policy_profiles:
  F2_h_io_cost_weight:
    name: M2F2 fig2 arm h_io_cost_weight (bare-metal)
    target_device: nvme0n1
    scheduler: none
    io_ext:
      cleanup_stale_when_no_specs: true
      cleanup_bpffs_pins: true
      root_cgroup:
        path: /sys/fs/cgroup
        controllers:
        - io
tenant_groups:
  m2f2_h_io_cost_weight:
    count: 3
    scene_id_template: ib_m2f2_h_io_cost_weight_t_{idx1}
    name_template: M2F2 (h) io.cost + io.weight tenant {idx1}
    template:
      base_scene: scene/io_ext/fio.yml
      parameters:
        target_device: nvme0n1
        file_name: /opt/ioext/m2fig2/data/m2f2_data.bin
        data_file_size_gb: 32
        scheduler: none
        scheduler_tunables: {}
        output_dir: ./test_results/isol_bench/rig_m2_fig2_bm/h_io_cost_weight
        duration: 110
        drop_caches_before_run: false
        cooldown_sec: 1
        fio_global:
          ioengine: io_uring
          direct: 1
          bs: 64k
          rw: randread
          iodepth: 8
          numjobs: 1
          rate: 2644M
          runtime_sec: 50
          startdelay: 0
          time_based: true
          group_reporting: true
          log_avg_msec: 1000
          write_bw_log: bw
        io_ext:
          cleanup_stale_when_no_specs: true
          cleanup_bpffs_pins: true
          cgroup:
            path: /sys/fs/cgroup/ib_m2f2_h_io_cost_weight_t_a
            controllers:
            - io
            io_cost:
              model: &id001
                ctrl: user
                model: linear
                rbps: 3465543680
                rseqiops: 846080
                rrandiops: 52880
                wbps: 3465543680
                wseqiops: 846080
                wrandiops: 52880
              qos: &id002
                enable: true
                ctrl: user
                rpct: 95.0
                rlat: 20000
                wpct: 95.0
                wlat: 20000
                min: 50.0
                max: 150.0
            io_weight: 1000
          root_cgroup:
            path: /sys/fs/cgroup
            controllers:
            - io
    per_tenant:
    - parameters:
        job_name: m2f2_h_io_cost_weight_a
        fio_global:
          runtime_sec: 50
          startdelay: 0
        io_ext:
          cgroup:
            path: /sys/fs/cgroup/ib_m2f2_h_io_cost_weight_t_a
            controllers:
            - io
            io_cost:
              model: *id001
              qos: *id002
            io_weight: 1000
    - parameters:
        job_name: m2f2_h_io_cost_weight_b
        fio_global:
          runtime_sec: 60
          startdelay: 10
        io_ext:
          cgroup:
            path: /sys/fs/cgroup/ib_m2f2_h_io_cost_weight_t_b
            controllers:
            - io
            io_cost:
              model: *id001
              qos: *id002
            io_weight: 1
    - parameters:
        job_name: m2f2_h_io_cost_weight_c
        fio_global:
          runtime_sec: 30
          startdelay: 20
        io_ext:
          cgroup:
            path: /sys/fs/cgroup/ib_m2f2_h_io_cost_weight_t_c
            controllers:
            - io
            io_cost:
              model: *id001
              qos: *id002
            io_weight: 100
test_sequences:
- sequence_id: M2F2_h_io_cost_weight
  name: M2F2 fig2 replication (h) io.cost + io.weight (bare-metal bare metal)
  io_ext_policy: F2_h_io_cost_weight
  steps:
  - name: m2f2 h_io_cost_weight
    tenant_groups:
    - m2f2_h_io_cost_weight
    duration: 110
    tenant_count: 3
default_sequence: M2F2_h_io_cost_weight
